<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live map core: particle looks</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--cyan:#6fe3ff;--dim:rgba(111,227,255,.55);--faint:rgba(111,227,255,.25);--bg:#0a121b}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:#d8f6ff;font:12px/1.4 ui-monospace,Consolas,monospace}
  body{overflow-x:hidden}
  header{display:flex;gap:18px;align-items:center;flex-wrap:nowrap;padding:10px 14px;border-bottom:1px solid var(--faint);background:#070b11;height:48px;overflow:hidden}
  #err{display:none;margin:10px 14px;padding:8px 10px;border:1px solid #f3b955;border-radius:6px;color:#f3b955;background:rgba(243,185,85,.08)}
  #err.on{display:block}
  #wrap{position:relative;margin:8px auto 0;overflow:hidden}
  body.sheet #wrap{margin:0}
  header h1{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin:0;white-space:nowrap}
  .grp{display:flex;gap:4px;align-items:center}
  .grp span{color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-right:4px}
  button{font:inherit;color:var(--dim);background:rgba(8,14,22,.8);border:1px solid var(--faint);border-radius:5px;padding:4px 8px;cursor:pointer;white-space:nowrap}
  button.on{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 8px rgba(111,227,255,.35)}
  #fps{margin-left:auto;color:var(--cyan);white-space:nowrap;min-width:230px;text-align:right}
  #stage{position:absolute;left:0;top:0;transform-origin:0 0}
  #stage canvas{position:absolute;left:0;top:0}
  body.sheet header{display:none}
  /* narrow windows and the hub's frame: the controls take two fixed rows and get smaller, rather than running off the edge */
  @media (max-width:1320px){
    header{display:grid;grid-template-columns:auto auto 1fr;grid-template-rows:auto auto;height:auto;row-gap:6px;column-gap:12px;padding:8px 10px}
    #states{grid-row:2;grid-column:1/3} #counts{grid-row:2;grid-column:3} #fps{grid-row:1;grid-column:3;min-width:0;font-size:11px}
    button{padding:3px 6px;font-size:11px}
  }
  @media (max-width:960px){ .grp span{display:none} header h1{display:none} #fps{grid-column:2/4} }
</style>
</head>
<body>
<header>
  <h1>Core looks</h1>
  <div class="grp" id="views"><span>View</span></div>
  <div class="grp" id="states"><span>State</span></div>
  <div class="grp" id="counts"><span>Points</span></div>
  <div id="fps"></div>
</header>
<div id="err"></div>
<div id="wrap"><div id="stage"><canvas id="bg"></canvas><canvas id="gl"></canvas><canvas id="fg"></canvas></div></div>
<script type="module">
// Mockups of the live map's orchestrator core (crux, 2026-11-17), for a Crux decision. Nothing here is used by the hub.
//   first  the first shot (commit 205b7a4): 760 particles as an atom, simulated on the CPU (ported as it was)
//   A      dense volumetric swarm: the whole sphere full; context = how far the bright core has grown
//   B      particles-only level: liquid of particles, a dense surface, thin mist above
//   C      galaxy: tilted disc with arms and a halo; context = radius of the bright bulge
// A, B and C move entirely in the vertex shader from fixed per-particle seeds (uploaded once) and a few uniforms,
// drawn into a half-float target with fading trails and a soft tone map (RGBA8 fallback).
// ?sheet=A|B|C|first|compare renders a still sheet for screenshots; no parameter = live page with count buttons.

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const mulberry = seed => () => { let t = (seed += 0x6d2b79f5); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const STRIDE = 7;

// ---------- hub colours (map-particles.js, models.js) ----------
const COLORS = { cyan: [0.44, 0.89, 1.0], accent: [0.56, 0.66, 1.0], white: [1.0, 0.97, 0.93], warm: [1.0, 0.88, 0.7], amber: [0.95, 0.73, 0.33], red: [0.98, 0.42, 0.46], violet: [0.74, 0.6, 1.0] };
const GOLD = [1.0, 0.82, 0.48];
const OPUS = [0xb4 / 255, 0x7c / 255, 1];
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

// ---------- states shown ----------
// fill = share of the way to the handoff threshold (1 = handoff due), as coreLook() in map-core.js
const STATES = [
  { id: 'idle30', label: 'IDLE · 30% TO HANDOFF', state: 'idle', fill: 0.3 },
  { id: 'work60', label: 'WORKING · 60%', state: 'working', fill: 0.6 },
  { id: 'near85', label: 'WORKING · 85%, NEAR HANDOFF', state: 'working', fill: 0.85 },
  { id: 'needs', label: 'NEEDS YOU · 45%', state: 'idle', fill: 0.45, needs: true },
  { id: 'due', label: 'HANDOFF DUE · 100%', state: 'idle', fill: 1 }
];
const LOOKS = {
  first: { name: 'FIRST SHOT (205b7a4)', gpu: -1, glass: false },
  A: { name: 'A · VOLUMETRIC SWARM', gpu: 0, glass: true },
  B: { name: 'B · PARTICLE LEVEL', gpu: 1, glass: true },
  C: { name: 'C · GALAXY', gpu: 2, glass: false }
};
const MOOD = { idle: { swirl: 0.1, pace: 0.3, bright: 0.85 }, working: { swirl: 1, pace: 1, bright: 1.05 } };
function coreLook(st) {
  const s = MOOD[st.state], energy = 0.6;   // effort high
  const fill = clamp(st.fill, 0, 1);
  return { hue: OPUS, fill, heat: smooth(clamp((fill - 0.8) / 0.2, 0, 1)), due: fill >= 1 ? 1 : 0, gold: 0, swirl: s.swirl,
    speed: s.pace * (0.55 + 0.9 * energy), energy, bright: s.bright, flare: st.needs ? 1 : 0 };
}
const RL = 0.955;
function levelFor(fill) {
  const f = clamp(fill, 0, 1); let a = 0, b = 2;
  for (let i = 0; i < 20; i++) { const s = (a + b) / 2; ((3 * s * s - s * s * s) / 4 < f) ? a = s : b = s; }
  return ((a + b) / 2 - 1) * RL;
}

// ---------- shaders ----------
const VS_SEEDS = `#version 300 es
precision highp float;
layout(location=0) in vec4 aA;
layout(location=1) in vec4 aB;
uniform vec2 uRes; uniform float uDpr;
uniform vec2 uC; uniform float uR;
uniform float uT, uRot, uWt;
uniform float uFill, uHeat, uSwirl, uEnergy, uBright, uGold, uDue, uPh, uFlash;
uniform vec3 uHue;
uniform vec4 uB;       // look B: level, radius where it meets the glass, whirlpool depth, wave height
uniform int uLook;
uniform float uSizeK, uDens;
out vec4 vCol;
const float TAU = 6.28318531;
const vec3 GOLD = vec3(1.0, 0.82, 0.48);
const vec3 WHITE = vec3(1.0);
const float CP = 0.93590, SP = 0.35227;   // the map's pitch, 0.36 rad
const float RL = 0.955;

vec3 dirOf(float u, float v) { float z = 2.0 * u - 1.0, a = TAU * v, r = sqrt(max(0.0, 1.0 - z * z)); return vec3(cos(a) * r, z, sin(a) * r); }
float gaussOf(float u, float v) { return sqrt(-2.0 * log(max(u, 1e-6))) * cos(TAU * v); }
// core space as the hub: x right, y down, z away; returns screen x, y (core radii), depth and size factor
vec4 project(vec3 p, float lensK) {
  float y1 = p.y * CP - p.z * SP, z2 = p.y * SP + p.z * CP, persp = 4.0 / (4.0 + z2);
  vec2 s = vec2(p.x, y1) * persp;
  float lens = 1.0 + lensK * (1.0 - min(1.0, dot(s, s))) * (1.0 + 0.5 * z2);
  return vec4(s * lens, z2, persp * lens);
}
float pulseAt(float rr) { if (uDue < 0.02) return 0.0; float d = (rr - uPh * 1.45) / 0.17; return uDue * exp(-d * d) * (1.0 - uPh * 0.75); }

// A: the whole sphere full of particles in slow orbital flow; the lit core grows with context
void lookA(out vec3 q, out vec3 col, out float a, out float size) {
  float rr0 = pow(aA.x, 0.33333) * 0.97;
  vec3 d = dirOf(aA.y, aA.z);
  float rho = length(d.xz) * rr0, h = d.y * rr0;
  float th = atan(d.z, d.x) + uRot * (0.3 + 0.95 * (1.0 - rr0));
  float arm = step(aB.y, 0.5 * uSwirl);   // working: half the swarm rides three vortex arms
  if (arm > 0.5) {
    float k = floor(aA.w * 3.0);
    th = k * TAU / 3.0 - 3.2 * rho + uRot * 0.85 + (aB.z - 0.5) * 0.6 * (0.3 + rho);
    h *= 0.3;
  }
  float wob = 0.025 + 0.045 * uSwirl * uEnergy;
  vec3 p = vec3(cos(th) * rho, -h, sin(th) * rho);
  float nuc = step(fract(aA.w * 7.3 + aB.z * 1.7), 0.05);   // a hot nucleus at the centre, as in the first shot
  if (nuc > 0.5) p = dirOf(aA.y, aA.z) * abs(gaussOf(aA.x, aB.y)) * 0.075 * (1.0 + 0.4 * uEnergy);
  p += wob * vec3(sin(aB.w * TAU + uT * (0.7 + aA.w)), sin(aB.z * TAU * 1.7 + uT * (0.5 + aB.x)), cos(aB.w * TAU * 1.3 + uT * (0.6 + aB.y)));
  const float AXT = 0.8;   // the swirl's axis leans toward the viewer, so the flow and the arms are seen from above
  p = vec3(p.x, p.y * cos(AXT) - p.z * sin(AXT), p.y * sin(AXT) + p.z * cos(AXT));
  float R = (1.0 - 0.06 * uHeat) * (1.0 + 0.018 * sin(uT * 1.7));
  p *= R;
  float rr = length(p), has = step(0.01, uFill);
  float Rlit = 0.97 * R * pow(max(uFill, 1e-4), 0.75);
  float lit = (1.0 - smoothstep(Rlit - 0.07, Rlit + 0.02, rr)) * has;
  float e = (rr - Rlit) / 0.03, edge = exp(-e * e) * has * (1.0 - uDue);
  float core = clamp(1.0 - rr / max(Rlit, 0.05), 0.0, 1.0);
  float pu = pulseAt(rr), g = max(uGold, max(uHeat, pu));
  vec3 hot = mix(uHue, WHITE, 0.08 + 0.4 * core * core * core);
  hot = mix(hot, mix(GOLD, WHITE, 0.35 * core * core), g);
  vec3 haze = mix(uHue * 0.7, GOLD * 0.8, max(uGold, uHeat * 0.35));
  col = mix(mix(haze, hot, lit), WHITE, edge * 0.45);
  float tw = 0.65 + 0.35 * sin(uT * (2.0 + 6.0 * aB.x) + aB.w * TAU);
  a = mix(0.07 + 0.06 * arm, (0.42 + 0.25 * uEnergy) * tw, lit) + edge * 1.1 + pu * 0.9;
  size = mix(0.75 + 0.45 * aB.x, 0.9 + 0.9 * aB.x * aB.x, lit) + edge * 0.5 + pu * 0.7;
  if (nuc > 0.5) { col = mix(mix(uHue, WHITE, 0.6), GOLD, max(uGold, uHeat)); a = 0.9 + 0.5 * uEnergy; size = 1.2 + aB.x; }
  q = p;
}

// B: the level kept, but all particles: a liquid of particles, a dense surface, mist through the rest
float surfAt(vec2 xz) {
  float r2 = dot(xz, xz);
  float s = uB.x - uB.z * max(0.0, 1.0 - r2 / (uB.y * uB.y));
  s += uB.w * (sin(5.1 * xz.x + uWt * 2.1) * cos(4.3 * xz.y - uWt * 1.3) + 0.5 * sin(7.3 * xz.y + uWt * 2.9));
  return s + 0.03 * exp(-max(0.0, uB.y - sqrt(r2)) / 0.06);
}
void lookB(out vec3 q, out vec3 col, out float a, out float size) {
  float rr0 = pow(aA.x, 0.33333) * RL;
  vec3 d = dirOf(aA.y, aA.z);
  float rho = length(d.xz) * rr0, h = d.y * rr0, th0 = atan(d.z, d.x);
  float has = step(0.012, uFill), lvl = uB.x, R = 1.0 - 0.05 * uHeat, pu;
  vec3 p;
  if (aA.w < 0.13 * has * (uB.y * uB.y) / (RL * RL)) {   // as many as the surface's area calls for   // the surface itself
    float rs = uB.y * 0.985 * sqrt(aB.x), th = TAU * aB.y + uRot * (0.5 + 0.9 * (1.0 - rs));
    vec2 xz = vec2(cos(th), sin(th)) * rs;
    p = vec3(xz.x, -surfAt(xz), xz.y) * R;
    pu = pulseAt(length(p));
    col = mix(mix(uHue, WHITE, 0.45), GOLD, max(uGold, max(uHeat * 0.9, pu)));
    a = 0.5 + 0.3 * sin(uT * 3.0 + aB.z * TAU); size = 1.0 + 0.8 * aB.z;
  } else if (h < lvl) {      // the liquid, carried round by the swirl
    float th = th0 + uRot * (0.5 + 0.9 * (1.0 - rho));
    vec2 xz = vec2(cos(th), sin(th)) * rho;
    float sq = sqrt(max(RL * RL - rho * rho, 1e-4)), top0 = min(lvl, sq), surf = surfAt(xz), top1 = min(surf, sq);
    float hh = (top0 + sq > 0.02) ? -sq + (h + sq) * (top1 + sq) / (top0 + sq) : h;
    float dd = surf - hh, skin = exp(-max(dd, 0.0) / 0.07), deep = clamp(dd / 1.3, 0.0, 1.0);
    p = vec3(xz.x, -hh, xz.y) * R;
    pu = pulseAt(length(p));
    col = uHue * (1.0 - 0.35 * deep);
    col = mix(col, GOLD, max(uGold, max(clamp(uHeat * 1.25 - dd * 0.8, 0.0, 1.0) * 0.9, pu)));
    col = mix(col, WHITE, 0.5 * skin);
    a = 0.30 + 0.45 * skin; size = 0.85 + 0.8 * aB.x + skin * 0.6;
  } else {                   // mist above the level, densest just over the surface
    float th = th0 + uRot * 0.15, above = h - lvl;
    p = vec3(cos(th) * rho, -h - 0.03 * sin(uT * 0.7 + aB.w * TAU), sin(th) * rho) * R;
    pu = pulseAt(length(p));
    col = mix(mix(uHue, WHITE, 0.15), GOLD, max(uGold, uHeat * 0.5));
    a = 0.045 + 0.12 * exp(-above / 0.18); size = 0.7 + 0.4 * aB.x;
  }
  a += pu * 0.9; size += pu * 0.6;
  q = p;
}

// C: a tilted galaxy; the bright bulge grows with context
const float TILT = 0.62, ROLL = -0.38;
void lookC(out vec3 q, out vec3 col, out float a, out float size) {
  float c = aA.w, armv = 0.0, halo = 0.0, rd;
  float Rb = (0.1 + 0.82 * pow(max(uFill, 1e-4), 0.8)) * (1.0 - 0.05 * uHeat);
  vec3 p;
  if (c < 0.14) {            // bulge
    float r = Rb * 0.7 * pow(aA.x, 0.6);
    vec3 d = dirOf(aA.y, aA.z);
    float th = atan(d.z, d.x) + uRot * 1.2, l = length(d.xz) * r;
    p = vec3(cos(th) * l, d.y * r * 0.55, sin(th) * l);
    rd = length(p);
  } else if (c < 0.84) {     // disc and arms
    float r = 0.05 + 0.93 * pow(aA.x, 0.7), th;
    if (aB.y < 0.4 + 0.45 * uSwirl) {
      float k = floor(aB.z * 2.0);
      th = k * 3.14159 + 2.3 * log(r / 0.05) + uRot * 0.55 + gaussOf(aB.w, fract(aB.x * 7.31)) * (0.34 - 0.16 * uSwirl) * (0.6 + 0.6 * r);
      armv = 1.0;
    } else th = TAU * aB.z + uRot * 0.9 / (0.35 + r);
    p = vec3(cos(th) * r, gaussOf(aA.y, aA.z) * 0.03 * (1.2 - r), sin(th) * r);
    rd = r;
  } else {                   // halo
    float r = 0.2 + 0.8 * pow(aA.x, 0.5);
    vec3 d = dirOf(aA.y, aA.z);
    float th = atan(d.z, d.x) + uRot * 0.12, l = length(d.xz) * r;
    p = vec3(cos(th) * l, d.y * r, sin(th) * l);
    rd = r; halo = 1.0;
  }
  p *= 1.0 - 0.05 * uHeat;
  p = vec3(p.x, p.y * cos(TILT) - p.z * sin(TILT), p.y * sin(TILT) + p.z * cos(TILT));
  p = vec3(p.x * cos(ROLL) - p.y * sin(ROLL), p.x * sin(ROLL) + p.y * cos(ROLL), p.z);
  float lit = (1.0 - smoothstep(Rb - 0.06, Rb + 0.02, rd)) * (1.0 - halo * 0.7);
  float core = clamp(1.0 - rd / Rb, 0.0, 1.0), pu = pulseAt(rd), g = max(uGold, max(uHeat, pu));
  vec3 hot = mix(mix(uHue, WHITE, 0.35 + 0.45 * core * core), mix(GOLD, WHITE, 0.3 * core * core), g);
  vec3 cool = mix(uHue * (0.45 + 0.3 * armv), GOLD * 0.8, max(uGold, uHeat * 0.35));
  float e = (rd - Rb) / 0.03, edge = exp(-e * e) * (1.0 - halo) * (1.0 - uDue);
  col = mix(mix(cool, hot, lit), WHITE, edge * 0.35);
  a = (halo > 0.5 ? 0.2 : mix(0.035 + 0.07 * armv, 0.55, lit)) + edge * 0.5 + pu * 0.9;
  size = (halo > 0.5 ? 0.7 : mix(0.8 + 0.6 * aB.x * armv, 1.0 + 0.8 * aB.x, lit)) + pu * 0.6 + edge * 0.4;
  q = p;
}

void main() {
  vec3 q, col; float a, size, lensK = 0.14;
  if (uLook == 0) lookA(q, col, a, size);
  else if (uLook == 1) lookB(q, col, a, size);
  else { lookC(q, col, a, size); lensK = 0.0; }
  // one particle in thirty is a spark: brighter, larger, whiter; the rest are a fine dust, so the volume reads as particles
  float spark = step(fract(aA.w * 13.7 + aB.w * 3.1), 0.035);
  a = mix(a * 0.28, a * 1.0 + 0.1, spark);
  size *= mix(0.8, 1.5, spark);
  col = mix(col, WHITE, 0.25 * spark);
  vec4 pr = project(q, lensK);
  vec2 cl = (uC + pr.xy * uR) / uRes * 2.0 - 1.0;
  gl_Position = vec4(cl.x, -cl.y, 0.0, 1.0);
  gl_PointSize = max(1.0, size * pr.w * uSizeK * uDpr * 2.2);
  col += (1.0 - col) * uFlash;
  vCol = vec4(col, a * uDens * uBright * clamp(1.1 - pr.z * 0.34, 0.35, 1.5) * (1.0 + uFlash * 0.6));
}`;

// the hub's own point shaders (map-gl.js), for the CPU particles: first shot, flare, motes
const VS_POINTS = `#version 300 es
layout(location=0) in vec2 aPos;
layout(location=1) in float aSize;
layout(location=2) in vec4 aCol;
uniform vec2 uRes;
uniform float uDpr;
out vec4 vCol;
void main() {
  vec2 c = aPos / uRes * 2.0 - 1.0;
  gl_Position = vec4(c.x, -c.y, 0.0, 1.0);
  gl_PointSize = max(1.0, aSize * uDpr * 2.2);
  vCol = aCol;
}`;
const FS_POINTS = `#version 300 es
precision mediump float;
in vec4 vCol;
out vec4 o;
void main() {
  vec2 d = gl_PointCoord * 2.0 - 1.0;
  float r2 = dot(d, d);
  if (r2 > 1.0) discard;
  float a = (exp(-r2 * 4.0) * 0.75 + exp(-r2 * 26.0) * 0.9) * vCol.a;
  o = vec4(vCol.rgb * a, a);
}`;
const VS_QUAD = `#version 300 es
out vec2 vUv;
void main() { vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); vUv = p; gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
const FS_FADE = `#version 300 es
precision mediump float;
in vec2 vUv; uniform sampler2D uTex; uniform float uFade; out vec4 o;
void main() { o = max(texture(uTex, vUv) * uFade - vec4(1.6 / 255.0), 0.0); }`;
// soft tone map: linear when faint, rolls off instead of clipping, the hottest spots go white
const FS_TONE = `#version 300 es
precision highp float;
in vec2 vUv; uniform sampler2D uTex; uniform int uFloat; out vec4 o;
void main() {
  vec3 c = texture(uTex, vUv).rgb;
  if (uFloat == 1) {
    float peak = max(c.r, max(c.g, c.b));
    c = 1.0 - exp(-c * 1.05);
    c = mix(c, vec3(1.0), smoothstep(1.4, 5.0, peak) * 0.55);
  } else c = min(c, vec3(1.0));
  o = vec4(c, max(c.r, max(c.g, c.b)));
}`;

class Renderer {
  constructor(canvas, preserve) {
    const gl = this.gl = canvas.getContext('webgl2', { premultipliedAlpha: true, alpha: true, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: preserve });
    if (!gl) throw new Error('WebGL2 is not available');
    this.canvas = canvas;
    this.float = !params.has('force8') && !!gl.getExtension('EXT_color_buffer_float');   // ?force8 tests the fallback
    if (!this.float) this.note = params.has('force8') ? '8-bit fallback forced' : 'no half-float targets in this browser; using the 8-bit fallback';
    this.seeds = this.program(VS_SEEDS, FS_POINTS);
    this.points = this.program(VS_POINTS, FS_POINTS);
    this.fade = this.program(VS_QUAD, FS_FADE);
    this.tone = this.program(VS_QUAD, FS_TONE);
    this.seedVao = gl.createVertexArray(); this.seedBuf = gl.createBuffer();
    gl.bindVertexArray(this.seedVao); gl.bindBuffer(gl.ARRAY_BUFFER, this.seedBuf);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 32, 0);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 16);
    this.cpuVao = gl.createVertexArray(); this.cpuBuf = gl.createBuffer();
    gl.bindVertexArray(this.cpuVao); gl.bindBuffer(gl.ARRAY_BUFFER, this.cpuBuf);
    const B = STRIDE * 4;
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, B, 0);

    this.stateId = STATES.some(s => s.id === params.get('state')) ? params.get('state') : 'work60';
    this.count = clamp(Number(params.get('n')) || REF_N, 1000, 500000);
    this.bg = document.getElementById('bg'); this.fg = document.getElementById('fg');
    this.renderer = new Renderer(document.getElementById('gl'), !!sheet);
    this.cpu = new Float32Array(200000 * STRIDE);
    this.dpr = Math.min(devicePixelRatio || 1, 2);
  }
  layout() {
    const cells = [], top = 34, lab = [];
    if (sheet && sheet !== 'compare') {
      STATES.forEach((st, i) => { cells.push(new Cell(sheet, st, 'open', i * OPEN.w, top), new Cell(sheet, st, 'strip', i * OPEN.w, top + OPEN.h)); lab.push([st.label, i * OPEN.w + OPEN.w / 2]); });
      this.title = LOOKS[sheet].name;
      this.W = STATES.length * OPEN.w;
    } else if (this.view === 'bench') {
      const st = STATES.find(s => s.id === this.stateId);
      cells.push(new Cell(this.benchLook || 'A', st, 'open', 0, top));
      this.title = 'FRAME-RATE TEST · ' + LOOKS[this.benchLook || 'A'].name; lab.push([LOOKS[this.benchLook || 'A'].name + ' · ' + st.label, OPEN.w / 2]);
      this.W = OPEN.w;
    } else {
      const st = STATES.find(s => s.id === (sheet === 'compare' ? 'work60' : this.stateId));
      ['first', 'A', 'B', 'C'].forEach((lk, i) => { cells.push(new Cell(lk, st, 'open', i * OPEN.w, top), new Cell(lk, st, 'strip', i * OPEN.w, top + OPEN.h)); lab.push([LOOKS[lk].name, i * OPEN.w + OPEN.w / 2]); });
      this.title = st.label; this.W = 4 * OPEN.w;
    }
    this.bench = this.view === 'bench' && !sheet;
    this.cells = cells; this.labels = lab; this.H = top + OPEN.h + (this.bench ? 0 : STRIP.h + 6);
    for (const cv of [this.bg, this.fg]) { cv.width = Math.round(this.W * this.dpr); cv.height = Math.round(this.H * this.dpr); cv.style.width = this.W + 'px'; cv.style.height = this.H + 'px'; }
    document.getElementById('stage').style.cssText = `width:${this.W}px;height:${this.H}px`;
    this.fit();
    this.renderer.resize(this.W, this.H, this.dpr);
    if (this.renderer.note) showError(this.renderer.note, false);
    if (this.renderer.nSeeds !== this.count) this.renderer.setSeeds(this.count);
    this.paintBg();
  }
  // centre the cores and shrink them to fit a small window or the hub's frame; never wider than the window (no sideways scroll)
  fit() {
    const wrap = document.getElementById('wrap'), stage = document.getElementById('stage');
    const top = sheet ? 0 : wrap.getBoundingClientRect().top + window.scrollY;
    const k = sheet ? 1 : Math.min(1, (document.documentElement.clientWidth - 16) / this.W, Math.max(0.25, (window.innerHeight - top - 8) / this.H));
    wrap.style.width = `${this.W * k}px`; wrap.style.height = `${this.H * k}px`;
    stage.style.transform = k < 1 ? `scale(${k})` : '';
  }
  paintBg() {
    const c = this.bg.getContext('2d');
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    c.fillStyle = '#0a121b'; c.fillRect(0, 0, this.W, this.H);
    for (const cell of this.cells) {
      const g = c.createRadialGradient(cell.cx, cell.cy, 0, cell.cx, cell.cy, cell.r * 3);
      g.addColorStop(0, 'rgba(40,60,90,0.25)'); g.addColorStop(1, 'rgba(10,18,27,0)');
      c.fillStyle = g; c.fillRect(cell.x, cell.y, cell.w, cell.h);
      paintHud(c, cell);
    }
    c.strokeStyle = 'rgba(111,227,255,0.1)'; c.lineWidth = 1;
    const y0 = 34 + OPEN.h;
    c.beginPath(); c.moveTo(0, y0 + 0.5); c.lineTo(this.W, y0 + 0.5); c.stroke();
    for (const [t, x] of this.labels) label(c, t, x, 18);
    if (sheet && sheet !== 'compare') label(c, this.title, 8, y0 + 12, 'rgba(216,246,255,0.9)', 'left', 11);
    if (this.bench) return;
    label(c, 'OPEN MAP', this.W - 8, 34 + 12, 'rgba(111,227,255,0.4)', 'right', 10);
    label(c, 'STRIP', this.W - 8, y0 + 12, 'rgba(111,227,255,0.4)', 'right', 10);
  }
  // one frame at time t: every cell's particles into the trail target, then the glass on top
  frame(t, dt) {
    const R = this.renderer, ph = (t % 2) / 2;
    R.begin(0.64);
    let o = 0;
    for (const cell of this.cells) {
      const L = LOOKS[cell.look], P = cell.P;
      if (L.gpu < 0) { cell.first.step(dt); o = cell.first.project(cell.cx, cell.cy, cell.r, this.cpu, o); continue; }
      const sizeK = clamp(cell.r / 90, 0.45, 1.15), sizeK0 = clamp(OPEN.r / 90, 0.45, 1.15);
      // a smaller core draws a prefix of the same seeds, so its glow per pixel stays the same
      const share = clamp((cell.r / OPEN.r) ** 2 / (sizeK / sizeK0) ** 2, 0.12, 1);
      const lvl = levelFor(P.fill) * (1 - 0.07 * P.heat), a = Math.sqrt(Math.max(RL * RL - lvl * lvl, 0.01));
      R.drawSeeds({
        uC: [cell.cx, cell.cy], uR: cell.r, uT: t, uRot: t * P.speed * (0.7 + 0.9 * P.energy), uWt: t * (0.8 + 1.6 * P.speed),
        uFill: P.fill, uHeat: P.heat, uSwirl: P.swirl, uEnergy: P.energy, uBright: P.bright, uGold: P.gold, uDue: P.due, uPh: ph, uFlash: 0,
        uHue: P.hue, uB: [lvl, a, P.swirl * (0.07 + 0.2 * P.energy) * Math.min(1, a * 1.4), (0.01 + 0.04 * P.energy * (0.3 + P.swirl)) * (1 - 0.5 * P.heat)],
        uLook: L.gpu, uSizeK: sizeK, uDens: (REF_N / this.count) ** 0.75 * (L.gpu === 1 ? 1.0 : 1.0)
      }, Math.round(this.count * share));
      o = motesAndFlare(this.cpu, o, cell, t);
    }
    R.drawCpu(this.cpu, o);
    R.end();
    const c = this.fg.getContext('2d');
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); c.clearRect(0, 0, this.W, this.H);
    for (const cell of this.cells) if (LOOKS[cell.look].glass) paintGlass(c, cell, t);
  }
  still() {
    const T = 8.8, F = 16, dt = 1 / 60;   // T puts the handoff pulse 40% of the way out
    for (let f = F; f >= 0; f--) this.frame(T - f * dt, dt);
    this.renderer.gl.finish();
    document.title = 'done';
  }
  // the three layers flattened into one PNG (for stills taken by a headless browser)
  composite() {
    const c = document.createElement('canvas'); c.width = this.bg.width; c.height = this.bg.height;
    const x = c.getContext('2d');
    for (const cv of [this.bg, this.renderer.canvas, this.fg]) x.drawImage(cv, 0, 0);
    return c.toDataURL('image/png');
  }
  live() {
    const fpsEl = document.getElementById('fps');
    let last = performance.now(), t = 3, times = [];
    const loop = now => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
      times.push(dt * 1000); if (times.length > 120) times.shift();
      this.frame(t, dt);
      if (times.length % 15 === 0) {
        const s = [...times].sort((a, b) => a - b), avg = s.reduce((a, b) => a + b, 0) / s.length;
        const cores = this.cells.filter(c => LOOKS[c.look].gpu >= 0).length;
        fpsEl.textContent = `${(1000 / avg).toFixed(0)} fps · ${avg.toFixed(1)} ms avg, ${s[Math.floor(s.length * 0.95)].toFixed(1)} ms slow · ${cores} core${cores > 1 ? 's' : ''}`;
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
  controls() {
    const add = (box, text, on, fn) => { const b = document.createElement('button'); b.textContent = text; b.onclick = () => { fn(); this.layout(); this.syncControls(); }; b.dataset.k = text; document.getElementById(box).appendChild(b); return b; };
    this.btn = [];
    this.btn.push(...[['Compare', 'compare', null], ['Test A', 'bench', 'A'], ['Test B', 'bench', 'B'], ['Test C', 'bench', 'C']].map(([t, v, lk]) => [add('views', t, 0, () => { this.view = v; this.benchLook = lk; }), () => this.view === v && (this.benchLook || null) === lk]));
    this.btn.push(...STATES.map(st => [add('states', st.label.split(' ·')[0].replace('WORKING', 'WORK') + ' ' + Math.round(st.fill * 100), 0, () => { this.stateId = st.id; }), () => this.stateId === st.id]));
    this.btn.push(...[10000, 30000, 60000, 120000, 250000, 500000].map(n => [add('counts', n >= 1000 ? n / 1000 + 'k' : n, 0, () => { this.count = n; }), () => this.count === n]));
    this.syncControls();
  }
  syncControls() { for (const [b, on] of this.btn) b.classList.toggle('on', !!on()); }
}

// a visible line when something fails, instead of a blank page
function showError(msg, fatal = true) {
  const el = document.getElementById('err');
  el.textContent = (fatal ? 'The particles cannot be drawn here: ' : 'Note: ') + msg;
  el.classList.add('on');
}
window.addEventListener('error', e => showError(e.message || String(e.error)));
try {
  if (sheet) document.body.classList.add('sheet');
  const page = window.page = new Page();
  if (sheet) { page.layout(); page.still(); }
  else { page.controls(); page.layout(); page.live(); addEventListener('resize', () => page.fit()); }
  page.renderer.canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); showError('the graphics card dropped the drawing (context lost); reload the page'); });
} catch (err) {
  showError(/WebGL2/.test(err.message) ? 'this browser has no WebGL2. Open the page in an up-to-date Chrome or Edge, with hardware acceleration on.' : err.message);
  console.error(err);
}
</script>
</body>
</html>
