<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robot lab</title>
<!-- M015: style directions for the model-family robots. ?w=390 forces phone width; ?only=glyph|mech|visor shows one direction. -->
<style>
  :root{--hud-cyan:#6fe3ff;--hud-ice:#d8f6ff;--hud-dim:rgba(111,227,255,.55);--hud-line:rgba(111,227,255,.16);--hud-red:#f2727a;--mono:"Cascadia Mono",Consolas,ui-monospace,monospace}
  html,body{margin:0;background:#070b11;color:#e8eef5;font-family:system-ui,"Segoe UI",sans-serif;overflow-x:hidden}
  #sheet{padding:16px 18px 22px;box-sizing:border-box;
    background:linear-gradient(rgba(111,227,255,.035) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(111,227,255,.035) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(180deg,#0b121c,#06090e)}
  h1{font:600 13px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--hud-ice);margin:0 0 14px}
  .cols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:16px}
  .col{border:1px solid var(--hud-line);background:rgba(7,11,17,.6);padding:14px 14px 16px;min-width:0;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
  .col h2{font:600 12px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--hud-cyan);margin:0 0 4px}
  .col p{font-size:13px;line-height:1.4;color:#9fb6c8;margin:0 0 12px;min-height:36px}
  .lab{font:600 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--hud-dim);margin:14px 0 8px;padding-top:10px;border-top:1px solid var(--hud-line)}
  .fam{display:grid;grid-template-columns:24px 48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:6px 0;color:var(--mh)}
  .fam .big{justify-self:center}
  .fam .who{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;text-align:right;white-space:nowrap}
  .fam .who i{display:block;font:400 11px system-ui,"Segoe UI",sans-serif;letter-spacing:0;text-transform:none;color:#8296a8;margin-top:2px}
  .bot{display:block;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round;overflow:visible}
  .bot .f{fill:color-mix(in srgb,currentColor 15%,transparent)}
  .bot .g{fill:color-mix(in srgb,currentColor calc(var(--glow) * 100%),transparent);stroke:none;filter:drop-shadow(0 0 calc(var(--glow) * 3px) currentColor)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:nowrap}
  .eff{display:flex;gap:10px;align-items:flex-end;color:#b47cff}
  .eff span{display:grid;justify-items:center;gap:4px;font:500 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--hud-dim)}
  .eff .bot{color:#b47cff}
  /* a live-map station, as in map.css */
  .stations{display:flex;gap:20px;justify-content:space-between;padding:6px 6px 0}
  .st{display:grid;justify-items:center;gap:7px;color:var(--mh)}
  .st .body{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--mh) 22%,transparent),rgba(6,12,20,.94) 70%);box-shadow:inset 0 0 0 1px var(--mh),0 0 18px color-mix(in srgb,var(--mh) 35%,transparent)}
  .st .body::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--mh) 70%,transparent)}
  .st b{font:600 10.5px var(--mono);letter-spacing:.06em;color:var(--hud-ice)}
  .st.needs .badge{position:absolute;right:-7px;top:-7px;min-width:15px;height:15px;border-radius:8px;background:var(--hud-red);color:#2a0609;font:700 10px/15px var(--mono);text-align:center;box-shadow:0 0 0 2px #070b11}
  /* a sidebar thread row */
  .side{display:grid;gap:6px}
  .thr{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center;padding:7px 9px;border-radius:10px;background:#131a24}
  .thr .ava{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mh);background:color-mix(in srgb,var(--mh) 12%,#0d131b);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--mh) 60%,transparent)}
  .thr b{display:block;font-size:13.5px;font-weight:600}.thr i{display:block;font-style:normal;font-size:12px;color:#8a98a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .phone .cols{grid-template-columns:minmax(0,1fr)}
  .phone .fam{grid-template-columns:24px 48px minmax(0,1fr) auto;gap:10px}
  .phone .stations{gap:8px}
</style>
</head>
<body>
<div id="sheet"></div>
<script type="module">
import { STYLES, FAMILIES, robotSvg } from './robot-styles.js';
const q = new URLSearchParams(location.search);
const W = Number(q.get('w')) || innerWidth, phone = W <= 720;
document.body.style.width = W + 'px';
const sheet = document.getElementById('sheet');
sheet.classList.toggle('phone', phone);
const only = q.get('only');
const keys = Object.keys(STYLES).filter(k => !only || k === only);
const letter = k => 'ABC'[Object.keys(STYLES).indexOf(k)];
const EFFORT = [['low', 0.3], ['med', 0.48], ['high', 0.66], ['xhigh', 0.83], ['max', 1]];
const col = k => {
  const s = STYLES[k], big = phone ? 96 : 128;
  return `<section class="col"><h2>${letter(k)} · ${s.name}</h2><p>${s.line}</p>
    <div class="lab" style="margin-top:0">24px · 48px · ${big}px</div>
    ${FAMILIES.map(f => `<div class="fam" style="--mh:${f.hue}">${robotSvg(k, f.id, { size: 24 })}${robotSvg(k, f.id, { size: 48 })}<span class="big">${robotSvg(k, f.id, { size: big })}</span><span class="who">${f.name}<i>${f.note}</i></span></div>`).join('')}
    <div class="lab">Effort as eye glow (Opus, low to max)</div>
    <div class="eff">${EFFORT.map(([n, g]) => `<span>${robotSvg(k, 'opus', { size: 40, glow: g })}${n}</span>`).join('')}</div>
    <div class="lab">On the live map (one waits on Matt)</div>
    <div class="stations">${FAMILIES.map((f, i) => `<div class="st ${i === 2 ? 'needs' : ''}" style="--mh:${f.hue}"><span class="body">${robotSvg(k, f.id, { size: 26 })}${i === 2 ? '<span class="badge">1</span>' : ''}</span><b>${f.name.toLowerCase()}</b></div>`).join('')}</div>
    <div class="lab">In the sidebar</div>
    <div class="side">${FAMILIES.slice(1, 4).map((f, i) => `<div class="thr" style="--mh:${f.hue}"><span class="ava">${robotSvg(k, f.id, { size: 24 })}</span><span><b>${['reviewer', 'map-core', 'researcher'][i]}</b><i>${['Reading the whole change before Matt click-tests it', 'Posted three style directions', 'Looking up the licence'][i]}</i></span></div>`).join('')}</div>
  </section>`;
};
sheet.innerHTML = `<h1>Model robots · three style directions</h1><div class="cols" style="--n:${keys.length}">${keys.map(col).join('')}</div>`;
document.title = 'ready';
</script>
</body>
</html>
