<!doctype html>
<html lang="en" data-hud>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Crux Hub</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#0b0d11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crux">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="map.css">
<link rel="stylesheet" href="robots.css">
<link rel="stylesheet" href="usage.css">
<link rel="stylesheet" href="hud.css">
<link rel="stylesheet" href="columns.css">
<link rel="stylesheet" href="all-projects.css">
<link rel="stylesheet" href="pictures.css">
<link rel="stylesheet" href="project-settings.css">
</head>
<body>
<div id="app" class="app">
  <aside class="side" id="side">
    <header class="side-head">
      <img src="icon.svg" alt="" width="22" height="22">
      <strong>Crux Hub</strong>
      <div class="hub-menu-wrap">
        <button class="btn ghost icon-only" id="hub-menu-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Hub menu" title="Hub menu"><svg class="icon"><use href="#i-more"/></svg></button>
        <div id="hub-menu" class="hub-menu" role="menu" aria-label="Hub" hidden></div>
      </div>
    </header>
    <div id="hub-switches" class="hub-switches"></div>
    <!-- Decision 42: All projects, the hub-wide row above the project switcher (app.js renderHubThreads). -->
    <nav id="hub-threads" class="hub-threads" aria-label="Every project" hidden></nav>
    <nav id="projects" class="projects" aria-label="Projects"></nav>
    <nav id="threads" class="threads" aria-label="Threads"></nav>
    <div class="side-foot">
      <button class="btn ghost wide" id="new-agent"><svg class="icon"><use href="#i-plus"/></svg>New agent</button>
    </div>
  </aside>
  <div id="side-grip" class="side-grip" title="Drag to widen the list. Double-click for the default width." aria-hidden="true"></div>

  <div id="hud" class="hud-slot"></div>

  <!-- The conversation area (decision 39 A): one column per open thread, up to three, then the rail (columns.js). -->
  <div class="cols" id="cols"></div>
  <div id="win-park" hidden>
    <!-- The window's own buttons: columns.js keeps them at the end of the right-most column's header. -->
    <span class="win-acts" id="win-acts">
      <button class="btn ghost icon-only" id="phone-alerts" hidden aria-label="Phone notifications" title="Phone notifications"><svg class="icon"><use href="#i-bell"/></svg></button>
      <button class="btn ghost" id="open-board" title="The memory board"><svg class="icon"><use href="#i-board"/></svg>Board</button>
      <a class="btn ghost" id="all-projects" href="/all" target="_blank" rel="noopener" title="Every project's decision records (the roll-up page), in a new tab"><svg class="icon"><use href="#i-page"/></svg>All decisions<svg class="icon ext" aria-hidden="true"><use href="#i-external"/></svg></a>
    </span>
  </div>
  <template id="conv-tpl">
    <section class="main conv">
      <header class="main-head">
        <button class="btn ghost icon-only back" data-c="back" aria-label="Back to threads"><svg class="icon"><use href="#i-back"/></svg></button>
        <div class="title-block">
          <h1 class="c-title">Crux Hub</h1>
          <div class="sub c-sub"></div>
        </div>
        <span class="colbadge c-badge" hidden></span>
        <div class="head-actions">
          <button type="button" class="btn ghost icon-only c-pin" data-c="pin" aria-pressed="false"><svg class="icon"><use href="#i-pin"/></svg></button>
          <button type="button" class="btn ghost icon-only c-close" data-c="close" hidden aria-label="Close this column" title="Close this column"><svg class="icon"><use href="#i-x"/></svg></button>
          <button type="button" class="btn ghost c-retire-finished" data-c="retire-finished" hidden title="This worker's job is done: stop it, no replacement"><svg class="icon"><use href="#i-check"/></svg>Retire</button>
          <button type="button" class="btn ghost c-retire" data-c="retire" hidden title="Hand the work to a fresh agent: it writes a handoff first"><svg class="icon"><use href="#i-handoff"/></svg>Hand off</button>
        </div>
      </header>
      <section class="feed" aria-live="polite"></section>
      <div class="activity"></div>
      <form class="composer">
        <div class="quick" role="group" aria-label="Quick replies" hidden></div>
        <div class="tray" hidden></div>
        <div class="attach-error" role="alert" hidden></div>
        <div class="compose-row">
          <button type="button" class="btn ghost icon-only attach" aria-label="Attach files" title="Attach images, PDFs or text files (CSV, Markdown, JSON, code). Images up to 10 MB, PDFs and text up to 25 MB, 6 per message. You can also paste or drop them."><svg class="icon"><use href="#i-clip"/></svg></button>
          <input type="file" class="c-file" multiple hidden>
          <textarea class="c-input" rows="1" placeholder="Message" enterkeyhint="send" aria-label="Message"></textarea>
          <button class="btn primary icon-only c-send" aria-label="Send"><svg class="icon"><use href="#i-send"/></svg></button>
        </div>
      </form>
    </section>
  </template>
  <div id="drop-veil" class="drop-veil" hidden><div><svg class="icon"><use href="#i-clip"/></svg><span>Drop images, PDFs or text files to attach</span></div></div>

  <aside class="board" id="board" hidden>
    <header class="board-head">
      <h2><span class="hud-k">Memory</span>Board</h2>
      <span id="board-total" class="board-total"></span>
      <button class="btn ghost icon-only" id="close-board" aria-label="Close board" title="Close the board"><svg class="icon"><use href="#i-x"/></svg></button>
    </header>
    <div class="board-tools">
      <label class="board-filter"><svg class="icon"><use href="#i-search"/></svg><input id="board-filter" type="search" placeholder="Filter: words, D0031, R005" aria-label="Filter the board" autocomplete="off" spellcheck="false"></label>
    </div>
    <div id="board-body" class="board-body"></div>
  </aside>
</div>

<div id="mmenu" class="mmenu" role="dialog" aria-label="Model and effort" hidden></div>

<div id="restarting" class="restarting" role="status" aria-live="polite" hidden>
  <div class="rs-panel">
    <svg class="rs-ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20"/><path d="M24 4a20 20 0 0 1 20 20"/></svg>
    <div class="rs-text"><b id="rs-title">Restarting the hub…</b><span id="rs-sub" class="faint">This page reconnects by itself.</span></div>
    <button class="btn ghost icon-only" id="rs-close" aria-label="Hide" title="Hide this; the page keeps reconnecting"><svg class="icon"><use href="#i-x"/></svg></button>
  </div>
</div>

<dialog id="agent-dialog" class="dialog">
  <form method="dialog" id="agent-form">
    <h2>New agent</h2>
    <label>Name <input name="name" required pattern="[A-Za-z0-9-]+" placeholder="solver-port"></label>
    <label>Type <select name="type" id="agent-type"></select></label>
    <p class="type-desc faint" id="agent-type-desc"></p>
    <div class="field"><span class="flabel">Model</span><div id="agent-model"></div></div>
    <div class="field"><span class="flabel">Effort</span><div id="agent-effort"></div></div>
    <label>Task <textarea name="task" rows="4" required placeholder="What should it work on?"></textarea></label>
    <div class="row end">
      <button class="btn ghost" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" value="ok">Start</button>
    </div>
  </form>
</dialog>

<dialog id="confirm" class="dialog hud-confirm" aria-labelledby="confirm-title">
  <form method="dialog">
    <span class="hud-k" id="confirm-k">Confirm</span>
    <h2 id="confirm-title"></h2>
    <p id="confirm-body" class="muted"></p>
    <div class="row end">
      <button class="btn ghost" value="cancel">Cancel</button>
      <button class="btn primary" value="ok" id="confirm-ok">OK</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="alert" hidden></div>
<div id="link" class="link-light" role="status" aria-live="polite" hidden><i></i><span>Link lost · reconnecting</span></div>

<dialog id="viewer" class="viewer" aria-label="Image">
  <div class="viewer-bar">
    <span id="viewer-cap" class="viewer-cap"></span>
    <button class="btn ghost icon-only" id="viewer-copy" aria-label="Copy image" title="Copy image"><svg class="icon"><use href="#i-copy"/></svg></button>
    <a class="btn ghost icon-only" id="viewer-save" aria-label="Download image" title="Download image" download><svg class="icon"><use href="#i-download"/></svg></a>
    <button class="btn ghost icon-only" id="viewer-close" aria-label="Close" title="Close"><svg class="icon"><use href="#i-x"/></svg></button>
  </div>
  <img id="viewer-img" alt="">
</dialog>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/><path d="M11.5 13.5L20 4"/></symbol>

<script type="module" src="app.js"></script>
</body>
</html>
