<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crux Hub</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#0b0d11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crux">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="map.css">
<link rel="stylesheet" href="robots.css">
</head>
<body>
<div id="app" class="app">
  <aside class="side" id="side">
    <header class="side-head">
      <img src="icon.svg" alt="" width="22" height="22">
      <strong>Crux Hub</strong>
      <div class="hub-menu-wrap">
        <button class="btn ghost icon-only" id="hub-menu-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Hub menu" title="Hub menu"><svg class="icon"><use href="#i-more"/></svg></button>
        <div id="hub-menu" class="hub-menu" role="menu" aria-label="Hub" hidden></div>
      </div>
    </header>
    <nav id="projects" class="projects" aria-label="Projects"></nav>
    <nav id="threads" class="threads" aria-label="Threads"></nav>
    <div class="side-foot">
      <button class="btn ghost wide" id="new-agent"><svg class="icon"><use href="#i-plus"/></svg>New agent</button>
    </div>
  </aside>

  <div id="hud" class="hud-slot"></div>

  <main class="main" id="main">
    <header class="main-head">
      <button class="btn ghost icon-only back" id="back" aria-label="Back to threads"><svg class="icon"><use href="#i-back"/></svg></button>
      <div class="title-block">
        <h1 id="thread-title">Crux Hub</h1>
        <div id="thread-sub" class="sub"></div>
      </div>
      <div class="head-actions">
        <button class="btn ghost" id="retire-finished" hidden title="This worker's job is done: stop it, no replacement"><svg class="icon"><use href="#i-check"/></svg>Retire</button>
        <button class="btn ghost" id="retire" hidden title="Hand the work to a fresh agent: it writes a handoff first"><svg class="icon"><use href="#i-handoff"/></svg>Hand off</button>
        <button class="btn ghost icon-only" id="route-perms" hidden aria-pressed="true"><svg class="icon"><use href="#i-shield"/></svg></button>
        <button class="btn ghost icon-only" id="phone-alerts" hidden aria-label="Phone notifications" title="Phone notifications"><svg class="icon"><use href="#i-bell"/></svg></button>
        <button class="btn ghost" id="open-board"><svg class="icon"><use href="#i-board"/></svg>Board</button>
        <a class="btn ghost" id="all-projects" href="/all" target="_blank" rel="noopener" title="Every project's decisions, in a new tab"><svg class="icon"><use href="#i-projects"/></svg>All projects<svg class="icon ext" aria-hidden="true"><use href="#i-external"/></svg></a>
      </div>
    </header>
    <section id="feed" class="feed" aria-live="polite"></section>
    <div id="activity" class="activity"></div>
    <form id="composer" class="composer">
      <div id="quick" class="quick" role="group" aria-label="Quick replies" hidden></div>
      <div id="tray" class="tray" hidden></div>
      <div id="attach-error" class="attach-error" role="alert" hidden></div>
      <div class="compose-row">
        <button type="button" class="btn ghost icon-only attach" id="attach" aria-label="Attach images" title="Attach images: PNG, JPEG, GIF or WebP, up to 10 MB each. You can also paste or drop them."><svg class="icon"><use href="#i-clip"/></svg></button>
        <input type="file" id="file-pick" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
        <textarea id="input" rows="1" placeholder="Message the orchestrator. Short replies like 'all' or '4A 7B' pick decisions."></textarea>
        <button class="btn primary icon-only" id="send" aria-label="Send"><svg class="icon"><use href="#i-send"/></svg></button>
      </div>
    </form>
    <div id="drop-veil" class="drop-veil" hidden><div><svg class="icon"><use href="#i-image"/></svg>Drop images to attach</div></div>
  </main>

  <aside class="board" id="board" hidden>
    <header class="board-head">
      <h2><span class="hud-k">Memory</span>Board</h2>
      <span id="board-total" class="board-total"></span>
      <button class="btn ghost icon-only" id="close-board" aria-label="Close board" title="Close the board"><svg class="icon"><use href="#i-x"/></svg></button>
    </header>
    <div class="board-tools">
      <label class="board-filter"><svg class="icon"><use href="#i-search"/></svg><input id="board-filter" type="search" placeholder="Filter: words, D0031, R005" aria-label="Filter the board" autocomplete="off" spellcheck="false"></label>
    </div>
    <div id="board-body" class="board-body"></div>
  </aside>
</div>

<div id="mmenu" class="mmenu" role="dialog" aria-label="Model and effort" hidden></div>

<div id="restarting" class="restarting" role="status" aria-live="polite" hidden>
  <div class="rs-panel">
    <svg class="rs-ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20"/><path d="M24 4a20 20 0 0 1 20 20"/></svg>
    <div class="rs-text"><b id="rs-title">Restarting the hub…</b><span id="rs-sub" class="faint">This page reconnects by itself.</span></div>
    <button class="btn ghost icon-only" id="rs-close" aria-label="Hide" title="Hide this; the page keeps reconnecting"><svg class="icon"><use href="#i-x"/></svg></button>
  </div>
</div>

<dialog id="agent-dialog" class="dialog">
  <form method="dialog" id="agent-form">
    <h2>New agent</h2>
    <label>Name <input name="name" required pattern="[A-Za-z0-9-]+" placeholder="solver-port"></label>
    <label>Type <select name="type" id="agent-type"></select></label>
    <p class="type-desc faint" id="agent-type-desc"></p>
    <div class="field"><span class="flabel">Model</span><div id="agent-model"></div></div>
    <div class="field"><span class="flabel">Effort</span><div id="agent-effort"></div></div>
    <label>Task <textarea name="task" rows="4" required placeholder="What should it work on?"></textarea></label>
    <div class="row end">
      <button class="btn ghost" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" value="ok">Start</button>
    </div>
  </form>
</dialog>

<dialog id="confirm" class="dialog hud-confirm" aria-labelledby="confirm-title">
  <form method="dialog">
    <span class="hud-k" id="confirm-k">Confirm</span>
    <h2 id="confirm-title"></h2>
    <p id="confirm-body" class="muted"></p>
    <div class="row end">
      <button class="btn ghost" value="cancel">Cancel</button>
      <button class="btn primary" value="ok" id="confirm-ok">OK</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="alert" hidden></div>
<div id="link" class="link-light" role="status" aria-live="polite" hidden><i></i><span>Link lost · reconnecting</span></div>

<dialog id="viewer" class="viewer" aria-label="Image">
  <div class="viewer-bar">
    <span id="viewer-cap" class="viewer-cap"></span>
    <button class="btn ghost icon-only" id="viewer-copy" aria-label="Copy image" title="Copy image"><svg class="icon"><use href="#i-copy"/></svg></button>
    <a class="btn ghost icon-only" id="viewer-save" aria-label="Download image" title="Download image" download><svg class="icon"><use href="#i-download"/></svg></a>
    <button class="btn ghost icon-only" id="viewer-close" aria-label="Close" title="Close"><svg class="icon"><use href="#i-x"/></svg></button>
  </div>
  <img id="viewer-img" alt="">
</dialog>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/><path d="M11.5 13.5L20 4"/></symbol>
    <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-handoff" viewBox="0 0 24 24"><path d="M4 12h12"/><path d="M12 7l5 5-5 5"/><path d="M20 5v14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
    <symbol id="i-projects" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M9 6h9v9"/><path d="M18 6L7 17"/></symbol>
    <symbol id="i-page" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.4 5 5.4.7-4 3.7 1 5.4L12 16.3 7.2 18.8l1-5.4-4-3.7 5.4-.7z"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13l2.5-8h11L20 13v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/></symbol>
    <symbol id="i-orch" viewBox="0 0 24 24"><circle cx="12" cy="6" r="2.5"/><circle cx="6" cy="17" r="2.5"/><circle cx="18" cy="17" r="2.5"/><path d="M11 8.2L7.2 14.8M13 8.2l3.8 6.6"/></symbol>
    <symbol id="i-agent" viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="11" rx="3"/><path d="M12 4v3M9.5 12h.01M14.5 12h.01"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8.2-8.2a3.4 3.4 0 0 1 4.8 4.8l-8.1 8.1a1.7 1.7 0 0 1-2.4-2.4l7.4-7.4"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17.5l5-4.5 3.5 3 3-2.5 4.5 4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19.5h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5"/><path d="M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v4"/></symbol>
  </defs>
</svg>
<script type="module" src="app.js"></script>
</body>
</html>
