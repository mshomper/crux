[package]
name = "crux-hub"
version = "0.3.0"
description = "Crux Hub desktop app: the hub, its Node, a window, a tray icon and PC notices (decisions 49, 52, 54, 58)"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 2.11.1 or later: CVE-2026-42184 (remote-URL IPC). The window loads the hub's own address and is given no IPC.
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde_json = "1"
# Signed updates from GitHub Releases, installed from the tray (Matt's OK, 2026-11-13).
tauri-plugin-updater = "2"
# Windows notices with a click callback, so a click opens the exact card (decision 58 A, approved with the pick).
tauri-winrt-notification = "0.8.1"

[target.'cfg(windows)'.dependencies]
# Asks Windows whether notices are on (Matt's OK, 2026-11-14). Same version and feature the toast crate already builds.
windows = { version = "0.62.2", features = ["UI_Notifications"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
