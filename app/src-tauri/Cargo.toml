[package]
name = "crux-hub"
version = "0.1.0"
description = "Crux Hub desktop app: a window and tray icon on top of the local hub (decision 49)"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 2.11.1 or later: CVE-2026-42184 (remote-URL IPC). The window loads the hub's own address and is given no IPC.
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
