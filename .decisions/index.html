<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cg fill='none' stroke='%23a2aab7' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M24 44V27M24 27L10 12M24 27V9'/%3E%3Ccircle cx='10' cy='10' r='3'/%3E%3Ccircle cx='24' cy='6' r='3'/%3E%3C/g%3E%3Cpath d='M24 27L38 12' stroke='%238ea8ff' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='39' cy='10' r='5' fill='%238ea8ff'/%3E%3Ccircle cx='24' cy='27' r='3.5' fill='%238ea8ff'/%3E%3C/svg%3E">
<title>Crux · Decisions</title>
<style>
:root{--bg:#0b0d11;--panel:#10141a;--lane:#12161c;--surface:#191e26;--surface2:#1e242d;--raised:#1b2029;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.12);--text:#e7eaf0;--muted:#a2aab7;--faint:#6c7584;--accent:#8ea8ff;--accent-ink:#0d1530;--accent-bg:rgba(142,168,255,.14);--good:#5fd3ae;--good-bg:rgba(95,211,174,.13);--warn:#f3b955;--warn-bg:rgba(243,185,85,.13);--bad:#f2727a;--bad-bg:rgba(242,114,122,.13);--chosen:#5fd3ae;--hist:#8792ad;--radius:10px;--font:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,sans-serif;--mono:"Cascadia Mono",Consolas,ui-monospace,monospace;--good-fill:#5fd3ae;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
main{max-width:1240px;margin:0 auto;padding:18px 18px 48px}
h1{font-size:21px;font-weight:600;margin:4px 0 8px;line-height:1.3}
h2{font-size:14px;font-weight:600;margin:26px 0 10px;color:var(--text);letter-spacing:.1px}
h3{font-size:14.5px;font-weight:600;margin:0}
p{margin:0 0 10px}
a{color:var(--accent)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;background:transparent;color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.chip.open{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.chip.decided{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.found{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.superseded,.chip.rejected{text-decoration:line-through}
.icon{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.btn{font:inherit;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--text);cursor:pointer}
.btn:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.18)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600}
input,textarea{font:inherit;width:100%;max-width:100%;padding:8px 11px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--text)}
input::placeholder,textarea::placeholder{color:var(--faint)}
svg{max-width:100%}

.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;color:var(--text);font-weight:600;font-size:16px}
.brand .mark{width:24px;height:24px}
.brand .repo{color:var(--muted);font-weight:400}
.search{position:relative;flex:0 1 280px;min-width:180px}
.search .icon{position:absolute;left:10px;top:9px;color:var(--faint)}
.search input{padding-left:32px}
.sub{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:9px 0 4px;font-size:12.5px;color:var(--muted)}
.sub .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;margin-top:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.ptitle{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:10px;display:flex;gap:7px;align-items:center}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--lane);gap:2px}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.tile{display:grid;place-items:center;aspect-ratio:1.35;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--text);font-family:var(--mono);font-size:12.5px;position:relative;border-top:3px solid var(--c)}
.tile:hover{background:var(--surface2)}
.tile small{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:var(--font);font-size:10.5px;color:var(--faint);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px}
.areas{display:grid;gap:8px}
.area{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:13px}
.area .pips{display:flex;flex-wrap:wrap;gap:3px}
.area .pips a{width:16px;height:16px;border-radius:4px;background:var(--c);opacity:.85;display:block}
.area .pips a:hover{opacity:1;outline:1px solid var(--text)}
.area .n{color:var(--faint);font-size:12px}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px;align-items:start}
.lane{background:var(--lane);border:1px solid var(--line);border-radius:var(--radius);padding:10px;border-top:3px solid var(--c);min-width:0}
.lhead{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;padding:2px 2px 10px}
.lhead .icon{color:var(--c)}
.lhead .count{color:var(--faint);font-weight:400}
.lhint{font-size:12px;color:var(--faint);padding:0 2px 8px;margin-top:-6px}
.cards{display:grid;gap:8px}
.dcard{display:grid;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;text-decoration:none;color:var(--text)}
.dcard:hover{background:var(--surface2);border-color:var(--line2)}
.dcard .t{font-weight:500;font-size:13.5px;line-height:1.35}
.dcard .num{font-family:var(--mono);color:var(--faint);font-size:11.5px}
.dcard .line{font-size:12.5px;color:var(--muted);line-height:1.4}
.dcard .line.warn{color:var(--warn)}
.dcard .line.ok{color:var(--good)}
.dcard .chips{display:flex;flex-wrap:wrap;gap:4px}
.dcard .chip{font-size:11px;padding:0 7px}
.map svg{width:100%;height:auto;display:block}
.map a text{fill:var(--text)}
.map a:hover rect{stroke:var(--text)}
.empty{padding:30px;text-align:center;color:var(--faint)}

.more{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:6px;width:100%;margin-top:8px;padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--muted);border:1px dashed var(--line2)}
.more:hover{color:var(--text);border-color:var(--muted)}
.more .chev{transform:rotate(90deg)}
.more.less .chev{transform:rotate(-90deg)}
.dcard .line{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hub-nav{display:flex;gap:14px;align-items:center;font-size:14px}.hub-nav a{color:var(--muted);text-decoration:none}.hub-nav a:hover{color:var(--accent)}
</style>
</head>

<script id="data" type="application/json">[{"id":1,"slug":"session-messaging","title":"How does the hub talk to its agents?","date":"2026-11-11","mode":"full","lenses":["architecture"],"status":"decided","context":"The hub is a separate small app (decision 6). Agents work as usual, post a summary when they finish a round, then wait for a reply from the orchestrator or from you. The hub has to send replies into agents that are idle and waiting.","depends_on":[6],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Hub hosts its agents","summary":"The hub starts every agent, orchestrators included, through the Claude Agent SDK, so it can send to them and read their output whenever it likes.","pros":["Full control: send, stream, interrupt, read status","No preview features, no hook timing","You already know this pattern well"],"cons":["Sessions started elsewhere (a terminal) are outside it","The hub must handle permission prompts itself"],"effort":"Medium"},{"source":"claude","key":"B","name":"Agents join through a channel","summary":"Agents run wherever you start them, launched with a Crux channel server that carries messages both ways.","pros":["Any terminal session can join","Agents keep their normal interface"],"cons":["Channels are a research preview","Every agent must be started with the flag"],"effort":"Medium"},{"source":"claude","key":"C","name":"Hosted, with a channel later","summary":"Start with hub-hosted agents; add the channel later so terminal sessions can join the same board.","pros":["Ships on stable ground","Leaves the door open"],"cons":["Two routes eventually"],"effort":"Medium, then small"}],"criteria":[{"name":"Control","scores":{"A":3,"B":2,"C":3}},{"name":"Stability","scores":{"A":3,"B":1,"C":3}},{"name":"Joins outside sessions","scores":{"A":1,"B":3,"C":2}},{"name":"Effort","scores":{"A":2,"B":2,"C":2}}],"recommended":"C","recommendation":"Hosting agents in the hub is stable and squarely in your wheelhouse; the message format should not care how an agent connects, so a channel can be added when you want terminal sessions on the board.","confidence":"lean","chosen":"C","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"_file":"0001-session-messaging.html"},{"id":2,"slug":"board-writes","title":"How do many agents write to the board without clobbering each other?","date":"2026-11-11","mode":"full","lenses":["data-model","architecture"],"status":"decided","context":"Orchestrators, workers and you will all post to the board at once: decisions, requirements, memos, thread messages. Crux today has one writer at a time and regenerates pages from JSON records.","depends_on":[9],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Any agent edits any entry","summary":"Agents read, change and save entries directly; last save wins.","pros":["Simplest"],"cons":["Lost updates when two agents save together","No record of who changed what"],"effort":"Small"},{"source":"claude","key":"B","name":"Orchestrator curates","summary":"Only the current orchestrator writes board entries; workers and you post into threads and it turns them into entries.","pros":["One writer, consistent entries"],"cons":["Your own picks wait for the orchestrator","The orchestrator becomes a bottleneck"],"effort":"Small"},{"source":"claude","key":"C","name":"Append-only event log","summary":"Every action (a message, a pick, a new requirement) is appended as an event; entries and the index are rebuilt from the log, as Crux pages are rebuilt from JSON today.","pros":["No lost updates: appends never collide","Full history of who did what, for free","Messages and memory share one log"],"cons":["A rebuild step between log and board","Needs care to keep rebuilds fast as the log grows"],"effort":"Medium"}],"criteria":[{"name":"Safe with many writers","scores":{"A":1,"B":3,"C":3}},{"name":"Your actions land instantly","scores":{"A":3,"B":1,"C":3}},{"name":"History and audit","scores":{"A":1,"B":2,"C":3}},{"name":"Effort","scores":{"A":3,"B":3,"C":2}}],"recommended":"C","recommendation":"An append-only log makes concurrent writers safe and gives the conversation and the memory one source; it is the same records-in, pages-out pattern Crux already uses.","confidence":"lean","chosen":"C","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"shared agent state writes","value":"append-only event log; entries and index rebuilt from it"}],"_file":"0002-board-writes.html"},{"id":3,"slug":"follow-ups","title":"When the orchestrator sends work back, which agent gets it?","date":"2026-11-11","mode":"full","lenses":["architecture"],"status":"decided","context":"After reading a summary, the orchestrator sends an agent back for fixes or the next step. It can continue with the same agent, which keeps context but grows long, or start a new one from the board, which is clean but loses what the agent learned.","depends_on":[1,7],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Always the same agent","summary":"Fixes and next steps go back to the agent that did the work.","pros":["Keeps what the agent learned"],"cons":["Long agents slow down and lose focus"],"effort":"None"},{"source":"claude","key":"B","name":"New agent per step","summary":"Each next step starts a new agent that reads the board.","pros":["Clean context; tests the board"],"cons":["Loses short-term context","More threads"],"effort":"Small"},{"source":"claude","key":"C","name":"Same for fixes, new for new scope","summary":"Fixes go back to the same agent; new scope, or an agent near its context limit, gets a new agent that starts from the board and a handoff memo.","pros":["Context where it helps, clean starts where not","Workers retire the same way orchestrators do"],"cons":["The orchestrator must judge when to split"],"effort":"Small"}],"criteria":[{"name":"Keeps useful context","scores":{"A":3,"B":1,"C":3}},{"name":"Focus over time","scores":{"A":1,"B":3,"C":3}},{"name":"Effort","scores":{"A":3,"B":2,"C":2}}],"recommended":"C","recommendation":"The same retire-and-handoff rule as the orchestrator role, applied to workers: fixes stay, new scope starts clean from the board.","confidence":"lean","chosen":"C","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"_file":"0003-follow-ups.html"},{"id":4,"slug":"app-shell","title":"What is the hub built as?","date":"2026-11-11","mode":"full","lenses":["architecture","ui"],"status":"decided","context":"A small app with a nicer, messaging-style interface. Crux today is no-dependency Node scripts and static pages, and two of your projects settled on no bundler for front-end builds.","depends_on":[6],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Local Node server, browser tab","summary":"A no-dependency Node server hosting the agents and the board, serving a plain-module web page with live updates.","pros":["Fastest to build; fits the no-bundler convention","Reuses Crux templates and scripts"],"cons":["Feels like a web page, not an app","Only browser notifications"],"effort":"Small"},{"source":"claude","key":"B","name":"Tauri around the same page","summary":"The Node server as a sidecar, wrapped in a small native window with tray icon and notifications.","pros":["A real small app: tray, notifications, starts at login","Small installer"],"cons":["Rust toolchain and packaging","Sidecar process to manage"],"effort":"Medium"},{"source":"claude","key":"C","name":"Electron","summary":"A native window with Node built in.","pros":["All JavaScript","Tray and notifications"],"cons":["Heavy for a small app","Packaging and updates"],"effort":"Medium"}],"criteria":[{"name":"Effort","scores":{"A":3,"B":2,"C":2}},{"name":"Feels like an app","scores":{"A":1,"B":3,"C":3}},{"name":"Small footprint","scores":{"A":3,"B":3,"C":1}},{"name":"Fits no-bundler convention","scores":{"A":3,"B":2,"C":2}}],"recommended":"B","recommendation":"Build it as a local server and page first (that is all of A), then wrap it in Tauri for the small-app feel; nothing in A is thrown away.","confidence":"lean","chosen":"B","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"desktop app shell","value":"no-dependency Node server and plain-module page, wrapped in Tauri"}],"_file":"0004-app-shell.html"},{"id":5,"slug":"session-registry","title":"How does the app know which sessions are live and what they are working on?","date":"2026-11-11","mode":"full","lenses":["architecture","data-model"],"status":"rejected","context":"Only matters for agents the hub did not start itself (terminal sessions joining later through a channel). If the hub hosts its agents (decision 1), it already knows which are live, and this can be dropped or parked until a channel is added.","depends_on":[1],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Sessions register with a hook","summary":"A SessionStart hook writes session id, folder and transcript path to ~/crux/sessions/; a SessionEnd hook removes it.","pros":["Exact: the session says it exists","Cheap, documented hook events","Gives the session id the inbox needs"],"cons":["A crash leaves a stale entry, so the app must check it is still alive","The hook must be installed in your user settings"],"effort":"Small"},{"source":"claude","key":"B","name":"Read Claude Code's own session files","summary":"Scan ~/.claude/projects for transcripts and treat recently changed ones as live.","pros":["No setup","Includes past sessions too"],"cons":["Internal format, not a published interface","\"Live\" is a guess from file age"],"effort":"Small"},{"source":"claude","key":"C","name":"Sessions tag the decisions they touch","summary":"The skill writes the session id into a record when it creates or edits it.","pros":["Links a decision straight to the session that owns it","No hooks needed"],"cons":["Only knows sessions that touched Crux","Says nothing about whether the session is still open"],"effort":"Small"}],"criteria":[{"name":"Knows what is live","scores":{"A":3,"B":1,"C":1}},{"name":"Setup needed","scores":{"A":2,"B":3,"C":3}},{"name":"Relies on stable interfaces","scores":{"A":3,"B":1,"C":3}},{"name":"Links sessions to decisions","scores":{"A":2,"B":1,"C":3}}],"recommended":"A","recommendation":"It is the only option that actually knows a session is open, and it hands the inbox the session id it needs; tagging records (C) can be added on top for the decision link.","confidence":"lean","chosen":null,"reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"_file":"0005-session-registry.html"},{"id":6,"slug":"build-on-host","title":"Build a separate hub, or build Crux on top of the Claude desktop app?","date":"2026-11-11","mode":"full","lenses":["architecture","research"],"status":"decided","context":"The goal is a preview: one place to manage several agents through chat, with an orchestrator that reads their summaries, answers their questions and sends them back. The Claude desktop app's Code tab already lets one session start other sessions, receive a note when each ends a turn, and message them back. This decides how much of the plumbing you build at all.","depends_on":[],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Separate Crux hub","summary":"Crux's own app starts the orchestrator and the agents through the Claude Agent SDK, and you chat with them there.","pros":["Full control over the interface and the message flow","Not tied to any one host app"],"cons":["You rebuild session management, permissions and transcripts","Sessions you start in a terminal or the desktop app are outside it","Weeks before you can test whether the workflow is worth it"],"effort":"Large"},{"source":"claude","key":"B","name":"Crux layer on the desktop app","summary":"The orchestrator is an ordinary desktop session that starts and messages agent sessions, which the app already supports. Crux adds the summary format, the authority rules and decision cards, through the skill and optionally a side panel.","pros":["The messaging plumbing exists today","You keep the app's chat, permissions and phone access","Testable in days: mostly skill text and a summary format"],"cons":["Tied to the desktop app and what it exposes","Terminal sessions are not part of it","Custom interface limited to what a panel mod can do"],"effort":"Small"},{"source":"claude","key":"C","name":"Crux protocol, any host","summary":"Crux defines its own messages (summary, question, reply, decision) over files and a channel server, so desktop sessions, terminal sessions and a hub interface can all join.","pros":["Portable across hosts","Survives changes to any one app"],"cons":["The most design work before anything runs","Leans on channels, still a research preview"],"effort":"Medium to large"}],"criteria":[{"name":"Time to a working preview","scores":{"A":1,"B":3,"C":1}},{"name":"Control over the interface","scores":{"A":3,"B":1,"C":2}},{"name":"Covers terminal sessions","scores":{"A":2,"B":1,"C":3}},{"name":"Ease of reversing","scores":{"A":1,"B":3,"C":2},"note":"B is mostly skill text, so little to throw away"}],"recommended":"B","recommendation":"The point is to find out whether one place to manage agents is worth it; building on the app that already does the plumbing answers that in days, and the summary format and authority rules carry over to a separate hub later.","confidence":"lean","chosen":"A","reason":"The point is not to use the Desktop App. I want a small app with a nicer UI / UX that is more messaging-like.","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"_file":"0006-build-on-host.html"},{"id":7,"slug":"orchestrator-authority","title":"What may the orchestrator decide on its own?","date":"2026-11-11","mode":"full","lenses":["research","architecture"],"status":"decided","context":"Whichever agent holds the orchestrator role reads summaries, answers questions and sends agents back. The line between what it settles and what reaches you is the heart of the hub, and the place where Crux's rule (Claude does the work around the decision, you make the call) applies. The rule must live on the board so every successor follows it.","depends_on":[9],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Drafts, you approve","summary":"Every reply is drafted for your approval.","pros":["Nothing happens without you"],"cons":["You are the bottleneck again"],"effort":"Small"},{"source":"claude","key":"B","name":"Crux line","summary":"It answers questions and sends fixes and next steps within the agreed requirements. Anything Crux would stop for (new dependency, data model, multi-module change, product direction, contradicting an active decision) comes to you as a decision card. Pushing, merging and deleting always come to you.","pros":["A rule Crux already states","Every escalation becomes a board entry"],"cons":["It will sometimes misjudge what is architecture-level","Needs a digest so you can audit"],"effort":"Small"},{"source":"claude","key":"C","name":"Budgeted autonomy","summary":"Free within limits (rounds, cost, no push or merge), with a digest.","pros":["Fastest"],"cons":["Real decisions slip past"],"effort":"Small"}],"criteria":[{"name":"You see the calls that matter","scores":{"A":3,"B":3,"C":1}},{"name":"Takes work off you","scores":{"A":1,"B":2,"C":3}},{"name":"Fits Crux's rule","scores":{"A":2,"B":3,"C":1}}],"recommended":"B","recommendation":"Crux's rule applied to a new reader: routine answers flow, real decisions stop for you as cards, irreversible actions never leave your hands.","confidence":"strong","chosen":"B","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"orchestrator authority","value":"routine answers and fixes alone; architecture-level choices as decision cards; push, merge and delete always to the human"}],"_file":"0007-orchestrator-authority.html"},{"id":8,"slug":"summary-format","title":"What does an agent post when it finishes a round of work?","date":"2026-11-11","mode":"full","lenses":["data-model"],"status":"decided","context":"Agents work as usual, then post a summary to their thread. The orchestrator acts on it, the hub renders it, and it becomes part of the board's history.","depends_on":[2,7],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Free text","summary":"The agent's normal closing message.","pros":["Nothing to add"],"cons":["Questions and decisions get buried"],"effort":"None"},{"source":"claude","key":"B","name":"Fixed sections in text","summary":"Done, changed, questions, decisions needed, blocked on, next step.","pros":["Easy to scan","Plain text"],"cons":["The hub must parse text to render cards"],"effort":"Small"},{"source":"claude","key":"C","name":"Structured summary event","summary":"The same sections posted as a structured event (questions, decisions with entry numbers, files changed), which the hub renders as a message with cards.","pros":["Questions and decisions render as real cards with buttons","Fits the event log","Easy to search later"],"cons":["Agents need a tool or schema to post it"],"effort":"Small to medium"}],"criteria":[{"name":"Orchestrator reliability","scores":{"A":1,"B":2,"C":3}},{"name":"Renders well in the hub","scores":{"A":1,"B":2,"C":3}},{"name":"Effort","scores":{"A":3,"B":3,"C":2}}],"recommended":"C","recommendation":"With your own interface and an event log, a structured summary is what turns questions and decisions into cards you can act on.","confidence":"lean","chosen":"C","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"_file":"0008-summary-format.html"},{"id":9,"slug":"memory-board","title":"What lives on the memory board, and in what shape?","date":"2026-11-11","mode":"full","lenses":["data-model","architecture"],"status":"decided","context":"The board is the long-term memory every agent reads: it is what lets an orchestrator retire and a new one pick up without loss. Crux's .decisions folder already does this for decisions (JSON records, a status lifecycle, superseded instead of deleted, readable summaries). The question is how far to widen it.","depends_on":[6],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Decisions plus free memos","summary":"Keep .decisions as it is and add a memos folder of plain Markdown notes (handoffs, requirements, how-to-work-here).","pros":["Smallest change to Crux","Memos are easy to write"],"cons":["Requirements and handoffs have no lifecycle, so they rot silently","Hard to build an index or interface on free text"],"effort":"Small"},{"source":"claude","key":"B","name":"Typed entries, one lifecycle","summary":"Every entry is a JSON record with a type (decision, requirement, convention, memo, thread), a status lifecycle like decisions have, links between entries, and a one-line summary for the index.","pros":["Everything can be superseded, parked or retired the same way","One index and one interface for all of it","Decisions can point at the requirements they serve"],"cons":["A schema to design and keep stable","Agents must write structured entries, not just notes"],"effort":"Medium"},{"source":"claude","key":"C","name":"Living topic pages","summary":"A small wiki per project: one page per topic (architecture, data model, requirements) that agents keep editing, with decisions linked from them.","pros":["Reads like documentation","Compact: one page per topic, not hundreds of entries"],"cons":["Edits overwrite history unless versioned","Several agents editing one page collide","Loses Crux's nothing-is-deleted rule"],"effort":"Medium"}],"criteria":[{"name":"Survives handoffs intact","scores":{"A":2,"B":3,"C":2}},{"name":"Cheap to index and load","scores":{"A":1,"B":3,"C":2}},{"name":"Safe with many writers","scores":{"A":2,"B":3,"C":1}},{"name":"Builds on Crux as it is","scores":{"A":3,"B":2,"C":1}},{"name":"Effort","scores":{"A":3,"B":2,"C":2}}],"recommended":"B","recommendation":"It is the Crux record widened to every kind of memory: one shape, one lifecycle, one index, and the nothing-is-deleted rule extends to requirements and handoffs for free.","confidence":"lean","chosen":"B","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"long-term agent memory","value":"typed JSON entries (decision, requirement, convention, memo, thread) sharing the Crux status lifecycle; superseded, never deleted"}],"_file":"0009-memory-board.html"},{"id":10,"slug":"orchestrator-role","title":"How does the orchestrator role pass from one agent to the next?","date":"2026-11-11","mode":"full","lenses":["architecture"],"status":"decided","context":"The orchestrator is a role, not a session. When an agent's context grows large it should retire and a new one take over seamlessly, with the board as the shared memory. The question is when and how the swap happens.","depends_on":[9],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Retire at a threshold","summary":"The orchestrator watches its own context; past a set size, or on your word, it writes a handoff memo, closes or reassigns its threads, and the hub starts its successor.","pros":["Keeps context between rounds while it is cheap to","One clear moment to check the handoff memo"],"cons":["Anything not yet written to the board is lost if it crashes","Needs a reliable sense of its own context size"],"effort":"Small to medium"},{"source":"claude","key":"B","name":"Stateless: new agent every round","summary":"Every time there is something to handle, the hub starts a fresh orchestrator that reads the board index, acts, writes back and exits.","pros":["Nothing ever lives only in a context, so no handoff can go wrong","Forces the board to be complete"],"cons":["Re-reads the board every round: more tokens and slower","Loses the short-term thread of a busy hour"],"effort":"Small"},{"source":"claude","key":"C","name":"Overlap handoff","summary":"At the threshold, the successor starts, reads the board and memo, and shadows one round; the old orchestrator answers its questions, then retires.","pros":["Catches whatever the memo missed","Smoothest for you: no gap in the conversation"],"cons":["Two orchestrators at once need a rule for who answers","Costs a round of double work"],"effort":"Medium"}],"criteria":[{"name":"Nothing lost on swap","scores":{"A":2,"B":3,"C":3}},{"name":"Token cost","scores":{"A":3,"B":1,"C":2}},{"name":"Smooth for you","scores":{"A":2,"B":2,"C":3}},{"name":"Effort","scores":{"A":2,"B":3,"C":1}}],"recommended":"A","recommendation":"Retiring at a threshold keeps cheap context while it helps and makes the handoff memo the single checkpoint; requiring every decision and requirement to hit the board as it happens covers the crash case.","confidence":"lean","chosen":"A","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"change_mind":"If the board index stays small enough to read every round cheaply, stateless (B) is simpler and safer.","_file":"0010-orchestrator-role.html"},{"id":11,"slug":"memory-loading","title":"How much of the board does a new agent read before it starts?","date":"2026-11-11","mode":"full","lenses":["architecture","data-model"],"status":"decided","context":"The board only grows. A new orchestrator or worker needs enough to act correctly without spending its context on history. This sets the reading rule for every agent the hub starts.","depends_on":[9],"conflicts":[],"options":[{"source":"claude","key":"A","name":"All active entries","summary":"Every entry that is not superseded or retired, in full.","pros":["Nothing relevant is missed","Simple rule"],"cons":["Grows without limit; eventually too big to load","Most of it irrelevant to any one task"],"effort":"Small"},{"source":"claude","key":"B","name":"Index first, details on demand","summary":"Every agent reads a short index (one line per active entry), the project brief and the latest handoff; it opens full entries with a tool when it needs them.","pros":["Small, predictable start-up cost","Same pattern Crux and Claude's own memory use"],"cons":["An agent may skip an entry it should have opened","The one-line summaries must be good"],"effort":"Small to medium"},{"source":"claude","key":"C","name":"Role and area digests","summary":"Entries are tagged by area; the orchestrator reads the whole index, workers read only entries for their area, plus anything marked project-wide.","pros":["Workers start lean","Scales to large projects"],"cons":["Tagging has to be right, or a worker misses a constraint","More rules to explain"],"effort":"Medium"}],"criteria":[{"name":"Start-up cost","scores":{"A":1,"B":3,"C":3}},{"name":"Misses nothing important","scores":{"A":3,"B":2,"C":2}},{"name":"Scales as the board grows","scores":{"A":1,"B":3,"C":3}},{"name":"Effort","scores":{"A":3,"B":2,"C":1}}],"recommended":"B","recommendation":"An index plus the brief and handoff keeps start-up small however big the board gets; area tags (C) can be layered on once projects get large.","confidence":"lean","chosen":"B","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"agent start-up reading","value":"one-line index, project brief and latest handoff; full entries on demand"}],"_file":"0011-memory-loading.html"},{"id":12,"slug":"main-screen","title":"What does the main screen look like?","date":"2026-11-11","mode":"full","lenses":["ui"],"status":"decided","context":"A small app with a messaging feel: you talk with the orchestrator, drop into any agent, see the decisions that need you, and can look at the board. House rules: no sideways scrolling, drawn icons only, no visibility toggles.","depends_on":[6,9],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Threads, conversation, board on request","summary":"Thread list on the left (orchestrator pinned first, then agents), the conversation in the middle with decision cards inline; the board opens in a side panel when you ask for it or click a card.","pros":["Feels like a messaging app first","Full width for the conversation","Board is one click away, not always taking space"],"cons":["The board is out of sight until you ask"],"effort":"Medium"},{"source":"claude","key":"B","name":"Three columns","summary":"Threads, conversation and the board side by side at all times; at narrow widths the board moves under the conversation.","pros":["Memory always visible","Easy to see what a conversation changed"],"cons":["Cramped conversation on a laptop","Busier screen"],"effort":"Medium"},{"source":"claude","key":"C","name":"Board first, threads over it","summary":"The board is home; clicking an entry or agent opens its conversation over it.","pros":["Puts the long-term memory at the centre","Close to today's Crux board"],"cons":["Less like messaging, which is the point","Conversations feel secondary"],"effort":"Medium"}],"criteria":[{"name":"Feels like messaging","scores":{"A":3,"B":2,"C":1}},{"name":"Board at a glance","scores":{"A":2,"B":3,"C":3}},{"name":"Clutter","scores":{"A":3,"B":1,"C":2}},{"name":"Works on a laptop","scores":{"A":3,"B":1,"C":2}}],"recommended":"A","recommendation":"You asked for messaging first; decision cards inline bring the calls to you, and the board is one click away without crowding the conversation.","confidence":"lean","chosen":"A","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"_file":"0012-main-screen.html"},{"id":13,"slug":"memory-layers","title":"How does the memory keep growing without becoming unreadable?","date":"2026-11-11","mode":"full","lenses":["data-model","architecture"],"status":"decided","context":"Today each project has a board (decisions plus typed entries), and the Crux roll-up keeps a cross-project conventions list. Nothing yet holds what is known about you, and nothing tidies the board as it grows. Every new orchestrator reads the indexes first, so their size is what each agent pays to get started.","depends_on":[9,11],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Project boards only","summary":"Keep what exists. Each board grows on its own; the index-first loading from decision 11 keeps start-up cost down. Your profile is a separate file agents are told to read.","pros":["No new moving parts","Each project stays self-contained"],"cons":["A lesson learned in one project never reaches the others","Old memos pile up; nobody merges them","The profile is outside the system, so it goes stale"],"effort":"None"},{"source":"claude","key":"B","name":"Three layers, tidied at each handoff","summary":"You (profile), all projects (conventions), this project (board). Agents load the three short indexes. When an orchestrator hands off, it also proposes tidy-ups: merge old memos, retire stale ones, and promote anything that holds beyond this project up a layer. Promotions into your profile come to you as one batch card.","pros":["Lessons travel: a rule learned on Ebb reaches AcuLoad","Tidying rides on handoffs, which already happen, so no extra agent or schedule","You only see changes to your own profile, batched"],"cons":["Handoffs get a little longer","Tidy-ups only happen as often as handoffs do"],"effort":"Medium"},{"source":"claude","key":"C","name":"Three layers plus a librarian agent","summary":"Same layers, but a separate low-cost agent runs on a schedule (say nightly) to turn the event log into entries, merge duplicates and propose promotions.","pros":["Board stays tidy even on projects with few handoffs","Can catch things the orchestrator never wrote down"],"cons":["One more agent spending your plan on a schedule","Reads everything, so it can promote things you never meant to keep","More to build and to trust"],"effort":"Large"}],"criteria":[{"name":"Stays readable as it grows","scores":{"A":1,"B":2,"C":3}},{"name":"Lessons reach other projects","scores":{"A":1,"B":3,"C":3}},{"name":"Start-up cost per agent","scores":{"A":3,"B":2,"C":2},"note":"B and C add two short indexes"},{"name":"Clicks asked of you","scores":{"A":3,"B":2,"C":2}},{"name":"Effort","scores":{"A":3,"B":2,"C":1}}],"recommended":"B","recommendation":"It gives the memory somewhere to grow (upward) and a regular moment to tidy itself, without a new scheduled agent. A librarian can be added later if boards outgrow handoffs.","confidence":"lean","chosen":"B","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"agent memory layers","value":"three layers: personal profile, cross-project conventions, project board; agents load each index first; tidy-ups and promotions proposed at every orchestrator handoff, profile changes batched for the human"}],"_file":"0013-memory-layers.html"},{"id":14,"slug":"profile-home","title":"Where does what the system knows about you live?","date":"2026-11-11","mode":"full","lenses":["data-model"],"status":"decided","context":"You asked for it at the root of the Crux repo. That repo is public on GitHub, and the material to merge (your Claude.ai export plus the 45 lessons in Claude Code memory) includes confidential employer work, contract terms, people and family details. Whatever is committed to the repo is published on the next push.","depends_on":[13],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Repo root, public-safe part only","summary":"Commit only the working preferences (how to talk to you, UI rules, testing habits) at the repo root. Everything sensitive lives in a private file elsewhere.","pros":["Literally where you asked","Doubles as an example for other Crux users"],"cons":["Two files to keep in step","Every edit is a judgement call about what is safe to publish"],"effort":"Small"},{"source":"claude","key":"B","name":"Repo root, kept out of git","summary":"A profile folder at the repo root, listed in the ignore file so it is never committed.","pros":["Exactly where you asked, never pushed"],"cons":["One slip in the ignore file or in GitHub Desktop publishes it","No history of changes","Lives on this machine only"],"effort":"Small"},{"source":"claude","key":"C","name":"A private memory repo","summary":"Turn the home crux folder (where the roll-up and conventions already live) into its own private repo. The profile and cross-project memory live there with full history, and sync through GitHub Desktop. The Crux repo root carries a blank template and a pointer.","pros":["History of every change, like your other repos","Private, and on the same footing as your other private repos","Syncs to any machine","Natural home for the top two layers in decision 13"],"cons":["One more repo to keep","Not literally at the Crux repo root"],"effort":"Small"}],"criteria":[{"name":"Nothing sensitive gets published","scores":{"A":2,"B":2,"C":3}},{"name":"Keeps a history","scores":{"A":2,"B":1,"C":3}},{"name":"Works across machines","scores":{"A":2,"B":1,"C":3}},{"name":"Where you asked","scores":{"A":3,"B":3,"C":2}},{"name":"Effort","scores":{"A":3,"B":3,"C":2}}],"recommended":"C","recommendation":"Your memory will hold confidential work, so it should never sit one click from a public push. A private repo keeps it versioned and portable, and the Crux repo still ships a template others can copy.","confidence":"lean","chosen":"C","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"personal profile location","value":"private git repo in the home crux folder (alongside the roll-up); never in a public repo; the public Crux repo ships only a blank template"}],"_file":"0014-profile-home.html"},{"id":15,"slug":"profile-shape","title":"What goes in your profile, and what does each agent load?","date":"2026-11-11","mode":"full","lenses":["data-model"],"status":"decided","context":"The Claude.ai export is about 400 lines across 17 sections, and Claude Code memory holds 45 lessons about how you work. Loading all of it into every agent costs start-up context and puts private details in front of agents that are working on public repos. The orchestrator mainly needs your requirements: how you want work done and approved.","depends_on":[13,14],"conflicts":[],"options":[{"source":"claude","key":"A","name":"One file, everyone loads it all","summary":"Merge everything into one profile; every agent reads it at start.","pros":["Simplest","No agent ever misses anything"],"cons":["Every agent pays for 400+ lines it mostly does not need","Private and confidential details reach agents on public repos, which can leak into commits or docs"],"effort":"Small"},{"source":"claude","key":"B","name":"Core plus project packs","summary":"A short core every agent loads: how to talk to you, how approval and testing work, UI rules, git habits, and the boundaries between projects (stated as rules, without the confidential specifics). A pack per project, loaded only by agents in that project. Personal and contract details sit in a private section that agents read only when a task needs it. New lessons are dated and filed to the right place; changes to the core come to you as a batch.","pros":["Small, fast start for every agent","Private details stay out of unrelated work","The orchestrator gets exactly your requirements"],"cons":["Packs need curating","An agent can miss something that was filed in the wrong pack"],"effort":"Medium"},{"source":"claude","key":"C","name":"Core only; project knowledge moves to boards","summary":"Keep just the core in the profile. Each project's knowledge becomes requirements and conventions on that project's board.","pros":["One source of truth per project","Profile stays tiny"],"cons":["Only works where the hub runs; plain Claude Code or Claude.ai sessions lose the project context","A lot of seeding up front"],"effort":"Large"}],"criteria":[{"name":"Start-up cost per agent","scores":{"A":1,"B":3,"C":3}},{"name":"Keeps private details contained","scores":{"A":1,"B":3,"C":2}},{"name":"Orchestrator understands your requirements","scores":{"A":3,"B":3,"C":2}},{"name":"Works outside the hub","scores":{"A":3,"B":3,"C":1}},{"name":"Effort","scores":{"A":3,"B":2,"C":1}}],"recommended":"B","recommendation":"The orchestrator needs your requirements, not your biography. A short core plus the right project pack gives it that, and keeps confidential material away from agents that have no reason to see it.","confidence":"strong","chosen":"B","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"agent profile loading","value":"short core loaded by every agent; one pack per project loaded only in that project; private section read only when a task needs it; new lessons dated and filed, core changes approved in a batch"}],"_file":"0015-profile-shape.html"},{"id":16,"slug":"handoff-rules","title":"What must a handoff carry, and how does the swap happen?","date":"2026-11-11","mode":"full","lenses":["architecture"],"status":"decided","context":"Decision 10 retires an orchestrator past a context threshold and the new holder starts from the board plus a handoff memo. Today that memo is free text the outgoing agent writes from memory. The goal is that nothing in flight is lost and the next holder can carry on as if nothing changed.","depends_on":[10,13],"conflicts":[],"options":[{"source":"claude","key":"A","name":"A better memo","summary":"Keep the agent-written memo, but require set headings in it: work in flight, promises to you, open questions, risks, next step.","pros":["Small change"],"cons":["The agent can still misremember who is doing what","Facts the hub already knows get retyped and can be wrong"],"effort":"Small"},{"source":"claude","key":"B","name":"Hub writes the facts, agent writes the judgement","summary":"The hub fills in what it knows for certain: each worker and its last summary, open cards, decisions waiting, recent messages from you. The outgoing orchestrator writes only judgement under required headings: why things are the way they are, promises to you, risks, what it would do next, and board tidy-ups. The hub refuses a handoff that skips a heading and asks again. Workers follow the same rule at their own threshold.","pros":["The facts cannot be wrong","The agent spends its words on what only it knows","Same shape for orchestrators and workers"],"cons":["The next holder cannot ask about anything left unclear"],"effort":"Medium"},{"source":"claude","key":"C","name":"B, plus a short overlap","summary":"As B, then the new orchestrator reads the handoff and may ask the outgoing one a few questions (say up to three, or ten minutes) before it retires. The questions and answers are saved with the handoff so later holders see them too.","pros":["Gaps get filled before the old agent is gone","The Q and A becomes part of the memory"],"cons":["Two agents run briefly, so a little more of your plan","The outgoing agent is already near its limit, so answers should be short"],"effort":"Medium"}],"criteria":[{"name":"Nothing in flight is lost","scores":{"A":1,"B":2,"C":3}},{"name":"Facts are reliable","scores":{"A":1,"B":3,"C":3}},{"name":"Usage","scores":{"A":3,"B":3,"C":2}},{"name":"Effort","scores":{"A":3,"B":2,"C":2}}],"recommended":"C","recommendation":"Splitting facts from judgement makes the handoff reliable; the short overlap is what makes it seamless, and it costs little because the questions are few and the answers short.","confidence":"lean","chosen":"C","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"agent handoff","value":"hub writes the facts (workers, last summaries, open cards, waiting decisions); outgoing agent writes judgement under required headings; incoming agent may ask the outgoing one up to three questions before it retires; same rule for workers"}],"_file":"0016-handoff-rules.html"},{"id":17,"slug":"live-map-placement","title":"Where does the live map of the orchestrator and workers live?","date":"2026-11-11","mode":"quick","lenses":["ui"],"status":"decided","context":"The hub gets a live map: the orchestrator role as a particle core whose ring shows context used, workers as stations around it, pulses for messages, red when something needs you. Decision 12 gives the screen to threads and the conversation, with the board on request, so the map needs a place that does not crowd the chat.","depends_on":[12],"conflicts":[],"options":[{"key":"A","name":"Its own thread","summary":"A Map item at the top of the thread list; opening it fills the middle with the map, and tapping a station jumps to that chat.","pros":["Full size, room for many workers","No change to the chat layout"],"cons":["Out of sight while you chat"],"effort":"Medium","source":"claude"},{"key":"B","name":"Strip above the chat","summary":"A short live band over every conversation.","pros":["Always in view"],"cons":["Takes height from the chat, most on a phone"],"effort":"Medium","source":"claude"},{"key":"C","name":"Small map on top of the thread list","summary":"A small map above the threads; tap it for a big version in the middle.","pros":["Always there, chat keeps its height"],"cons":["Small, crowds past about six workers"],"effort":"Medium","source":"claude"},{"key":"D","name":"Always-on strip that zooms to the centre","summary":"A live strip above the conversation is always visible; engaging it zooms the map into the centre of the screen as a full view, and it shrinks back into the strip when you pick a station or close it. On a phone the strip is a slim band that opens to full screen.","pros":["Always visible, the strip's strength","Full size when engaged, the own-view strength","Zoom keeps your sense of place"],"cons":["Strip still takes some height from the chat"],"effort":"Medium to large","source":"human"}],"recommended":"C","recommendation":"Always one glance away without shrinking the conversation; the big version on tap covers what A offers.","confidence":"lean","chosen":"D","reason":"I like the idea of it being visible at all times, and zooming into the center of the screen when engaged. The strip idea is nice for an always on spot that can be seen. It needs to look and behave futuristically, think JARVIS from Ironman.","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"_file":"0017-live-map-placement.html"}]</script>

  eye: ic('<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>'),
  split: ic('<path d="M12 21v-7M12 14L6 6M12 14l6-8M6 6V3M18 6V3"/>'),
  check: ic('<circle cx="12" cy="12" r="8.5"/><path d="M8.3 12.2l2.6 2.6 4.9-5.2"/>'),
  archive: ic('<rect x="3.5" y="4.5" width="17" height="4" rx="1"/><path d="M5 8.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5M10 12.5h4"/>'),
  grid: ic('<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>'),
  layers: ic('<path d="M12 4l8.5 4.5L12 13 3.5 8.5z"/><path d="M3.5 12.5L12 17l8.5-4.5M3.5 16.5L12 21l8.5-4.5"/>'),
  tree: ic('<circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="12" r="2.2"/><path d="M8.2 6.6C13 8 13 11 15.8 11.6M8.2 17.4C13 16 13 13 15.8 12.4"/>'),
  clock: ic('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
  bars: ic('<path d="M4 20h16M7 20v-7M12 20V6M17 20v-10"/>')
};
// One state per decision drives every colour on the page.
const STATES = [
  { k:'openitem', name:'Open item', hint:'Flagged for review in the repo’s own log', c:'var(--bad)', icon:I.flag, test:d => d.open_item && (d.status==='found'||d.status==='open') },
  { k:'strained', name:'Strained', hint:'Deliberate, but now causing cost or risk', c:'var(--warn)', icon:I.alert, test:d => d.holding_up==='strained' && d.status!=='superseded' && d.status!=='rejected' },
  { k:'open', name:'Needs your call', hint:'Open decisions waiting for a pick', c:'var(--accent)', icon:I.split, test:d => d.status==='open' || (d.status==='parked' && due(d)) },
  { k:'review', name:'Needs review', hint:'Found in the code, waiting to be confirmed', c:'#b49cff', icon:I.eye, test:d => d.status==='found' },
  { k:'parked', name:'Parked', hint:'Set aside until a date or a trigger', c:'#7f8aa3', icon:I.clock, test:d => d.status==='parked' },
  { k:'decided', name:'Decided', hint:'Confirmed or picked', c:'var(--good)', icon:I.check, test:d => d.status==='decided' },
  { k:'history', name:'History', hint:'Superseded or rejected', c:'var(--hist)', icon:I.archive, test:d => d.status==='superseded' || d.status==='rejected' }
];
const today = new Date().toISOString().slice(0,10);
function due(d){ return !!(d.revisit && d.revisit.date && d.revisit.date <= today); }
const stateOf = d => STATES.find(s => s.test(d)) || STATES[3];
ALL.forEach(d => d._s = stateOf(d));
const repoName = (location.pathname.split('/').slice(-3,-2)[0] || '');
document.getElementById('repo').textContent = repoName ? '· ' + decodeURIComponent(repoName) : '';

function sub(){
  const counts = STATES.map(s => [s, ALL.filter(d => d._s===s).length]).filter(([,n]) => n);
  document.getElementById('sub').innerHTML = `<span>${ALL.length} decision${ALL.length===1?'':'s'}</span>` + counts.map(([s,n]) => `<span><span class="dot" style="background:${s.c}"></span>${n} ${s.name.toLowerCase()}</span>`).join('');
}

function glance(list){
  const total = list.length || 1;
  const counts = STATES.map(s => [s, list.filter(d => d._s===s).length]).filter(([,n]) => n);
  const bar = `<div class="bar">${counts.map(([s,n]) => `<span style="width:${n/total*100}%;background:${s.c}" title="${n} ${esc(s.name)}"></span>`).join('')}</div>
    <div class="legend">${counts.map(([s,n]) => `<span><i style="background:${s.c}"></i>${n} ${esc(s.name.toLowerCase())}</span>`).join('')}</div>`;
  const tiles = `<div class="tiles">${[...list].sort((a,b)=>a.id-b.id).map(d => `<a class="tile" style="--c:${d._s.c}" href="${esc(d._file)}" title="${pad(d.id)} ${esc(d.title)} · ${esc(d._s.name)}">${pad(d.id).replace(/^0+(?=\d{2})/,'')}<small>${esc(shortTitle(d))}</small></a>`).join('')}</div>`;
  const lenses = [...new Set(list.flatMap(d => d.lenses||[]))].sort();
  const areas = `<div class="areas">${lenses.map(l => { const ds = list.filter(d => (d.lenses||[]).includes(l)).sort((a,b)=>STATES.indexOf(a._s)-STATES.indexOf(b._s)); return `<div class="area"><span>${esc(l)}</span><span class="pips">${ds.map(d => `<a style="--c:${d._s.c}" href="${esc(d._file)}" title="${pad(d.id)} ${esc(d.title)}"></a>`).join('')}</span><span class="n">${ds.length}</span></div>`; }).join('')}</div>`;
  return `<div class="glance">
    <div class="panel"><div class="ptitle">${I.bars}Where things stand</div>${bar}<div style="margin-top:14px">${tiles}</div></div>
    <div class="panel"><div class="ptitle">${I.layers}By area</div>${areas || '<div class="muted">No areas tagged</div>'}</div>
  </div>`;
}
function shortTitle(d){
  const o = (d.options||[]).find(x => x.key === (d.chosen || d.recommended));
  return (o ? o.name : d.title).split(/[;,:(]/)[0];
}

function card(d){
  const o = (d.options||[]).find(x => x.key === d.chosen);
  let line = '';
  if (d.holding_up==='strained' && d.strain) line = `<div class="line warn">${esc(d.strain)}</div>`;
  else if (d.status==='decided' && o) line = `<div class="line ok">${esc(d.chosen)}: ${esc(o.name)}${d.reason?` <span class="muted">· ${esc(d.reason)}</span>`:''}</div>`;
  else if (d.status==='superseded') line = `<div class="line">Replaced by ${pad(d.superseded_by)}</div>`;
  else if (d.status==='parked') { const rv = d.revisit||{}; line = `<div class="line${due(d)?' warn':''}">${due(d)?'Revisit due':'Back'} ${rv.date?esc(rv.date):''}${rv.date&&rv.trigger?' or ':''}${rv.trigger?esc(rv.trigger):''}</div>`; }
  else if (d.status==='rejected') line = `<div class="line">Dropped${d.reason?`: ${esc(d.reason)}`:''}</div>`;
  else { const r = (d.options||[]).find(x => x.key === d.recommended); if (r) line = `<div class="line">${d.status==='found'?'In the code':'Leaning'}: ${esc(r.name)}</div>`; }
  return `<a class="dcard" href="${esc(d._file)}"><div class="row" style="gap:6px"><span class="num">${pad(d.id)}</span>${d.open_item?`<span class="chip bad">open item</span>`:''}${d.status==='parked'&&due(d)?'<span class="chip found">revisit due</span>':''}${d.deep?'<span class="chip open">deep</span>':''}</div><div class="t">${esc(d.title)}</div>${line}<div class="chips">${(d.lenses||[]).map(l=>`<span class="chip">${esc(l)}</span>`).join('')}</div></a>`;
}

const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const CHEV = '<svg class="icon chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
const laneKey = 'crux.repo.' + (repoName || 'repo') + '.openLanes';
let openLanes = new Set(store.get(laneKey) || []);
const CAP = { decided: 3, history: 3 };
function lanes(list, searching){
  const ls = STATES.map(s => [s, list.filter(d => d._s===s).sort((a,b)=>b.id-a.id)]).filter(([,ds]) => ds.length);
  return `<div class="lanes">${ls.map(([s,ds]) => {
    const cap = CAP[s.k] || 5;
    const all = searching || openLanes.has(s.k);
    const shown = all ? ds : ds.slice(0, cap);
    const more = ds.length - shown.length;
    return `<section class="lane" style="--c:${s.c}"><div class="lhead">${s.icon}${esc(s.name)} <span class="count">${ds.length}</span></div><div class="lhint">${esc(s.hint)}</div><div class="cards">${shown.map(card).join('')}</div>${more>0?`<button class="more" data-lane="${s.k}">${CHEV}Show ${more} more</button>`:(!searching && ds.length > cap ? `<button class="more less" data-lane="${s.k}">${CHEV}Show fewer</button>` : '')}</section>`;
  }).join('')}</div>`;
}
document.getElementById('out').addEventListener('click', e => {
  const lb = e.target.closest('[data-lane]');
  if (lb){ const k = lb.dataset.lane; openLanes.has(k) ? openLanes.delete(k) : openLanes.add(k); store.set(laneKey, [...openLanes]); render(); }
});

function depMap(all){
  let list = all;
  const ids = new Set(all.map(d => d.id));
  const byId = new Map(all.map(d => [d.id, d]));
  const deps = d => (d.depends_on||[]).filter(n => ids.has(n));
  const linked = new Set(list.flatMap(d => deps(d).length ? [d.id, ...deps(d)] : []));
  if (!linked.size) return '';
  const loose = list.filter(d => !linked.has(d.id)).length;
  list = list.filter(d => linked.has(d.id));
  const depth = new Map();
  const dep = (d, seen = new Set()) => { if (depth.has(d.id)) return depth.get(d.id); if (seen.has(d.id)) return 0; seen.add(d.id); const v = deps(d).length ? 1 + Math.max(...deps(d).map(n => dep(byId.get(n), seen))) : 0; depth.set(d.id, v); return v; };
  list.forEach(d => dep(d));
  const cols = Math.max(...depth.values()) + 1;
  const colItems = [];
  const rowOf = new Map();
  for (let c = 0; c < cols; c++) {
    const items = list.filter(d => depth.get(d.id) === c);
    const key = d => { const ps = deps(d).map(n => rowOf.get(n)).filter(v => v != null); return ps.length ? ps.reduce((a,b)=>a+b,0)/ps.length : d.id/1000; };
    items.sort((a,b) => key(a) - key(b) || a.id - b.id);
    items.forEach((d, i) => rowOf.set(d.id, i));
    colItems.push(items);
  }
  const W = 190, H = 46, GX = 70, GY = 14, PAD = 6;
  const rows = Math.max(...colItems.map(c => c.length));
  const pos = new Map();
  colItems.forEach((c, ci) => c.forEach((d, ri) => pos.set(d.id, { x: PAD + ci*(W+GX), y: PAD + ri*(H+GY) })));
  const vw = PAD*2 + cols*W + (cols-1)*GX, vh = PAD*2 + rows*H + (rows-1)*GY;
  let edges = '', nodes = '';
  for (const d of list) for (const n of deps(d)) {
    const a = pos.get(n), b = pos.get(d.id);
    const x1 = a.x+W, y1 = a.y+H/2, x2 = b.x, y2 = b.y+H/2;
    let path;
    if (b.x - a.x <= W + GX) { const mx = (x1+x2)/2; path = `M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2-6} ${y2}`; }
    else {
      // Long edge: drop into the gap between rows so it never runs behind a box.
      const yg = b.y > PAD ? b.y - GY/2 : b.y + H + GY/2;
      const g1 = x1 + GX/2, g2 = x2 - GX/2;
      path = `M${x1} ${y1}C${g1} ${y1} ${x1} ${yg} ${g1} ${yg}L${g2} ${yg}C${x2} ${yg} ${g2} ${y2} ${x2-6} ${y2}`;
    }
    edges += `<path d="${path}" fill="none" stroke="var(--faint)" stroke-width="1.3" marker-end="url(#ah)"/>`;
  }
  for (const d of list) { const p = pos.get(d.id); const t = shortTitle(d); nodes += `<a href="${esc(d._file)}"><title>${pad(d.id)} ${esc(d.title)}</title><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="8" fill="var(--surface)" stroke="var(--line2)"/><rect x="${p.x}" y="${p.y+8}" width="3" height="${H-16}" rx="1.5" fill="${d._s.c}"/><text x="${p.x+12}" y="${p.y+19}" font-size="11" font-family="var(--mono)" fill="var(--faint)">${pad(d.id)}</text><text x="${p.x+12}" y="${p.y+35}" font-size="12.5">${esc(t.length > 26 ? t.slice(0,25)+'…' : t)}</text></a>`; }
  return `<h2 class="row" style="gap:7px">${I.tree}What builds on what</h2><div class="panel map"><svg viewBox="0 0 ${vw} ${vh}" style="max-width:${vw}px" role="img" aria-label="Dependency map of decisions"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--faint)" stroke-width="1.5"/></marker></defs>${edges}${nodes}</svg><div class="legend" style="margin-top:8px">Left to right: foundations first. ${loose ? `${loose} decision${loose===1?' stands':'s stand'} on ${loose===1?'its':'their'} own and ${loose===1?'is':'are'} not shown here.` : ''}</div></div>`;
}

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = ALL.filter(d => !q || JSON.stringify([d.title,d.context,d.reason,d.strain,(d.lenses||[]),(d.options||[]).map(o=>o.name+' '+o.summary)]).toLowerCase().includes(q));
  if (!list.length){ document.getElementById('out').innerHTML = `<div class="empty">${ALL.length ? 'No matches' : 'No decisions yet'}</div>`; return; }
  document.getElementById('out').innerHTML = glance(list) + `<h2 class="row" style="gap:7px">${I.grid}Board</h2>` + lanes(list, !!q) + depMap(list);
}
sub();
document.getElementById('q').addEventListener('input', render);
render();
</script>
<script>
// Links to the Crux hub: shown when the page comes from the hub, or when a running hub answers on this machine.
(() => {
  const show = (id, href) => { const a = document.getElementById(id); if (a) { if (href) a.href = href; a.hidden = false; } };
  if (location.protocol !== 'file:') { show('hub-link', '/'); show('all-link', '/all'); return; }
  fetch('http://localhost:4747/api/ping').then(r => { if (r.ok) show('hub-link'); }).catch(() => {});
})();
</script>
</body>
