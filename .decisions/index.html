<title>Crux · Decisions</title>
<style>
:root{--bg:#0b0d11;--panel:#10141a;--lane:#12161c;--surface:#191e26;--surface2:#1e242d;--raised:#1b2029;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.12);--text:#e7eaf0;--muted:#a2aab7;--faint:#6c7584;--accent:#8ea8ff;--accent-ink:#0d1530;--accent-bg:rgba(142,168,255,.14);--good:#5fd3ae;--good-bg:rgba(95,211,174,.13);--warn:#f3b955;--warn-bg:rgba(243,185,85,.13);--bad:#f2727a;--bad-bg:rgba(242,114,122,.13);--chosen:#5fd3ae;--hist:#8792ad;--radius:10px;--font:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,sans-serif;--mono:"Cascadia Mono",Consolas,ui-monospace,monospace;--good-fill:#5fd3ae;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
main{max-width:1240px;margin:0 auto;padding:18px 18px 48px}
h1{font-size:21px;font-weight:600;margin:4px 0 8px;line-height:1.3}
h2{font-size:14px;font-weight:600;margin:26px 0 10px;color:var(--text);letter-spacing:.1px}
h3{font-size:14.5px;font-weight:600;margin:0}
p{margin:0 0 10px}
a{color:var(--accent)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;background:transparent;color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.chip.open{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.chip.decided{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.found{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.superseded,.chip.rejected{text-decoration:line-through}
.icon{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.btn{font:inherit;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--text);cursor:pointer}
.btn:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.18)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600}
input,textarea{font:inherit;width:100%;max-width:100%;padding:8px 11px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--text)}
input::placeholder,textarea::placeholder{color:var(--faint)}
svg{max-width:100%}

.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;color:var(--text);font-weight:600;font-size:16px}
.brand .mark{width:24px;height:24px}
.brand .repo{color:var(--muted);font-weight:400}
.search{position:relative;flex:0 1 280px;min-width:180px}
.search .icon{position:absolute;left:10px;top:9px;color:var(--faint)}
.search input{padding-left:32px}
.sub{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:9px 0 4px;font-size:12.5px;color:var(--muted)}
.sub .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;margin-top:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.ptitle{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:10px;display:flex;gap:7px;align-items:center}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--lane);gap:2px}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.tile{display:grid;place-items:center;aspect-ratio:1.35;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--text);font-family:var(--mono);font-size:12.5px;position:relative;border-top:3px solid var(--c)}
.tile:hover{background:var(--surface2)}
.tile small{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:var(--font);font-size:10.5px;color:var(--faint);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px}
.areas{display:grid;gap:8px}
.area{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:13px}
.area .pips{display:flex;flex-wrap:wrap;gap:3px}
.area .pips a{width:16px;height:16px;border-radius:4px;background:var(--c);opacity:.85;display:block}
.area .pips a:hover{opacity:1;outline:1px solid var(--text)}
.area .n{color:var(--faint);font-size:12px}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px;align-items:start}
.lane{background:var(--lane);border:1px solid var(--line);border-radius:var(--radius);padding:10px;border-top:3px solid var(--c);min-width:0}
.lhead{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;padding:2px 2px 10px}
.lhead .icon{color:var(--c)}
.lhead .count{color:var(--faint);font-weight:400}
.lhint{font-size:12px;color:var(--faint);padding:0 2px 8px;margin-top:-6px}
.cards{display:grid;gap:8px}
.dcard{display:grid;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;text-decoration:none;color:var(--text)}
.dcard:hover{background:var(--surface2);border-color:var(--line2)}
.dcard .t{font-weight:500;font-size:13.5px;line-height:1.35}
.dcard .num{font-family:var(--mono);color:var(--faint);font-size:11.5px}
.dcard .line{font-size:12.5px;color:var(--muted);line-height:1.4}
.dcard .line.warn{color:var(--warn)}
.dcard .line.ok{color:var(--good)}
.dcard .chips{display:flex;flex-wrap:wrap;gap:4px}
.dcard .chip{font-size:11px;padding:0 7px}
.map svg{width:100%;height:auto;display:block}
.map a text{fill:var(--text)}
.map a:hover rect{stroke:var(--text)}
.empty{padding:30px;text-align:center;color:var(--faint)}

.more{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:6px;width:100%;margin-top:8px;padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--muted);border:1px dashed var(--line2)}
.more:hover{color:var(--text);border-color:var(--muted)}
.more .chev{transform:rotate(90deg)}
.more.less .chev{transform:rotate(-90deg)}
.dcard .line{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hub-nav{display:flex;gap:8px;align-items:center}.hub-nav a{display:inline-flex;align-items:center;gap:7px;padding:6px 14px 6px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--text);font-size:13.5px;font-weight:500;text-decoration:none;transition:border-color .15s,background .15s,color .15s}.hub-nav a[hidden]{display:none}.hub-nav a svg{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.hub-nav a:hover{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}.hub-nav a.hub{background:var(--accent-bg);border-color:transparent;color:var(--accent)}.hub-nav a.hub:hover{border-color:var(--accent)}
</style>
</head>

<script id="data" type="application/json">[{"id":1,"slug":"session-messaging","title":"How does the hub talk to its agents?","date":"2026-11-11","mode":"full","lenses":["architecture"],"status":"decided","context":"The hub is a separate small app (decision 6). Agents work as usual, post a summary when they finish a round, then wait for a reply from the orchestrator or from you. The hub has to send replies into agents that are idle and waiting.","depends_on":[6],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Hub hosts its agents","summary":"The hub starts every agent, orchestrators included, through the Claude Agent SDK, so it can send to them and read their output whenever it likes.","pros":["Full control: send, stream, interrupt, read status","No preview features, no hook timing","You already know this pattern well"],"cons":["Sessions started elsewhere (a terminal) are outside it","The hub must handle permission prompts itself"],"effort":"Medium"},{"source":"claude","key":"B","name":"Agents join through a channel","summary":"Agents run wherever you start them, launched with a Crux channel server that carries messages both ways.","pros":["Any terminal session can join","Agents keep their normal interface"],"cons":["Channels are a research preview","Every agent must be started with the flag"],"effort":"Medium"},{"source":"claude","key":"C","name":"Hosted, with a channel later","summary":"Start with hub-hosted agents; add the channel later so terminal sessions can join the same board.","pros":["Ships on stable ground","Leaves the door open"],"cons":["Two routes eventually"],"effort":"Medium, then small"}],"criteria":[{"name":"Control","scores":{"A":3,"B":2,"C":3}},{"name":"Stability","scores":{"A":3,"B":1,"C":3}},{"name":"Joins outside sessions","scores":{"A":1,"B":3,"C":2}},{"name":"Effort","scores":{"A":2,"B":2,"C":2}}],"recommended":"C","recommendation":"Hosting agents in the hub is stable and squarely in your wheelhouse; the message format should not care how an agent connects, so a channel can be added when you want terminal sessions on the board.","confidence":"lean","chosen":"C","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"_file":"0001-session-messaging.html"},{"id":2,"slug":"board-writes","title":"How do many agents write to the board without clobbering each other?","date":"2026-11-11","mode":"full","lenses":["data-model","architecture"],"status":"decided","context":"Orchestrators, workers and you will all post to the board at once: decisions, requirements, memos, thread messages. Crux today has one writer at a time and regenerates pages from JSON records.","depends_on":[9],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Any agent edits any entry","summary":"Agents read, change and save entries directly; last save wins.","pros":["Simplest"],"cons":["Lost updates when two agents save together","No record of who changed what"],"effort":"Small"},{"source":"claude","key":"B","name":"Orchestrator curates","summary":"Only the current orchestrator writes board entries; workers and you post into threads and it turns them into entries.","pros":["One writer, consistent entries"],"cons":["Your own picks wait for the orchestrator","The orchestrator becomes a bottleneck"],"effort":"Small"},{"source":"claude","key":"C","name":"Append-only event log","summary":"Every action (a message, a pick, a new requirement) is appended as an event; entries and the index are rebuilt from the log, as Crux pages are rebuilt from JSON today.","pros":["No lost updates: appends never collide","Full history of who did what, for free","Messages and memory share one log"],"cons":["A rebuild step between log and board","Needs care to keep rebuilds fast as the log grows"],"effort":"Medium"}],"criteria":[{"name":"Safe with many writers","scores":{"A":1,"B":3,"C":3}},{"name":"Your actions land instantly","scores":{"A":3,"B":1,"C":3}},{"name":"History and audit","scores":{"A":1,"B":2,"C":3}},{"name":"Effort","scores":{"A":3,"B":3,"C":2}}],"recommended":"C","recommendation":"An append-only log makes concurrent writers safe and gives the conversation and the memory one source; it is the same records-in, pages-out pattern Crux already uses.","confidence":"lean","chosen":"C","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"shared agent state writes","value":"append-only event log; entries and index rebuilt from it"}],"_file":"0002-board-writes.html"},{"id":3,"slug":"follow-ups","title":"When the orchestrator sends work back, which agent gets it?","date":"2026-11-11","mode":"full","lenses":["architecture"],"status":"decided","context":"After reading a summary, the orchestrator sends an agent back for fixes or the next step. It can continue with the same agent, which keeps context but grows long, or start a new one from the board, which is clean but loses what the agent learned.","depends_on":[1,7],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Always the same agent","summary":"Fixes and next steps go back to the agent that did the work.","pros":["Keeps what the agent learned"],"cons":["Long agents slow down and lose focus"],"effort":"None"},{"source":"claude","key":"B","name":"New agent per step","summary":"Each next step starts a new agent that reads the board.","pros":["Clean context; tests the board"],"cons":["Loses short-term context","More threads"],"effort":"Small"},{"source":"claude","key":"C","name":"Same for fixes, new for new scope","summary":"Fixes go back to the same agent; new scope, or an agent near its context limit, gets a new agent that starts from the board and a handoff memo.","pros":["Context where it helps, clean starts where not","Workers retire the same way orchestrators do"],"cons":["The orchestrator must judge when to split"],"effort":"Small"}],"criteria":[{"name":"Keeps useful context","scores":{"A":3,"B":1,"C":3}},{"name":"Focus over time","scores":{"A":1,"B":3,"C":3}},{"name":"Effort","scores":{"A":3,"B":2,"C":2}}],"recommended":"C","recommendation":"The same retire-and-handoff rule as the orchestrator role, applied to workers: fixes stay, new scope starts clean from the board.","confidence":"lean","chosen":"C","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"_file":"0003-follow-ups.html"},{"id":4,"slug":"app-shell","title":"What is the hub built as?","date":"2026-11-11","mode":"full","lenses":["architecture","ui"],"status":"decided","context":"A small app with a nicer, messaging-style interface. Crux today is no-dependency Node scripts and static pages, and two of your projects settled on no bundler for front-end builds.","depends_on":[6],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Local Node server, browser tab","summary":"A no-dependency Node server hosting the agents and the board, serving a plain-module web page with live updates.","pros":["Fastest to build; fits the no-bundler convention","Reuses Crux templates and scripts"],"cons":["Feels like a web page, not an app","Only browser notifications"],"effort":"Small"},{"source":"claude","key":"B","name":"Tauri around the same page","summary":"The Node server as a sidecar, wrapped in a small native window with tray icon and notifications.","pros":["A real small app: tray, notifications, starts at login","Small installer"],"cons":["Rust toolchain and packaging","Sidecar process to manage"],"effort":"Medium"},{"source":"claude","key":"C","name":"Electron","summary":"A native window with Node built in.","pros":["All JavaScript","Tray and notifications"],"cons":["Heavy for a small app","Packaging and updates"],"effort":"Medium"}],"criteria":[{"name":"Effort","scores":{"A":3,"B":2,"C":2}},{"name":"Feels like an app","scores":{"A":1,"B":3,"C":3}},{"name":"Small footprint","scores":{"A":3,"B":3,"C":1}},{"name":"Fits no-bundler convention","scores":{"A":3,"B":2,"C":2}}],"recommended":"B","recommendation":"Build it as a local server and page first (that is all of A), then wrap it in Tauri for the small-app feel; nothing in A is thrown away.","confidence":"lean","chosen":"B","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"desktop app shell","value":"no-dependency Node server and plain-module page, wrapped in Tauri"}],"_file":"0004-app-shell.html"},{"id":5,"slug":"session-registry","title":"How does the app know which sessions are live and what they are working on?","date":"2026-11-11","mode":"full","lenses":["architecture","data-model"],"status":"rejected","context":"Only matters for agents the hub did not start itself (terminal sessions joining later through a channel). If the hub hosts its agents (decision 1), it already knows which are live, and this can be dropped or parked until a channel is added.","depends_on":[1],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Sessions register with a hook","summary":"A SessionStart hook writes session id, folder and transcript path to ~/crux/sessions/; a SessionEnd hook removes it.","pros":["Exact: the session says it exists","Cheap, documented hook events","Gives the session id the inbox needs"],"cons":["A crash leaves a stale entry, so the app must check it is still alive","The hook must be installed in your user settings"],"effort":"Small"},{"source":"claude","key":"B","name":"Read Claude Code's own session files","summary":"Scan ~/.claude/projects for transcripts and treat recently changed ones as live.","pros":["No setup","Includes past sessions too"],"cons":["Internal format, not a published interface","\"Live\" is a guess from file age"],"effort":"Small"},{"source":"claude","key":"C","name":"Sessions tag the decisions they touch","summary":"The skill writes the session id into a record when it creates or edits it.","pros":["Links a decision straight to the session that owns it","No hooks needed"],"cons":["Only knows sessions that touched Crux","Says nothing about whether the session is still open"],"effort":"Small"}],"criteria":[{"name":"Knows what is live","scores":{"A":3,"B":1,"C":1}},{"name":"Setup needed","scores":{"A":2,"B":3,"C":3}},{"name":"Relies on stable interfaces","scores":{"A":3,"B":1,"C":3}},{"name":"Links sessions to decisions","scores":{"A":2,"B":1,"C":3}}],"recommended":"A","recommendation":"It is the only option that actually knows a session is open, and it hands the inbox the session id it needs; tagging records (C) can be added on top for the decision link.","confidence":"lean","chosen":null,"reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"_file":"0005-session-registry.html"},{"id":6,"slug":"build-on-host","title":"Build a separate hub, or build Crux on top of the Claude desktop app?","date":"2026-11-11","mode":"full","lenses":["architecture","research"],"status":"decided","context":"The goal is a preview: one place to manage several agents through chat, with an orchestrator that reads their summaries, answers their questions and sends them back. The Claude desktop app's Code tab already lets one session start other sessions, receive a note when each ends a turn, and message them back. This decides how much of the plumbing you build at all.","depends_on":[],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Separate Crux hub","summary":"Crux's own app starts the orchestrator and the agents through the Claude Agent SDK, and you chat with them there.","pros":["Full control over the interface and the message flow","Not tied to any one host app"],"cons":["You rebuild session management, permissions and transcripts","Sessions you start in a terminal or the desktop app are outside it","Weeks before you can test whether the workflow is worth it"],"effort":"Large"},{"source":"claude","key":"B","name":"Crux layer on the desktop app","summary":"The orchestrator is an ordinary desktop session that starts and messages agent sessions, which the app already supports. Crux adds the summary format, the authority rules and decision cards, through the skill and optionally a side panel.","pros":["The messaging plumbing exists today","You keep the app's chat, permissions and phone access","Testable in days: mostly skill text and a summary format"],"cons":["Tied to the desktop app and what it exposes","Terminal sessions are not part of it","Custom interface limited to what a panel mod can do"],"effort":"Small"},{"source":"claude","key":"C","name":"Crux protocol, any host","summary":"Crux defines its own messages (summary, question, reply, decision) over files and a channel server, so desktop sessions, terminal sessions and a hub interface can all join.","pros":["Portable across hosts","Survives changes to any one app"],"cons":["The most design work before anything runs","Leans on channels, still a research preview"],"effort":"Medium to large"}],"criteria":[{"name":"Time to a working preview","scores":{"A":1,"B":3,"C":1}},{"name":"Control over the interface","scores":{"A":3,"B":1,"C":2}},{"name":"Covers terminal sessions","scores":{"A":2,"B":1,"C":3}},{"name":"Ease of reversing","scores":{"A":1,"B":3,"C":2},"note":"B is mostly skill text, so little to throw away"}],"recommended":"B","recommendation":"The point is to find out whether one place to manage agents is worth it; building on the app that already does the plumbing answers that in days, and the summary format and authority rules carry over to a separate hub later.","confidence":"lean","chosen":"A","reason":"The point is not to use the Desktop App. I want a small app with a nicer UI / UX that is more messaging-like.","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"_file":"0006-build-on-host.html"},{"id":7,"slug":"orchestrator-authority","title":"What may the orchestrator decide on its own?","date":"2026-11-11","mode":"full","lenses":["research","architecture"],"status":"decided","context":"Whichever agent holds the orchestrator role reads summaries, answers questions and sends agents back. The line between what it settles and what reaches you is the heart of the hub, and the place where Crux's rule (Claude does the work around the decision, you make the call) applies. The rule must live on the board so every successor follows it.","depends_on":[9],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Drafts, you approve","summary":"Every reply is drafted for your approval.","pros":["Nothing happens without you"],"cons":["You are the bottleneck again"],"effort":"Small"},{"source":"claude","key":"B","name":"Crux line","summary":"It answers questions and sends fixes and next steps within the agreed requirements. Anything Crux would stop for (new dependency, data model, multi-module change, product direction, contradicting an active decision) comes to you as a decision card. Pushing, merging and deleting always come to you.","pros":["A rule Crux already states","Every escalation becomes a board entry"],"cons":["It will sometimes misjudge what is architecture-level","Needs a digest so you can audit"],"effort":"Small"},{"source":"claude","key":"C","name":"Budgeted autonomy","summary":"Free within limits (rounds, cost, no push or merge), with a digest.","pros":["Fastest"],"cons":["Real decisions slip past"],"effort":"Small"}],"criteria":[{"name":"You see the calls that matter","scores":{"A":3,"B":3,"C":1}},{"name":"Takes work off you","scores":{"A":1,"B":2,"C":3}},{"name":"Fits Crux's rule","scores":{"A":2,"B":3,"C":1}}],"recommended":"B","recommendation":"Crux's rule applied to a new reader: routine answers flow, real decisions stop for you as cards, irreversible actions never leave your hands.","confidence":"strong","chosen":"B","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"orchestrator authority","value":"routine answers and fixes alone; architecture-level choices as decision cards; push, merge and delete always to the human"}],"_file":"0007-orchestrator-authority.html"},{"id":8,"slug":"summary-format","title":"What does an agent post when it finishes a round of work?","date":"2026-11-11","mode":"full","lenses":["data-model"],"status":"decided","context":"Agents work as usual, then post a summary to their thread. The orchestrator acts on it, the hub renders it, and it becomes part of the board's history.","depends_on":[2,7],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Free text","summary":"The agent's normal closing message.","pros":["Nothing to add"],"cons":["Questions and decisions get buried"],"effort":"None"},{"source":"claude","key":"B","name":"Fixed sections in text","summary":"Done, changed, questions, decisions needed, blocked on, next step.","pros":["Easy to scan","Plain text"],"cons":["The hub must parse text to render cards"],"effort":"Small"},{"source":"claude","key":"C","name":"Structured summary event","summary":"The same sections posted as a structured event (questions, decisions with entry numbers, files changed), which the hub renders as a message with cards.","pros":["Questions and decisions render as real cards with buttons","Fits the event log","Easy to search later"],"cons":["Agents need a tool or schema to post it"],"effort":"Small to medium"}],"criteria":[{"name":"Orchestrator reliability","scores":{"A":1,"B":2,"C":3}},{"name":"Renders well in the hub","scores":{"A":1,"B":2,"C":3}},{"name":"Effort","scores":{"A":3,"B":3,"C":2}}],"recommended":"C","recommendation":"With your own interface and an event log, a structured summary is what turns questions and decisions into cards you can act on.","confidence":"lean","chosen":"C","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"_file":"0008-summary-format.html"},{"id":9,"slug":"memory-board","title":"What lives on the memory board, and in what shape?","date":"2026-11-11","mode":"full","lenses":["data-model","architecture"],"status":"decided","context":"The board is the long-term memory every agent reads: it is what lets an orchestrator retire and a new one pick up without loss. Crux's .decisions folder already does this for decisions (JSON records, a status lifecycle, superseded instead of deleted, readable summaries). The question is how far to widen it.","depends_on":[6],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Decisions plus free memos","summary":"Keep .decisions as it is and add a memos folder of plain Markdown notes (handoffs, requirements, how-to-work-here).","pros":["Smallest change to Crux","Memos are easy to write"],"cons":["Requirements and handoffs have no lifecycle, so they rot silently","Hard to build an index or interface on free text"],"effort":"Small"},{"source":"claude","key":"B","name":"Typed entries, one lifecycle","summary":"Every entry is a JSON record with a type (decision, requirement, convention, memo, thread), a status lifecycle like decisions have, links between entries, and a one-line summary for the index.","pros":["Everything can be superseded, parked or retired the same way","One index and one interface for all of it","Decisions can point at the requirements they serve"],"cons":["A schema to design and keep stable","Agents must write structured entries, not just notes"],"effort":"Medium"},{"source":"claude","key":"C","name":"Living topic pages","summary":"A small wiki per project: one page per topic (architecture, data model, requirements) that agents keep editing, with decisions linked from them.","pros":["Reads like documentation","Compact: one page per topic, not hundreds of entries"],"cons":["Edits overwrite history unless versioned","Several agents editing one page collide","Loses Crux's nothing-is-deleted rule"],"effort":"Medium"}],"criteria":[{"name":"Survives handoffs intact","scores":{"A":2,"B":3,"C":2}},{"name":"Cheap to index and load","scores":{"A":1,"B":3,"C":2}},{"name":"Safe with many writers","scores":{"A":2,"B":3,"C":1}},{"name":"Builds on Crux as it is","scores":{"A":3,"B":2,"C":1}},{"name":"Effort","scores":{"A":3,"B":2,"C":2}}],"recommended":"B","recommendation":"It is the Crux record widened to every kind of memory: one shape, one lifecycle, one index, and the nothing-is-deleted rule extends to requirements and handoffs for free.","confidence":"lean","chosen":"B","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"long-term agent memory","value":"typed JSON entries (decision, requirement, convention, memo, thread) sharing the Crux status lifecycle; superseded, never deleted"}],"_file":"0009-memory-board.html"},{"id":10,"slug":"orchestrator-role","title":"How does the orchestrator role pass from one agent to the next?","date":"2026-11-11","mode":"full","lenses":["architecture"],"status":"decided","context":"The orchestrator is a role, not a session. When an agent's context grows large it should retire and a new one take over seamlessly, with the board as the shared memory. The question is when and how the swap happens.","depends_on":[9],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Retire at a threshold","summary":"The orchestrator watches its own context; past a set size, or on your word, it writes a handoff memo, closes or reassigns its threads, and the hub starts its successor.","pros":["Keeps context between rounds while it is cheap to","One clear moment to check the handoff memo"],"cons":["Anything not yet written to the board is lost if it crashes","Needs a reliable sense of its own context size"],"effort":"Small to medium"},{"source":"claude","key":"B","name":"Stateless: new agent every round","summary":"Every time there is something to handle, the hub starts a fresh orchestrator that reads the board index, acts, writes back and exits.","pros":["Nothing ever lives only in a context, so no handoff can go wrong","Forces the board to be complete"],"cons":["Re-reads the board every round: more tokens and slower","Loses the short-term thread of a busy hour"],"effort":"Small"},{"source":"claude","key":"C","name":"Overlap handoff","summary":"At the threshold, the successor starts, reads the board and memo, and shadows one round; the old orchestrator answers its questions, then retires.","pros":["Catches whatever the memo missed","Smoothest for you: no gap in the conversation"],"cons":["Two orchestrators at once need a rule for who answers","Costs a round of double work"],"effort":"Medium"}],"criteria":[{"name":"Nothing lost on swap","scores":{"A":2,"B":3,"C":3}},{"name":"Token cost","scores":{"A":3,"B":1,"C":2}},{"name":"Smooth for you","scores":{"A":2,"B":2,"C":3}},{"name":"Effort","scores":{"A":2,"B":3,"C":1}}],"recommended":"A","recommendation":"Retiring at a threshold keeps cheap context while it helps and makes the handoff memo the single checkpoint; requiring every decision and requirement to hit the board as it happens covers the crash case.","confidence":"lean","chosen":"A","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"change_mind":"If the board index stays small enough to read every round cheaply, stateless (B) is simpler and safer.","_file":"0010-orchestrator-role.html"},{"id":11,"slug":"memory-loading","title":"How much of the board does a new agent read before it starts?","date":"2026-11-11","mode":"full","lenses":["architecture","data-model"],"status":"decided","context":"The board only grows. A new orchestrator or worker needs enough to act correctly without spending its context on history. This sets the reading rule for every agent the hub starts.","depends_on":[9],"conflicts":[],"options":[{"source":"claude","key":"A","name":"All active entries","summary":"Every entry that is not superseded or retired, in full.","pros":["Nothing relevant is missed","Simple rule"],"cons":["Grows without limit; eventually too big to load","Most of it irrelevant to any one task"],"effort":"Small"},{"source":"claude","key":"B","name":"Index first, details on demand","summary":"Every agent reads a short index (one line per active entry), the project brief and the latest handoff; it opens full entries with a tool when it needs them.","pros":["Small, predictable start-up cost","Same pattern Crux and Claude's own memory use"],"cons":["An agent may skip an entry it should have opened","The one-line summaries must be good"],"effort":"Small to medium"},{"source":"claude","key":"C","name":"Role and area digests","summary":"Entries are tagged by area; the orchestrator reads the whole index, workers read only entries for their area, plus anything marked project-wide.","pros":["Workers start lean","Scales to large projects"],"cons":["Tagging has to be right, or a worker misses a constraint","More rules to explain"],"effort":"Medium"}],"criteria":[{"name":"Start-up cost","scores":{"A":1,"B":3,"C":3}},{"name":"Misses nothing important","scores":{"A":3,"B":2,"C":2}},{"name":"Scales as the board grows","scores":{"A":1,"B":3,"C":3}},{"name":"Effort","scores":{"A":3,"B":2,"C":1}}],"recommended":"B","recommendation":"An index plus the brief and handoff keeps start-up small however big the board gets; area tags (C) can be layered on once projects get large.","confidence":"lean","chosen":"B","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"agent start-up reading","value":"one-line index, project brief and latest handoff; full entries on demand"}],"_file":"0011-memory-loading.html"},{"id":12,"slug":"main-screen","title":"What does the main screen look like?","date":"2026-11-11","mode":"full","lenses":["ui"],"status":"decided","context":"A small app with a messaging feel: you talk with the orchestrator, drop into any agent, see the decisions that need you, and can look at the board. House rules: no sideways scrolling, drawn icons only, no visibility toggles.","depends_on":[6,9],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Threads, conversation, board on request","summary":"Thread list on the left (orchestrator pinned first, then agents), the conversation in the middle with decision cards inline; the board opens in a side panel when you ask for it or click a card.","pros":["Feels like a messaging app first","Full width for the conversation","Board is one click away, not always taking space"],"cons":["The board is out of sight until you ask"],"effort":"Medium"},{"source":"claude","key":"B","name":"Three columns","summary":"Threads, conversation and the board side by side at all times; at narrow widths the board moves under the conversation.","pros":["Memory always visible","Easy to see what a conversation changed"],"cons":["Cramped conversation on a laptop","Busier screen"],"effort":"Medium"},{"source":"claude","key":"C","name":"Board first, threads over it","summary":"The board is home; clicking an entry or agent opens its conversation over it.","pros":["Puts the long-term memory at the centre","Close to today's Crux board"],"cons":["Less like messaging, which is the point","Conversations feel secondary"],"effort":"Medium"}],"criteria":[{"name":"Feels like messaging","scores":{"A":3,"B":2,"C":1}},{"name":"Board at a glance","scores":{"A":2,"B":3,"C":3}},{"name":"Clutter","scores":{"A":3,"B":1,"C":2}},{"name":"Works on a laptop","scores":{"A":3,"B":1,"C":2}}],"recommended":"A","recommendation":"You asked for messaging first; decision cards inline bring the calls to you, and the board is one click away without crowding the conversation.","confidence":"lean","chosen":"A","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"_file":"0012-main-screen.html"},{"id":13,"slug":"memory-layers","title":"How does the memory keep growing without becoming unreadable?","date":"2026-11-11","mode":"full","lenses":["data-model","architecture"],"status":"decided","context":"Today each project has a board (decisions plus typed entries), and the Crux roll-up keeps a cross-project conventions list. Nothing yet holds what is known about you, and nothing tidies the board as it grows. Every new orchestrator reads the indexes first, so their size is what each agent pays to get started.","depends_on":[9,11],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Project boards only","summary":"Keep what exists. Each board grows on its own; the index-first loading from decision 11 keeps start-up cost down. Your profile is a separate file agents are told to read.","pros":["No new moving parts","Each project stays self-contained"],"cons":["A lesson learned in one project never reaches the others","Old memos pile up; nobody merges them","The profile is outside the system, so it goes stale"],"effort":"None"},{"source":"claude","key":"B","name":"Three layers, tidied at each handoff","summary":"You (profile), all projects (conventions), this project (board). Agents load the three short indexes. When an orchestrator hands off, it also proposes tidy-ups: merge old memos, retire stale ones, and promote anything that holds beyond this project up a layer. Promotions into your profile come to you as one batch card.","pros":["Lessons travel: a rule learned on Ebb reaches AcuLoad","Tidying rides on handoffs, which already happen, so no extra agent or schedule","You only see changes to your own profile, batched"],"cons":["Handoffs get a little longer","Tidy-ups only happen as often as handoffs do"],"effort":"Medium"},{"source":"claude","key":"C","name":"Three layers plus a librarian agent","summary":"Same layers, but a separate low-cost agent runs on a schedule (say nightly) to turn the event log into entries, merge duplicates and propose promotions.","pros":["Board stays tidy even on projects with few handoffs","Can catch things the orchestrator never wrote down"],"cons":["One more agent spending your plan on a schedule","Reads everything, so it can promote things you never meant to keep","More to build and to trust"],"effort":"Large"}],"criteria":[{"name":"Stays readable as it grows","scores":{"A":1,"B":2,"C":3}},{"name":"Lessons reach other projects","scores":{"A":1,"B":3,"C":3}},{"name":"Start-up cost per agent","scores":{"A":3,"B":2,"C":2},"note":"B and C add two short indexes"},{"name":"Clicks asked of you","scores":{"A":3,"B":2,"C":2}},{"name":"Effort","scores":{"A":3,"B":2,"C":1}}],"recommended":"B","recommendation":"It gives the memory somewhere to grow (upward) and a regular moment to tidy itself, without a new scheduled agent. A librarian can be added later if boards outgrow handoffs.","confidence":"lean","chosen":"B","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"agent memory layers","value":"three layers: personal profile, cross-project conventions, project board; agents load each index first; tidy-ups and promotions proposed at every orchestrator handoff, profile changes batched for the human"}],"_file":"0013-memory-layers.html"},{"id":14,"slug":"profile-home","title":"Where does what the system knows about you live?","date":"2026-11-11","mode":"full","lenses":["data-model"],"status":"decided","context":"You asked for it at the root of the Crux repo. That repo is public on GitHub, and the material to merge (your Claude.ai export plus the 45 lessons in Claude Code memory) includes confidential employer work, contract terms, people and family details. Whatever is committed to the repo is published on the next push.","depends_on":[13],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Repo root, public-safe part only","summary":"Commit only the working preferences (how to talk to you, UI rules, testing habits) at the repo root. Everything sensitive lives in a private file elsewhere.","pros":["Literally where you asked","Doubles as an example for other Crux users"],"cons":["Two files to keep in step","Every edit is a judgement call about what is safe to publish"],"effort":"Small"},{"source":"claude","key":"B","name":"Repo root, kept out of git","summary":"A profile folder at the repo root, listed in the ignore file so it is never committed.","pros":["Exactly where you asked, never pushed"],"cons":["One slip in the ignore file or in GitHub Desktop publishes it","No history of changes","Lives on this machine only"],"effort":"Small"},{"source":"claude","key":"C","name":"A private memory repo","summary":"Turn the home crux folder (where the roll-up and conventions already live) into its own private repo. The profile and cross-project memory live there with full history, and sync through GitHub Desktop. The Crux repo root carries a blank template and a pointer.","pros":["History of every change, like your other repos","Private, and on the same footing as your other private repos","Syncs to any machine","Natural home for the top two layers in decision 13"],"cons":["One more repo to keep","Not literally at the Crux repo root"],"effort":"Small"}],"criteria":[{"name":"Nothing sensitive gets published","scores":{"A":2,"B":2,"C":3}},{"name":"Keeps a history","scores":{"A":2,"B":1,"C":3}},{"name":"Works across machines","scores":{"A":2,"B":1,"C":3}},{"name":"Where you asked","scores":{"A":3,"B":3,"C":2}},{"name":"Effort","scores":{"A":3,"B":3,"C":2}}],"recommended":"C","recommendation":"Your memory will hold confidential work, so it should never sit one click from a public push. A private repo keeps it versioned and portable, and the Crux repo still ships a template others can copy.","confidence":"lean","chosen":"C","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"personal profile location","value":"private git repo in the home crux folder (alongside the roll-up); never in a public repo; the public Crux repo ships only a blank template"}],"_file":"0014-profile-home.html"},{"id":15,"slug":"profile-shape","title":"What goes in your profile, and what does each agent load?","date":"2026-11-11","mode":"full","lenses":["data-model"],"status":"decided","context":"The Claude.ai export is about 400 lines across 17 sections, and Claude Code memory holds 45 lessons about how you work. Loading all of it into every agent costs start-up context and puts private details in front of agents that are working on public repos. The orchestrator mainly needs your requirements: how you want work done and approved.","depends_on":[13,14],"conflicts":[],"options":[{"source":"claude","key":"A","name":"One file, everyone loads it all","summary":"Merge everything into one profile; every agent reads it at start.","pros":["Simplest","No agent ever misses anything"],"cons":["Every agent pays for 400+ lines it mostly does not need","Private and confidential details reach agents on public repos, which can leak into commits or docs"],"effort":"Small"},{"source":"claude","key":"B","name":"Core plus project packs","summary":"A short core every agent loads: how to talk to you, how approval and testing work, UI rules, git habits, and the boundaries between projects (stated as rules, without the confidential specifics). A pack per project, loaded only by agents in that project. Personal and contract details sit in a private section that agents read only when a task needs it. New lessons are dated and filed to the right place; changes to the core come to you as a batch.","pros":["Small, fast start for every agent","Private details stay out of unrelated work","The orchestrator gets exactly your requirements"],"cons":["Packs need curating","An agent can miss something that was filed in the wrong pack"],"effort":"Medium"},{"source":"claude","key":"C","name":"Core only; project knowledge moves to boards","summary":"Keep just the core in the profile. Each project's knowledge becomes requirements and conventions on that project's board.","pros":["One source of truth per project","Profile stays tiny"],"cons":["Only works where the hub runs; plain Claude Code or Claude.ai sessions lose the project context","A lot of seeding up front"],"effort":"Large"}],"criteria":[{"name":"Start-up cost per agent","scores":{"A":1,"B":3,"C":3}},{"name":"Keeps private details contained","scores":{"A":1,"B":3,"C":2}},{"name":"Orchestrator understands your requirements","scores":{"A":3,"B":3,"C":2}},{"name":"Works outside the hub","scores":{"A":3,"B":3,"C":1}},{"name":"Effort","scores":{"A":3,"B":2,"C":1}}],"recommended":"B","recommendation":"The orchestrator needs your requirements, not your biography. A short core plus the right project pack gives it that, and keeps confidential material away from agents that have no reason to see it.","confidence":"strong","chosen":"B","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"agent profile loading","value":"short core loaded by every agent; one pack per project loaded only in that project; private section read only when a task needs it; new lessons dated and filed, core changes approved in a batch"}],"_file":"0015-profile-shape.html"},{"id":16,"slug":"handoff-rules","title":"What must a handoff carry, and how does the swap happen?","date":"2026-11-11","mode":"full","lenses":["architecture"],"status":"decided","context":"Decision 10 retires an orchestrator past a context threshold and the new holder starts from the board plus a handoff memo. Today that memo is free text the outgoing agent writes from memory. The goal is that nothing in flight is lost and the next holder can carry on as if nothing changed.","depends_on":[10,13],"conflicts":[],"options":[{"source":"claude","key":"A","name":"A better memo","summary":"Keep the agent-written memo, but require set headings in it: work in flight, promises to you, open questions, risks, next step.","pros":["Small change"],"cons":["The agent can still misremember who is doing what","Facts the hub already knows get retyped and can be wrong"],"effort":"Small"},{"source":"claude","key":"B","name":"Hub writes the facts, agent writes the judgement","summary":"The hub fills in what it knows for certain: each worker and its last summary, open cards, decisions waiting, recent messages from you. The outgoing orchestrator writes only judgement under required headings: why things are the way they are, promises to you, risks, what it would do next, and board tidy-ups. The hub refuses a handoff that skips a heading and asks again. Workers follow the same rule at their own threshold.","pros":["The facts cannot be wrong","The agent spends its words on what only it knows","Same shape for orchestrators and workers"],"cons":["The next holder cannot ask about anything left unclear"],"effort":"Medium"},{"source":"claude","key":"C","name":"B, plus a short overlap","summary":"As B, then the new orchestrator reads the handoff and may ask the outgoing one a few questions (say up to three, or ten minutes) before it retires. The questions and answers are saved with the handoff so later holders see them too.","pros":["Gaps get filled before the old agent is gone","The Q and A becomes part of the memory"],"cons":["Two agents run briefly, so a little more of your plan","The outgoing agent is already near its limit, so answers should be short"],"effort":"Medium"}],"criteria":[{"name":"Nothing in flight is lost","scores":{"A":1,"B":2,"C":3}},{"name":"Facts are reliable","scores":{"A":1,"B":3,"C":3}},{"name":"Usage","scores":{"A":3,"B":3,"C":2}},{"name":"Effort","scores":{"A":3,"B":2,"C":2}}],"recommended":"C","recommendation":"Splitting facts from judgement makes the handoff reliable; the short overlap is what makes it seamless, and it costs little because the questions are few and the answers short.","confidence":"lean","chosen":"C","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"agent handoff","value":"hub writes the facts (workers, last summaries, open cards, waiting decisions); outgoing agent writes judgement under required headings; incoming agent may ask the outgoing one up to three questions before it retires; same rule for workers"}],"_file":"0016-handoff-rules.html"},{"id":17,"slug":"live-map-placement","title":"Where does the live map of the orchestrator and workers live?","date":"2026-11-11","mode":"quick","lenses":["ui"],"status":"decided","context":"The hub gets a live map: the orchestrator role as a particle core whose ring shows context used, workers as stations around it, pulses for messages, red when something needs you. Decision 12 gives the screen to threads and the conversation, with the board on request, so the map needs a place that does not crowd the chat.","depends_on":[12],"conflicts":[],"options":[{"key":"A","name":"Its own thread","summary":"A Map item at the top of the thread list; opening it fills the middle with the map, and tapping a station jumps to that chat.","pros":["Full size, room for many workers","No change to the chat layout"],"cons":["Out of sight while you chat"],"effort":"Medium","source":"claude"},{"key":"B","name":"Strip above the chat","summary":"A short live band over every conversation.","pros":["Always in view"],"cons":["Takes height from the chat, most on a phone"],"effort":"Medium","source":"claude"},{"key":"C","name":"Small map on top of the thread list","summary":"A small map above the threads; tap it for a big version in the middle.","pros":["Always there, chat keeps its height"],"cons":["Small, crowds past about six workers"],"effort":"Medium","source":"claude"},{"key":"D","name":"Always-on strip that zooms to the centre","summary":"A live strip above the conversation is always visible; engaging it zooms the map into the centre of the screen as a full view, and it shrinks back into the strip when you pick a station or close it. On a phone the strip is a slim band that opens to full screen.","pros":["Always visible, the strip's strength","Full size when engaged, the own-view strength","Zoom keeps your sense of place"],"cons":["Strip still takes some height from the chat"],"effort":"Medium to large","source":"human"}],"recommended":"C","recommendation":"Always one glance away without shrinking the conversation; the big version on tap covers what A offers.","confidence":"lean","chosen":"D","reason":"I like the idea of it being visible at all times, and zooming into the center of the screen when engaged. The strip idea is nice for an always on spot that can be seen. It needs to look and behave futuristically, think JARVIS from Ironman.","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"_file":"0017-live-map-placement.html"},{"id":18,"slug":"phone-reach","title":"How does your phone reach the hub when you are away from your desk?","date":"2026-11-11","mode":"full","lenses":["architecture"],"status":"decided","context":"The hub runs on your PC and only answers on that PC (localhost). Away from your desk you cannot see cards or answer them, so agents stall on permission prompts and decisions. Whatever opens it up must keep everyone else out: the hub can run commands on your machine through its agents.","depends_on":[4],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Private network for your devices","summary":"Install Tailscale on the PC and the phone. The hub gets an https address that only your own signed-in devices can open; nothing is reachable from the open internet. On the phone it is the same hub page, added to the home screen like an app.","pros":["Nothing exposed to the internet at all","Full hub on the phone: cards, threads, board, live map","Free for personal use; no domain or server to run","Gives the https the phone needs for notifications"],"cons":["One more app on the PC and the phone","Works only on devices you have signed in","The PC has to be on and awake"],"effort":"Small: install two apps, one command, plus a short hub change to trust the address"},{"source":"claude","key":"B","name":"Public address behind a sign-in","summary":"A Cloudflare tunnel publishes the hub at a subdomain of a domain you own, with Cloudflare Access asking for a one-time email code before anything loads.","pros":["Opens from any browser, even one you have never used","No app on the phone"],"cons":["The hub sits on the open internet; safety rests on the sign-in gate","Needs the domain's DNS moved to Cloudflare","More to set up and to keep right"],"effort":"Medium"},{"source":"claude","key":"C","name":"No remote page: chat only","summary":"Keep the hub on the PC only. Away from your desk, everything comes and goes through a chat app (decision 19 picks which).","pros":["Nothing on the PC is opened up","Works in an app you already check"],"cons":["Only what fits in a chat message: no board, no live map, no full decision pages","Every card's contents pass through the chat company's servers"],"effort":"Medium (it is all in decision 19)"}],"criteria":[{"name":"Keeps strangers out","scores":{"A":3,"B":2,"C":3}},{"name":"Full hub on the phone","scores":{"A":3,"B":3,"C":1}},{"name":"Contents stay with you","scores":{"A":3,"B":2,"C":1},"note":"B passes through Cloudflare; C through the chat company"},{"name":"Setup","scores":{"A":3,"B":1,"C":2}}],"recommended":"A","recommendation":"It gives you the whole hub on the phone without putting anything on the internet, and it is the least to set up. It also provides the secure address that phone notifications (decision 19) need.","confidence":"strong","chosen":"A","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"remote access to local tools","value":"private Tailscale network (tailscale serve gives an https address only your devices can open); nothing exposed on the public internet"}],"_file":"0018-phone-reach.html"},{"id":19,"slug":"away-alerts","title":"How does the hub get your attention, and take quick answers, when you are away?","date":"2026-11-11","mode":"full","lenses":["architecture","ui"],"status":"decided","context":"Reaching the hub is half of it; the other half is knowing when it needs you. A card waiting for an Allow, a decision ready to pick, or a question from an agent should reach you within a minute, and simple answers (Allow, Deny, \"all\", \"4A\") should take one tap or a short reply. Some projects hold confidential work, so where card contents travel matters.","depends_on":[18],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Notifications from the hub itself","summary":"The hub page, added to the phone's home screen, sends its own notifications. Tapping one opens that card in the hub. Nothing passes through a chat company. On iPhone the page has to be added to the home screen first.","pros":["Card contents stay between your PC and your phone","Tapping lands on the real card with all its context","No accounts or bots to run"],"cons":["Needs decision 18 A (or B) for the secure address","Answers happen in the hub page, not as a chat reply"],"effort":"Medium"},{"source":"claude","key":"B","name":"Slack","summary":"A Slack app posts each card to a private channel with Allow, Deny and Take buttons; a reply like \"4A\" in the thread picks. Slack's socket mode means the hub needs no public address.","pros":["Buttons and threads suit cards well","Works without decision 18","You may already have Slack open all day"],"cons":["Card contents (commands, file names, questions) are stored on Slack's servers","A Slack app to create and keep","Confidential projects would have to be kept off it"],"effort":"Medium"},{"source":"claude","key":"C","name":"Telegram","summary":"A Telegram bot sends cards with tap buttons and takes short replies. The bot polls, so no public address either.","pros":["The quickest bot to set up","Good buttons, works on any phone"],"cons":["Contents stored by Telegram","One more chat app if you do not use it already","Confidential projects kept off it"],"effort":"Small to medium"},{"source":"claude","key":"D","name":"WhatsApp","summary":"Cards arrive as WhatsApp messages with reply buttons, through Meta's business messaging platform.","pros":["The app you probably check most"],"cons":["Needs a Meta business account and a separate phone number","Replies need a public address for Meta to call","Message rules and possible per-message charges","Contents pass through Meta"],"effort":"Large"}],"criteria":[{"name":"Contents stay with you","scores":{"A":3,"B":1,"C":1,"D":1}},{"name":"One-tap answers","scores":{"A":2,"B":3,"C":3,"D":2}},{"name":"Works without opening the PC up","scores":{"A":1,"B":3,"C":3,"D":1}},{"name":"Setup","scores":{"A":2,"B":2,"C":3,"D":1}}],"recommended":"A","recommendation":"With decision 18 A in place, the hub's own notifications reach you without any card leaving your devices, which matters for confidential projects. Slack can be added later as an extra channel for projects that are safe to post, if one-tap replies in chat turn out to matter.","confidence":"lean","chosen":"A","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"phone notifications from local tools","value":"web push from the tool itself to its home-screen app; card contents never pass through a third-party chat service"}],"_file":"0019-away-alerts.html"},{"id":20,"slug":"agent-choice","title":"How do you choose each agent's model, effort and kind?","date":"2026-11-11","mode":"full","lenses":["architecture","ui"],"status":"decided","context":"Every hub agent today runs Claude Code's default (Opus 5.5) at default effort, orchestrator and workers alike. The Agent SDK the hub uses can set a model and an effort level per agent, switch a running agent's model, and run named agent types that carry their own model, tool limits and standing instructions. The question is how you make those choices, and how much the orchestrator may make on its own. Whichever option: every agent shows its model and effort in colour, on its thread, in the sidebar and on the live map. Each model has its own hue (Opus violet, Sonnet cyan, Haiku pink, Fable copper, chosen to stay clear of the hub's red, amber, green and blue status colours), and effort is a row of five pips in that hue, more of them lit the higher the effort.","depends_on":[7,10],"conflicts":[],"options":[{"source":"claude","key":"A","name":"Pick per agent","summary":"A model and effort picker when you start an agent, defaults per role (orchestrator, worker) in the hub's settings, and a switch on each thread to change a running agent's model. The orchestrator can set model and effort when it starts a worker, and you can tell it which in plain words.","pros":["Direct and easy to understand","Everything you asked for is choosable","Small to build"],"cons":["Each choice is made from scratch every time","No shared idea of \"a reviewer\" or \"a quick fixer\" to reuse"],"effort":"Small"},{"source":"claude","key":"B","name":"Agent types, plus per-agent picks","summary":"Everything in A, plus named agent types: \"reviewer\", \"quick fix\", \"researcher\" and so on, each with its model, effort, tool limits and standing instructions. They are written in Claude Code's own agent file format, so the same types work in plain Claude Code too, and live in your home folder (all projects) or a project (that project only). The orchestrator sees the list and picks a type for each subtask, or you name one (\"put a reviewer on it\").","pros":["Good choices are made once and reused","The orchestrator can match the kind of agent to the subtask","Shared with plain Claude Code sessions","Per-agent picks still override anything"],"cons":["A few type files to write and keep","More for the orchestrator to weigh"],"effort":"Medium"},{"source":"claude","key":"C","name":"The orchestrator decides from your rules","summary":"No pickers. Your core profile gets rules (\"tricky or shared-system work: Opus at high effort; mechanical edits: a lighter model\") and the orchestrator chooses for each worker. You override by saying so in chat.","pros":["Nothing extra to click","Choices follow your stated preferences"],"cons":["Choices happen out of sight unless shown","Harder to pin a specific model when you want one"],"effort":"Small"}],"criteria":[{"name":"You can choose anything","scores":{"A":3,"B":3,"C":1}},{"name":"Good choices get reused","scores":{"A":1,"B":3,"C":2}},{"name":"Orchestrator picks well on its own","scores":{"A":1,"B":3,"C":2}},{"name":"Works in plain Claude Code too","scores":{"A":1,"B":3,"C":2},"note":"B uses Claude Code's own agent files"},{"name":"Effort","scores":{"A":3,"B":2,"C":3}}],"recommended":"B","recommendation":"You asked for everything to be choosable, and A gives that. Types are what let the orchestrator \"spin up a reviewer\" sensibly without you spelling out a model every time, and keeping them in Claude Code's own format means your other sessions benefit too. Each agent's model and effort would also show on its thread and on the live map.","confidence":"lean","chosen":"B","reason":"Colours look good, go with your proposal.","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"agent model and effort display","value":"model as hue (Opus violet, Sonnet cyan, Haiku pink, Fable copper), effort as five pips in that hue; kept clear of red/amber/green/blue status colours"},{"key":"agent types","value":"Claude Code agent files (.claude/agents/*.md, home or project) with model, effort, tools and standing instructions; per-agent picks override"}],"_file":"0020-agent-choice.html"},{"id":21,"slug":"permission-answers","title":"Who answers the agents' permission requests?","date":"2026-11-11","mode":"quick","lenses":["architecture","research"],"status":"decided","context":"Every permission prompt from every agent (bash commands, file edits and so on) goes to Matt today, which makes him the bottleneck. The idea was always that these reach the orchestrator, which answers them under authority Matt grants, while he watches and can review. Extends decision 7: push, merge and delete stay with Matt.","depends_on":[7,19],"conflicts":[],"options":[{"key":"A","name":"Orchestrator answers within rules Matt sets","summary":"Requests go to the orchestrator first. A rules entry on the board says what it may allow (build, test, read, edits inside the project, local commits). Push, merge, delete, package installs, anything outside the project folder and network access always go to Matt. Every answer is logged in the orchestrator's thread, and Matt can change or revoke the rules at any time.","pros":["Removes almost all bash prompts","Hard-to-undo actions stay with Matt","Every answer is logged for audit"],"cons":["The orchestrator may misjudge a borderline request"],"effort":"Medium","source":"claude"},{"key":"B","name":"Fixed allowlist, no judgment","summary":"The hub auto-approves anything matching a pattern list; the rest still goes to Matt.","pros":["Predictable"],"cons":["Every new command shape is another prompt","Lists tend to grow loose"],"effort":"Small","source":"claude"},{"key":"C","name":"Orchestrator answers everything except a short block list","summary":"Only push, merge, delete and work outside the project reach Matt.","pros":["The fewest prompts"],"cons":["Installs and network access pass without Matt seeing them"],"effort":"Small","source":"claude"}],"criteria":[],"recommended":"A","recommendation":"Removes almost all the bash prompts while keeping Matt in charge of anything hard to undo, with a log to audit. B can be added later as a fast path for obviously safe commands.","confidence":"lean","chosen":"A","reason":"A is perfect","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"agent permission authority","value":"orchestrator answers permission prompts within human-set rules; push, merge, delete, installs, outside-project and network always go to the human; every answer logged"}],"_file":"0021-permission-answers.html"},{"id":22,"slug":"push-and-prs","title":"May the orchestrator and workers push branches and open PRs?","date":"2026-11-11","mode":"quick","lenses":["research"],"status":"decided","context":"Decision 7 kept push, merge and delete with Matt. Pushing a feature branch and opening a PR is low risk (a PR is easy to close) and was costing Matt busywork. Amends decision 7 on push only; merging and deleting stay with Matt.","depends_on":[7,21],"conflicts":[],"options":[{"key":"A","name":"Feature branches and PRs","summary":"The orchestrator or workers may push feature branches and open PRs. Merging, pushing to main, force-pushing and deleting branches stay with Matt.","pros":["Removes the push busywork","A PR is easy to close"],"cons":["Work becomes visible on GitHub without a fresh OK"],"effort":"Small","source":"claude"},{"key":"B","name":"Push only when told","summary":"Push a branch only when Matt says so in chat.","pros":["Matt sees every push"],"cons":["Still a message per branch"],"effort":"Small","source":"claude"},{"key":"C","name":"Keep decision 7 as is","summary":"All pushes go to Matt.","pros":["Nothing leaves the machine without Matt"],"cons":["Busywork for Matt"],"effort":"None","source":"claude"}],"criteria":[],"recommended":"A","recommendation":"Saves the most busywork; merging is the step that matters and it stays with Matt.","confidence":"lean","chosen":"A","reason":"Pushing and opening PRs is a task that you or the workers can do","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"agent git push authority","value":"agents may push feature branches and open PRs; merge, push to main, force push and branch deletion stay with the human"}],"_file":"0022-push-and-prs.html"},{"id":23,"slug":"image-attachments","title":"When you paste a screenshot into a thread, where is the image kept?","date":"2026-11-11","mode":"quick","lenses":["data-model","ui"],"status":"decided","context":"Matt wants to paste or drop screenshots into hub threads, and copy screenshots agents post. The images have to be stored somewhere, and agents must receive them as real images. Builds on decision 2 (append-only event log).","depends_on":[2,12],"conflicts":[],"options":[{"key":"A","name":"Files next to the project's event log","summary":"Images are saved under the project's .crux/attachments/; the message event points to the file. Agents receive the image itself. Screenshots agents post can share the same store.","pros":["Keeps the event log lean","Each project is self-contained",".crux/ is already kept out of git"],"cons":["The folder grows; needs an occasional tidy"],"effort":"Medium","source":"claude"},{"key":"B","name":"Inline in the event log","summary":"Images are stored as data inside the message events.","pros":["Simplest"],"cons":["The append-only log keeps every image forever, growing heavy and slow to replay"],"effort":"Small","source":"claude"},{"key":"C","name":"In the home folder, outside every project","summary":"Images go to ~/.crux-hub/attachments/.","pros":["Confidential screenshots never sit in a project folder"],"cons":["The project's history depends on files kept elsewhere"],"effort":"Medium","source":"claude"}],"criteria":[],"recommended":"A","recommendation":"Keeps the log lean and the project self-contained, and .crux/ is already out of git.","confidence":"lean","chosen":"A","reason":null,"decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"chat image attachments storage","value":"files under the project's .crux/attachments/, referenced by id from message events; never inline in the event log"}],"_file":"0023-image-attachments.html"},{"id":31,"slug":"status-colours","title":"What does each status colour mean across the hub?","date":"2026-11-11","mode":"quick","lenses":["ui"],"status":"decided","context":"Today 'needs you' is amber in the sidebar and project badge but red on the live map, unread messages are also amber, and blue means both 'working' and 'open decision' and is the colour of every main button. Decision 20 kept the model hues clear of red, amber, green and blue, so those four need one fixed meaning each. Found in the ux-review round.","depends_on":[12,17,20],"conflicts":[],"options":[{"key":"A","name":"Red is your call, everywhere","summary":"Red only for things waiting on you (badges, card frames, map stations, the phone strip). Amber only for warnings (handoff threshold, 'runs code' tags, amber marks). Green for done or resting, cyan-blue for working. Unread becomes a small white dot.","pros":["One glance anywhere tells you whether you are needed","Matches the map, which already uses red","Amber warnings stop competing with your queue"],"cons":["A lot of red when many things wait; mitigated by red counts rather than whole red stations"],"effort":"Small: colour tokens in style.css and map.css, a few class names in app.js","source":"claude"},{"key":"B","name":"Amber is your call, everywhere","summary":"Keep the sidebar's amber for 'needs you' and change the map's red stations to amber; red is kept for errors only.","pros":["Calmer screen","Red stays rare, so an error stands out"],"cons":["Amber also means warning, so 'needs you' and 'careful' blur together","Changes the map you already approved"],"effort":"Small","source":"claude"},{"key":"C","name":"Leave as is","summary":"Sidebar amber, map red, unread amber.","pros":["No work"],"cons":["The same state shows in two colours depending on where you look"],"effort":"None","source":"claude"}],"recommended":"A","recommendation":"Red already carries 'act here' on the map and in phone notifications; using it for exactly that everywhere, and amber only for warnings, makes the queue readable at a glance.","confidence":"lean","chosen":"A","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"_file":"0031-status-colours.html"},{"id":32,"slug":"phone-start-screen","title":"What does the hub show first when you open it on your phone?","date":"2026-11-11","mode":"quick","lenses":["ui"],"status":"decided","context":"On a phone the hub opens on the thread list, so answering anything takes a tap into Needs you first, and moving between threads means going back to the list each time. Decision 12 set the desktop layout; the phone layout was never decided. Found in the ux-review round.","depends_on":[12,17,19],"conflicts":[],"options":[{"key":"A","name":"Needs you first, list behind Back","summary":"Open straight into Needs you when something waits (thread list when nothing does). Back still shows the list. Nothing else changes.","pros":["One tap less for the common case","Smallest change"],"cons":["Moving between agents still goes through the list"],"effort":"Small","source":"claude"},{"key":"B","name":"Bottom bar with four places","summary":"A bar at the bottom with Needs you, Orchestrator, Agents and Map, each with its count. Opens on Needs you when something waits. The map strip stays on top as decided.","pros":["Every place one thumb tap away","Counts always visible","Feels like a phone app from the home screen"],"cons":["Takes about 56 px of height","A second way to navigate next to the strip"],"effort":"Medium","source":"claude"},{"key":"C","name":"Leave the list first","summary":"Keep today's behaviour; notification taps already land on the card.","pros":["No work","Notifications cover the urgent case"],"cons":["Opening the app yourself always costs an extra tap"],"effort":"None","source":"claude"}],"recommended":"A","recommendation":"Most phone visits are to answer something; landing on Needs you fixes that at almost no cost. B is worth it only if you move between agents a lot on the phone.","confidence":"toss-up","chosen":"A","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"_file":"0032-phone-start-screen.html"},{"id":33,"slug":"hud-look","title":"How far does the JARVIS look reach beyond the live map?","date":"2026-11-11","mode":"quick","lenses":["ui"],"status":"decided","context":"The live map strip is full HUD (cyan glass, mono labels, corner brackets, scan lines); the rest of the hub is a calm messaging app, so the two halves read like different products. You asked for a futuristic JARVIS look at maximum polish. Readability of long messages and cards must not suffer. Found in the ux-review round.","depends_on":[12,17,20],"conflicts":[],"options":[{"key":"A","name":"HUD frame, readable content","summary":"The shell takes the HUD language: sidebar and headers get cyan hairlines and glow edges, cards waiting on you get corner brackets, labels become small mono capitals, decision options get hexagon keys, a short boot sequence on load, a lock-on flash when a notification opens a card. Message and card text stays in the normal sans font at full contrast.","pros":["One product from strip to composer","Long text stays easy to read","Respects reduced motion"],"cons":["Touches most of style.css","Needs care so brackets do not clutter long threads"],"effort":"Large, in two or three passes","source":"claude"},{"key":"B","name":"Full HUD everywhere","summary":"Everything in the HUD style, including mono text for messages and a glass background over a live grid.","pros":["Strongest look"],"cons":["Mono body text is slower to read on a phone","Glass and grids lower contrast"],"effort":"Large","source":"claude"},{"key":"C","name":"Keep the HUD in the map","summary":"Only small touches outside the map (focus rings, link light).","pros":["Little work","Calm chat"],"cons":["Two visual languages stay side by side"],"effort":"Small","source":"claude"}],"recommended":"A","recommendation":"It carries the map's look into every frame you touch while keeping what you read in a readable font; the desktop and phone mockups from this round show it.","confidence":"lean","chosen":"A","reason":"","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[],"_file":"0033-hud-look.html"},{"id":34,"slug":"auto-mode-per-repo","title":"How much may agents do without asking, per repo?","date":"2026-11-11","mode":"quick","lenses":["architecture"],"status":"decided","context":"Under decision 21 every non-read request went to the orchestrator for judgment. The flood of approvals showed that is still too much friction. Matt wants agents to behave like Claude Code sessions in auto mode: broad authority for anything in their workflow inside their folder, set per repo. Amends decision 21 (the orchestrator now handles only what the hub can't classify) and works within decisions 7 and 22.","depends_on":[7,21,22],"conflicts":[],"options":[{"key":"A","name":"Auto mode per repo","summary":"A per-repo hub setting (auto, on for this repo). The hub allows at once anything whose effects stay inside the project folder, the agent's worktree or its own temp folder: edits, builds, tests, scripts, local git, feature-branch pushes and PRs, test hubs on other ports. Hard stops still go to Matt. The orchestrator is asked only about requests the hub can't classify, with the 2-minute fallback to Matt. Repos without the setting behave as in decision 21.","pros":["Approvals nearly vanish","Hard-to-undo actions still reach Matt","Matt opts in per repo"],"cons":["Less review of ordinary commands","Relies on the hard-stop matcher being conservative"],"effort":"Small on top of decision 21's work","source":"human"}],"criteria":[],"recommended":"A","recommendation":"Matt's own call.","confidence":"strong","chosen":"A","reason":"Act like Claude Code sessions under auto: broad authority for anything that touches their workflow inside their folder; fine to set it per repo.","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"agent permission mode","value":"per-repo auto mode: anything contained to the project folder, worktree or temp folder is allowed without asking; hard stops (merge, push to main, force push, branch deletion, history rewrite, installs, writes outside the project, network beyond GitHub, secrets, the live hub) go to the human"}],"_file":"0034-auto-mode-per-repo.html"},{"id":35,"slug":"pick-landing","title":"Where should Matt's picks from the hub page land?","date":"2026-11-11","mode":"quick","lenses":["architecture"],"status":"decided","context":"Picking a decision in the hub page wrote the record straight into the project's main folder and rebuilt the pages there. Convention C005 says no one works in main, so those files sat uncommitted until someone swept them into a branch. Builds on decision 2 (the board and its records) and decision 34 (agents work in their own folders).","depends_on":[2,34],"conflicts":[],"options":[{"key":"A","name":"A standing docs branch with one open PR","summary":"The hub writes picks (and the orchestrator's drafts) into a standing worktree on docs/decisions, builds the pages there, commits, pushes, and keeps one rolling pull request open. The board reads the main folder plus the unmerged picks, so a pick shows as decided at once.","pros":["The main folder is never touched","Matt merges records like any other change","Picks show at once"],"cons":["One more branch and PR to merge from time to time"],"effort":"Small","source":"claude"},{"key":"B","name":"Committed straight to main by the hub","summary":"The hub commits each pick to main and pushes it.","pros":["No PR to merge"],"cons":["Pushes to main without Matt's review","Breaks the rule that merges to main need his OK"],"effort":"Small","source":"claude"},{"key":"C","name":"Left uncommitted in the main folder","summary":"As before: the record is written into the main folder and the next worker sweeps it into a branch.","pros":["No change"],"cons":["Breaks C005","Records can sit uncommitted and be lost or committed by accident"],"effort":"None","source":"claude"}],"criteria":[],"recommended":"A","recommendation":"Keeps the main folder clean and every record reviewed, at the cost of one rolling PR.","confidence":"strong","chosen":"A","reason":"Picks must not write into the main folder (C005).","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"decision record landing","value":"picks are committed to a standing docs/decisions branch with one rolling PR; never written into the main folder"}],"_file":"0035-pick-landing.html"},{"id":36,"slug":"usage-display","title":"How does the hub show Matt's usage?","date":"2026-11-11","mode":"quick","lenses":["data-model","ui"],"status":"decided","context":"Matt wants to see his plan usage, and Fable usage in particular, in the hub's visual display. The Agent SDK gives per-turn tokens and estimated cost per model (stable), and the plan limits behind /usage (5-hour, 7-day, per-model weekly windows with reset times) through a method marked experimental, plus rate_limit events. The hub keeps none of it today.","depends_on":[2,17,20,31],"conflicts":[],"options":[{"key":"A","name":"Plan meters plus per-model totals","summary":"A hub-wide poller reads plan usage every few minutes through the experimental call and listens for rate_limit events. A usage event per turn goes into the append-only log, so totals survive restarts. The always-on strip carries 5-hour, 7-day and Fable meters, with a usage panel on click. If the experimental call fails, the meters hide quietly.","pros":["Answers how close Matt is to his limits, including Fable","Totals survive restarts","Degrades quietly"],"cons":["Relies on an experimental SDK method","Medium effort"],"effort":"Medium","source":"claude"},{"key":"B","name":"Per-model totals only","summary":"Stable data only: today's and the session's tokens and estimated cost per agent and model, in a panel.","pros":["Stable features only"],"cons":["No plan percentages or reset times"],"effort":"Small","source":"claude"},{"key":"C","name":"Limit warnings only","summary":"No meters; an amber notice near a limit, red when work is blocked.","pros":["Least effort"],"cons":["Least information"],"effort":"Small","source":"claude"}],"criteria":[],"recommended":"A","recommendation":"It answers what Matt asked, including Fable, and the quiet fallback makes the experimental risk acceptable.","confidence":"lean","chosen":"A","reason":null,"decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"usage display","value":"plan meters (5-hour, 7-day, per-model incl. Fable) in the alw
