ays-on strip from the SDK usage method plus rate_limit events, per-turn usage events in the log, a usage panel on click; hide quietly if the experimental call fails"}],"_file":"0036-usage-display.html"},{"id":37,"slug":"idle-handoff","title":"When should the orchestrator hand off besides the 60% threshold?","date":"2026-11-11","mode":"quick","lenses":["architecture"],"status":"decided","context":"After a long idle stretch the prompt cache has expired, so the next message makes a long-running orchestrator re-read its whole context (hundreds of thousands of tokens), which is slow and costly. A fresh orchestrator starts from the board index and a handoff instead. Amends decision 10, which hands off only at the 60% context threshold.","depends_on":[10,13,16],"conflicts":[],"options":[{"key":"A","name":"When Matt says so","summary":"Matt says hand off, at the end of the day or any time.","pros":["Full control"],"cons":["Matt has to remember"],"effort":"Small","source":"claude"},{"key":"B","name":"Automatically after a long idle stretch","summary":"If the orchestrator has been idle for 3 hours and is above 25% context, it writes the handoff and retires; the next message goes to a fresh orchestrator. Matt can still say hand off any time. The 60% threshold stays.","pros":["Avoids the costly cold re-read after nights and long breaks","No action needed from Matt"],"cons":["May hand off during a long break"],"effort":"Small to medium","source":"claude"},{"key":"C","name":"60% threshold only","summary":"No change.","pros":["Nothing to build"],"cons":["Expensive re-read every morning"],"effort":"None","source":"claude"}],"criteria":[],"recommended":"B","recommendation":"Handles the overnight case without Matt thinking about it; the floor keeps it from churning on light days.","confidence":"lean","chosen":"B","reason":"B, with the idle window at 3 hours and the floor at 25%; then, once a rolling handoff draft makes handing off cheap, the idle window drops to 1 hour (as the prompt cache expires)","decided_on":"2026-11-11","superseded_by":null,"challenge":null,"settles":[{"key":"orchestrator idle handoff","value":"hand off automatically after 1 hour idle when above 25% context, published from a rolling handoff draft without waking the old agent; in addition to the 60% threshold and on the human's word"}],"_file":"0037-idle-handoff.html"},{"id":38,"slug":"plan-login-wording","title":"How should the public page present running the Hub on a Claude plan login?","date":"2026-11-12","mode":"quick","lenses":["research"],"status":"decided","context":"The Hub runs its agents on the user's own Claude Code login and plan limits by default. Anthropic's Agent SDK documentation says third-party developers may not offer claude.ai login or plan limits in their products unless previously approved, and should use API keys instead (reported by the docs-audit worker from the SDK overview page; not yet re-checked by a second reader). The public page at crux.notarobot-eng.com will market the Hub to strangers, so how setup is worded matters before it is written.","depends_on":[1,36],"conflicts":[],"options":[{"key":"A","name":"Ask Anthropic for approval","summary":"Write to Anthropic and ask for approval to offer plan login in the Hub. The page waits, or launches with option B's wording until an answer comes.","pros":["The only route that makes plan login a fully supported, advertised way to run the Hub","A clear answer either way"],"cons":["No known timeline or guarantee of an answer","Holds the Hub part of the page, or needs B's wording in the meantime anyway"],"effort":"One email from Matt; unknown wait","source":"claude"},{"key":"B","name":"API key is the documented way","summary":"The page and README tell strangers to run the Hub with their own Anthropic API key. Plan login stays in the code as Matt's personal setup and is not advertised. The API-key switch already exists.","pros":["Matches Anthropic's stated rule as written","No waiting: the page can go ahead now","Needs only wording, plus making the API key the easy path in setup"],"cons":["API use is paid per token, so the Hub is less attractive to people who already pay for a plan","The plan usage meters mean little to API-key users","The default in the code (plan login) and the documented way would differ unless the default is flipped later"],"effort":"Wording only now; a small follow-up if the default should flip","source":"claude"},{"key":"C","name":"A personal tool you run yourself","summary":"The page describes the Hub as open-source software each person runs on their own machine with their own Claude Code login, the same as running Claude Code. Setup shows plan login first and the API key as the alternative.","pros":["Most attractive to plan subscribers","Describes how the Hub actually works today"],"cons":["Rests on Matt's reading that an open-source tool run locally is not 'offering' plan login; Anthropic may read it differently","Marketing it publicly makes that reading riskier","If Anthropic objects, the page and setup need rewriting"],"effort":"Wording only","source":"claude"}],"criteria":[{"name":"Fits Anthropic's stated rule","scores":{"A":3,"B":3,"C":1},"note":"C depends on an untested reading of the rule"},{"name":"Page can go ahead now","scores":{"A":1,"B":3,"C":3}},{"name":"Appeal to strangers","scores":{"A":3,"B":2,"C":3},"note":"A scores 3 only if approval is granted"},{"name":"Risk of rework later","scores":{"A":2,"B":3,"C":1}}],"recommended":"B","recommendation":"Document the API key as the way to run the Hub now, and send the approval request in parallel if plan login matters for marketing. It is the only wording that is safe today and it does not block the page. This is Claude's judgment, not legal advice.","confidence":"lean","chosen":"B","reason":"","decided_on":"2026-11-12","superseded_by":null,"challenge":null,"settles":[],"_file":"0038-plan-login-wording.html"},{"id":39,"slug":"pinned-threads","title":"How do two or three threads stay open at once in the main window?","date":"2026-11-12","mode":"quick","lenses":["ui"],"status":"decided","context":"The main window shows one conversation at a time (decision 12). On a wide screen most of the width is blank, and Matt wants to pin threads so two or three are open together, for example talking to the orchestrator while watching a worker. The pin-mockups worker drew both layouts on the real hub page with demo content, at 3170 and 1440 wide, with two and three threads open (stills posted in the hub). The phone layout stays one thread at a time in both.","depends_on":[12,31,33],"conflicts":[],"options":[{"key":"A","name":"Split columns","summary":"Pinning a thread opens it as a full column beside the current one, each with its own header and message box. Up to three columns share the width evenly. A cyan top line marks the column that has the keyboard; a red count in a column header means a card waits there. When more are pinned than fit, the extra one folds to a slim rail on the right and opens with one click.","pros":["Fills the wide screen: three readable columns of about 965 px at 3170 wide","Every column is the same full conversation, so nothing new to learn","Less to build than B: one conversation part that can exist several times, then a simple layout"],"cons":["On a laptop only two columns fit, and one with the board open","Column headers get tight at laptop width: buttons become icons with hover labels and the task line drops out","Medium to large change: about a third of the page code assumes one open thread"],"effort":"Medium to large (worker's estimate)","source":"claude"},{"key":"B","name":"Main thread plus watch panes","summary":"The main conversation keeps the centre. Pinned threads sit as narrower panes on the right showing the latest messages, the working line, any red card with its buttons, and a one-line reply box. A button in the pane header swaps it into the main spot. On a laptop the panes stack.","pros":["One conversation clearly stays the main one","Panes are compact, so three fit on a laptop by stacking"],"cons":["On the wide screen most of the main area is still blank, which is the problem to solve","Two ways of drawing a conversation (full and compact) to build and keep in step","More to build than A: the same groundwork plus the compact view, the swap and the stacking rules"],"effort":"Large: A's groundwork plus more (worker's estimate)","source":"claude"}],"criteria":[{"name":"Uses the wide screen","scores":{"A":3,"B":1}},{"name":"Works on a laptop","scores":{"A":2,"B":2},"note":"A shows two columns and a rail; B stacks narrow panes"},{"name":"Simple to understand","scores":{"A":3,"B":2}},{"name":"Build effort","scores":{"A":2,"B":1}}],"recommended":"A","recommendation":"Split columns. It is the one that fills the blank width, each column is the conversation Matt already knows, and B needs everything A needs plus more. With A, the defaults proposed are: the extra pinned thread folds to a slim rail when it does not fit; Needs you can be pinned like any thread; clicking an unpinned thread in the list replaces the column that has the keyboard. Claude's judgment, based on the mock-ups and the worker's reading of the page code.","confidence":"strong","chosen":"A","reason":"","decided_on":"2026-11-12","superseded_by":null,"challenge":null,"settles":[],"_file":"0039-pinned-threads.html"},{"id":40,"slug":"docs-only-merges","title":"Who merges pull requests that hold only decision records or documentation?","date":"2026-11-12","mode":"quick","lenses":["research"],"status":"decided","context":"Picks made in the hub land on a standing docs/decisions branch with one rolling pull request (decision 35), and every merge has needed Matt's word (decisions 7 and 22). On 2026-11-12 that meant three separate 'merge' replies for records-only pull requests. Matt said that having to say merge each time is the part that bothers him, and that records-only and documentation-only merges are fine without his approval in most of his repos.","depends_on":[7,22,35],"conflicts":[],"options":[{"key":"A","name":"Keep as is","summary":"One rolling records pull request; Matt says merge each time.","pros":["No change to the rule that every merge is Matt's"],"cons":["A merge reply for every pick, with nothing in it for Matt to review"],"effort":"None","source":"claude"},{"key":"B","name":"Records ride with the build","summary":"The record goes into the pull request of the work that builds it.","pros":["Fewer pull requests"],"cons":["Picks that lead to no code have no home","The record reaches main later than the pick"],"effort":"A change to how the hub lands picks","source":"claude"},{"key":"C","name":"The orchestrator merges records-only and documentation-only pull requests","summary":"When a pull request changes nothing but decision records and documentation, the orchestrator merges it without asking and tells Matt in one line. Every other merge stays Matt's. Each person sets this per repo; it is Matt's rule for this repo and most of his others.","pros":["Removes the merge reply that carries no real review","Code merges, pushes to main, force pushes and deletions stay with Matt","Still one line in the thread for each merge, so nothing happens unseen"],"cons":["Documentation in a public repo can still leak something private, so the orchestrator must check what the pull request contains before merging","Needs a clear line for what counts as documentation"],"effort":"A rule for the orchestrator now; a per-repo setting in the hub later if wanted","source":"human"}],"criteria":[],"recommended":"C","recommendation":"Matt's own rule. The line used: a pull request counts as records-only or documentation-only when every changed file is under .decisions/ or is a Markdown document (README, INSTALL, guides, notes) or a picture those documents show. Anything that runs or is published as a product (code, scripts, settings, package files, the public web page in site/) is not documentation for this rule. Before merging, the orchestrator checks the file list, checks it merges cleanly, and in a public repo checks nothing private is in it; when in doubt it asks.","confidence":"strong","chosen":"C","reason":"Having to say merge each time is what bothers me. In general, documentation-only PRs and merges are fine with me. In most of my repos, I'm fine with the orchestrator merging records-only / documentation without my approval.","decided_on":"2026-11-12","superseded_by":null,"challenge":null,"settles":[{"key":"records and documentation merges","value":"the orchestrator may merge pull requests that change only decision records and documentation (Markdown and its pictures), reporting each in one line; set per repo by the human; all other merges stay with the human (see agent git push authority)"}],"_file":"0040-docs-only-merges.html"},{"id":41,"slug":"record-files-in-git","title":"Which decision record files go into git?","date":"2026-11-12","mode":"quick","lenses":["architecture","data-model"],"status":"decided","context":"Each record is saved three ways: the .json is the source (about 70 lines), the .md is the readable copy that GitHub and phones show nicely (about 40 lines), and the .html page is about 290 lines, plus an index.html that every build rewrites. Another of Matt's projects found the pages made up about 75% of a 61-file records pull request, and GitHub's merge timed out on it twice. GitHub also shows .html only as raw code. And every page carries links to all the other decisions, so adding one record rewrites every page in the folder: drafting this one changed 34 pages for one new line in each. The build script recreates every page from the .json, so nothing would be lost. That project now keeps the pages local, with Matt's OK, and its orchestrator suggested the same for Crux. Builds on decision 35 (records land on a rolling docs/decisions pull request) and decision 40 (the orchestrator merges records-only pull requests).","depends_on":[35,40],"conflicts":[],"options":[{"key":"A","name":"Commit .json and .md; build the pages locally","summary":"A .gitignore inside .decisions ignores *.html, so the pages and index.html stay on disk but out of git. The build script writes that .gitignore whenever it creates a .decisions folder, the hub's records worktree does the same, and the hub rebuilds a project's pages after a pull when a .json is newer than its page.","pros":["Records pull requests shrink to about a quarter","No more conflicts between two branches that both add records: today each new record rewrites every page and index.html","GitHub and phones show the .md, which is what reads well there anyway","Nothing is lost: every page is rebuilt from its .json"],"cons":["After a pull, the pages are missing or stale until something runs the build, so the hub and the roll-up need to rebuild before they link to a page","Someone who clones the public repo has to run the build to see the pages (the example folder keeps its own pages)","A one-time cleanup in each repo: untrack the existing pages, which stay on disk"],"effort":"Small: a .gitignore, a rebuild-if-stale step in the hub and roll-up, and doc updates","source":"claude"},{"key":"B","name":"Keep all three, marked as generated","summary":"Keep committing the pages, but mark them as generated in .gitattributes so GitHub folds them away in pull request views.","pros":["Pages are always there after a pull, with no rebuild step","Small change"],"cons":["The pages still make up most of every records pull request, and it is not clear this stops the merge timeouts","Every new record still rewrites every page, so two branches that add records conflict on all of them"],"effort":"Tiny","source":"claude"},{"key":"C","name":"Commit only the .json","summary":"Treat both the .md and the .html as generated and keep them local.","pros":["The smallest records pull requests"],"cons":["Records are no longer readable on GitHub or a phone","Reviewing a records pull request means reading raw JSON"],"effort":"Small","source":"claude"}],"criteria":[{"name":"Small, reviewable records pull requests","scores":{"A":3,"B":1,"C":3}},{"name":"Readable on GitHub and phones","scores":{"A":3,"B":2,"C":1}},{"name":"Pages ready without a rebuild","scores":{"A":1,"B":3,"C":1}},{"name":"No conflicts between branches","scores":{"A":3,"B":1,"C":3},"note":"index.html is rewritten by every build"}],"recommended":"A","recommendation":"A keeps what reads well on GitHub and drops what only bloats pull requests and causes conflicts. Its one real cost, pages missing after a pull, is solved by having the hub and the roll-up rebuild stale pages before linking to them. If picked, the build script and the docs/decisions setup write the .gitignore by default, so every repo gets it.","confidence":"strong","chosen":"A","reason":"","decided_on":"2026-11-12","superseded_by":null,"challenge":null,"settles":[],"_file":"0041-record-files-in-git.html"}]</script>
<script>
const ALL = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(4,'0');
const ic = d => `<svg class="icon" viewBox="0 0 24 24">${d}</svg>`;
const I = {
  flag: ic('<path d="M6 21V4M6 4h11l-2 4 2 4H6"/>'),
  alert: ic('<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.01"/>'),
  eye: ic('<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>'),
  split: ic('<path d="M12 21v-7M12 14L6 6M12 14l6-8M6 6V3M18 6V3"/>'),
  check: ic('<circle cx="12" cy="12" r="8.5"/><path d="M8.3 12.2l2.6 2.6 4.9-5.2"/>'),
  archive: ic('<rect x="3.5" y="4.5" width="17" height="4" rx="1"/><path d="M5 8.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5M10 12.5h4"/>'),
  grid: ic('<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>'),
  layers: ic('<path d="M12 4l8.5 4.5L12 13 3.5 8.5z"/><path d="M3.5 12.5L12 17l8.5-4.5M3.5 16.5L12 21l8.5-4.5"/>'),
  tree: ic('<circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="12" r="2.2"/><path d="M8.2 6.6C13 8 13 11 15.8 11.6M8.2 17.4C13 16 13 13 15.8 12.4"/>'),
  clock: ic('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
  bars: ic('<path d="M4 20h16M7 20v-7M12 20V6M17 20v-10"/>')
};
// One state per decision drives every colour on the page.
const STATES = [
  { k:'openitem', name:'Open item', hint:'Flagged for review in the repo’s own log', c:'var(--bad)', icon:I.flag, test:d => d.open_item && (d.status==='found'||d.status==='open') },
  { k:'strained', name:'Strained', hint:'Deliberate, but now causing cost or risk', c:'var(--warn)', icon:I.alert, test:d => d.holding_up==='strained' && d.status!=='superseded' && d.status!=='rejected' },
  { k:'open', name:'Needs your call', hint:'Open decisions waiting for a pick', c:'var(--accent)', icon:I.split, test:d => d.status==='open' || (d.status==='parked' && due(d)) },
  { k:'review', name:'Needs review', hint:'Found in the code, waiting to be confirmed', c:'#b49cff', icon:I.eye, test:d => d.status==='found' },
  { k:'parked', name:'Parked', hint:'Set aside until a date or a trigger', c:'#7f8aa3', icon:I.clock, test:d => d.status==='parked' },
  { k:'decided', name:'Decided', hint:'Confirmed or picked', c:'var(--good)', icon:I.check, test:d => d.status==='decided' },
  { k:'history', name:'History', hint:'Superseded or rejected', c:'var(--hist)', icon:I.archive, test:d => d.status==='superseded' || d.status==='rejected' }
];
const today = new Date().toISOString().slice(0,10);
function due(d){ return !!(d.revisit && d.revisit.date && d.revisit.date <= today); }
const stateOf = d => STATES.find(s => s.test(d)) || STATES[3];
ALL.forEach(d => d._s = stateOf(d));
const repoName = (location.pathname.split('/').slice(-3,-2)[0] || '');
document.getElementById('repo').textContent = repoName ? '· ' + decodeURIComponent(repoName) : '';

function sub(){
  const counts = STATES.map(s => [s, ALL.filter(d => d._s===s).length]).filter(([,n]) => n);
  document.getElementById('sub').innerHTML = `<span>${ALL.length} decision${ALL.length===1?'':'s'}</span>` + counts.map(([s,n]) => `<span><span class="dot" style="background:${s.c}"></span>${n} ${s.name.toLowerCase()}</span>`).join('');
}

function glance(list){
  const total = list.length || 1;
  const counts = STATES.map(s => [s, list.filter(d => d._s===s).length]).filter(([,n]) => n);
  const bar = `<div class="bar">${counts.map(([s,n]) => `<span style="width:${n/total*100}%;background:${s.c}" title="${n} ${esc(s.name)}"></span>`).join('')}</div>
    <div class="legend">${counts.map(([s,n]) => `<span><i style="background:${s.c}"></i>${n} ${esc(s.name.toLowerCase())}</span>`).join('')}</div>`;
  const tiles = `<div class="tiles">${[...list].sort((a,b)=>a.id-b.id).map(d => `<a class="tile" style="--c:${d._s.c}" href="${esc(d._file)}" title="${pad(d.id)} ${esc(d.title)} · ${esc(d._s.name)}">${pad(d.id).replace(/^0+(?=\d{2})/,'')}<small>${esc(shortTitle(d))}</small></a>`).join('')}</div>`;
  const lenses = [...new Set(list.flatMap(d => d.lenses||[]))].sort();
  const areas = `<div class="areas">${lenses.map(l => { const ds = list.filter(d => (d.lenses||[]).includes(l)).sort((a,b)=>STATES.indexOf(a._s)-STATES.indexOf(b._s)); return `<div class="area"><span>${esc(l)}</span><span class="pips">${ds.map(d => `<a style="--c:${d._s.c}" href="${esc(d._file)}" title="${pad(d.id)} ${esc(d.title)}"></a>`).join('')}</span><span class="n">${ds.length}</span></div>`; }).join('')}</div>`;
  return `<div class="glance">
    <div class="panel"><div class="ptitle">${I.bars}Where things stand</div>${bar}<div style="margin-top:14px">${tiles}</div></div>
    <div class="panel"><div class="ptitle">${I.layers}By area</div>${areas || '<div class="muted">No areas tagged</div>'}</div>
  </div>`;
}
function shortTitle(d){
  const o = (d.options||[]).find(x => x.key === (d.chosen || d.recommended));
  return (o ? o.name : d.title).split(/[;,:(]/)[0];
}

function card(d){
  const o = (d.options||[]).find(x => x.key === d.chosen);
  let line = '';
  if (d.holding_up==='strained' && d.strain) line = `<div class="line warn">${esc(d.strain)}</div>`;
  else if (d.status==='decided' && o) line = `<div class="line ok">${esc(d.chosen)}: ${esc(o.name)}${d.reason?` <span class="muted">· ${esc(d.reason)}</span>`:''}</div>`;
  else if (d.status==='superseded') line = `<div class="line">Replaced by ${pad(d.superseded_by)}</div>`;
  else if (d.status==='parked') { const rv = d.revisit||{}; line = `<div class="line${due(d)?' warn':''}">${due(d)?'Revisit due':'Back'} ${rv.date?esc(rv.date):''}${rv.date&&rv.trigger?' or ':''}${rv.trigger?esc(rv.trigger):''}</div>`; }
  else if (d.status==='rejected') line = `<div class="line">Dropped${d.reason?`: ${esc(d.reason)}`:''}</div>`;
  else { const r = (d.options||[]).find(x => x.key === d.recommended); if (r) line = `<div class="line">${d.status==='found'?'In the code':'Leaning'}: ${esc(r.name)}</div>`; }
  return `<a class="dcard" href="${esc(d._file)}"><div class="row" style="gap:6px"><span class="num">${pad(d.id)}</span>${d.open_item?`<span class="chip bad">open item</span>`:''}${d.status==='parked'&&due(d)?'<span class="chip found">revisit due</span>':''}${d.deep?'<span class="chip open">deep</span>':''}</div><div class="t">${esc(d.title)}</div>${line}<div class="chips">${(d.lenses||[]).map(l=>`<span class="chip">${esc(l)}</span>`).join('')}</div></a>`;
}

const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const CHEV = '<svg class="icon chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
const laneKey = 'crux.repo.' + (repoName || 'repo') + '.openLanes';
let openLanes = new Set(store.get(laneKey) || []);
const CAP = { decided: 3, history: 3 };
function lanes(list, searching){
  const ls = STATES.map(s => [s, list.filter(d => d._s===s).sort((a,b)=>b.id-a.id)]).filter(([,ds]) => ds.length);
  return `<div class="lanes">${ls.map(([s,ds]) => {
    const cap = CAP[s.k] || 5;
    const all = searching || openLanes.has(s.k);
    const shown = all ? ds : ds.slice(0, cap);
    const more = ds.length - shown.length;
    return `<section class="lane" style="--c:${s.c}"><div class="lhead">${s.icon}${esc(s.name)} <span class="count">${ds.length}</span></div><div class="lhint">${esc(s.hint)}</div><div class="cards">${shown.map(card).join('')}</div>${more>0?`<button class="more" data-lane="${s.k}">${CHEV}Show ${more} more</button>`:(!searching && ds.length > cap ? `<button class="more less" data-lane="${s.k}">${CHEV}Show fewer</button>` : '')}</section>`;
  }).join('')}</div>`;
}
document.getElementById('out').addEventListener('click', e => {
  const lb = e.target.closest('[data-lane]');
  if (lb){ const k = lb.dataset.lane; openLanes.has(k) ? openLanes.delete(k) : openLanes.add(k); store.set(laneKey, [...openLanes]); render(); }
});

function depMap(all){
  let list = all;
  const ids = new Set(all.map(d => d.id));
  const byId = new Map(all.map(d => [d.id, d]));
  const deps = d => (d.depends_on||[]).filter(n => ids.has(n));
  const linked = new Set(list.flatMap(d => deps(d).length ? [d.id, ...deps(d)] : []));
  if (!linked.size) return '';
  const loose = list.filter(d => !linked.has(d.id)).length;
  list = list.filter(d => linked.has(d.id));
  const depth = new Map();
  const dep = (d, seen = new Set()) => { if (depth.has(d.id)) return depth.get(d.id); if (seen.has(d.id)) return 0; seen.add(d.id); const v = deps(d).length ? 1 + Math.max(...deps(d).map(n => dep(byId.get(n), seen))) : 0; depth.set(d.id, v); return v; };
  list.forEach(d => dep(d));
  const cols = Math.max(...depth.values()) + 1;
  const colItems = [];
  const rowOf = new Map();
  for (let c = 0; c < cols; c++) {
    const items = list.filter(d => depth.get(d.id) === c);
    const key = d => { const ps = deps(d).map(n => rowOf.get(n)).filter(v => v != null); return ps.length ? ps.reduce((a,b)=>a+b,0)/ps.length : d.id/1000; };
    items.sort((a,b) => key(a) - key(b) || a.id - b.id);
    items.forEach((d, i) => rowOf.set(d.id, i));
    colItems.push(items);
  }
  const W = 190, H = 46, GX = 70, GY = 14, PAD = 6;
  const rows = Math.max(...colItems.map(c => c.length));
  const pos = new Map();
  colItems.forEach((c, ci) => c.forEach((d, ri) => pos.set(d.id, { x: PAD + ci*(W+GX), y: PAD + ri*(H+GY) })));
  const vw = PAD*2 + cols*W + (cols-1)*GX, vh = PAD*2 + rows*H + (rows-1)*GY;
  let edges = '', nodes = '';
  for (const d of list) for (const n of deps(d)) {
    const a = pos.get(n), b = pos.get(d.id);
    const x1 = a.x+W, y1 = a.y+H/2, x2 = b.x, y2 = b.y+H/2;
    let path;
    if (b.x - a.x <= W + GX) { const mx = (x1+x2)/2; path = `M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2-6} ${y2}`; }
    else {
      // Long edge: drop into the gap between rows so it never runs behind a box.
      const yg = b.y > PAD ? b.y - GY/2 : b.y + H + GY/2;
      const g1 = x1 + GX/2, g2 = x2 - GX/2;
      path = `M${x1} ${y1}C${g1} ${y1} ${x1} ${yg} ${g1} ${yg}L${g2} ${yg}C${x2} ${yg} ${g2} ${y2} ${x2-6} ${y2}`;
    }
    edges += `<path d="${path}" fill="none" stroke="var(--faint)" stroke-width="1.3" marker-end="url(#ah)"/>`;
  }
  for (const d of list) { const p = pos.get(d.id); const t = shortTitle(d); nodes += `<a href="${esc(d._file)}"><title>${pad(d.id)} ${esc(d.title)}</title><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="8" fill="var(--surface)" stroke="var(--line2)"/><rect x="${p.x}" y="${p.y+8}" width="3" height="${H-16}" rx="1.5" fill="${d._s.c}"/><text x="${p.x+12}" y="${p.y+19}" font-size="11" font-family="var(--mono)" fill="var(--faint)">${pad(d.id)}</text><text x="${p.x+12}" y="${p.y+35}" font-size="12.5">${esc(t.length > 26 ? t.slice(0,25)+'…' : t)}</text></a>`; }
  return `<h2 class="row" style="gap:7px">${I.tree}What builds on what</h2><div class="panel map"><svg viewBox="0 0 ${vw} ${vh}" style="max-width:${vw}px" role="img" aria-label="Dependency map of decisions"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--faint)" stroke-width="1.5"/></marker></defs>${edges}${nodes}</svg><div class="legend" style="margin-top:8px">Left to right: foundations first. ${loose ? `${loose} decision${loose===1?' stands':'s stand'} on ${loose===1?'its':'their'} own and ${loose===1?'is':'are'} not shown here.` : ''}</div></div>`;
}

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = ALL.filter(d => !q || JSON.stringify([d.title,d.context,d.reason,d.strain,(d.lenses||[]),(d.options||[]).map(o=>o.name+' '+o.summary)]).toLowerCase().includes(q));
  if (!list.length){ document.getElementById('out').innerHTML = `<div class="empty">${ALL.length ? 'No matches' : 'No decisions yet'}</div>`; return; }
  document.getElementById('out').innerHTML = glance(list) + `<h2 class="row" style="gap:7px">${I.grid}Board</h2>` + lanes(list, !!q) + depMap(list);
}
sub();
document.getElementById('q').addEventListener('input', render);
render();
</script>
<script>
// Links to the Crux hub: shown when the page comes from the hub, or when a running hub answers on this machine.
(() => {
  const show = (id, href) => { const a = document.getElementById(id); if (a) { if (href) a.href = href; a.hidden = false; } };
  if (location.protocol !== 'file:') { show('hub-link', '/'); show('all-link', '/all'); return; }
  fetch('http://localhost:4747/api/ping').then(r => { if (r.ok) show('hub-link'); }).catch(() => {});
})();
</script>
