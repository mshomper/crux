<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Crux</title>
<style>
:root{--bg:#f7f6f2;--surface:#ffffff;--surface2:#f1efe8;--text:#22211e;--muted:#6b6a64;--line:#dedcd3;--accent:#3c6fb0;--accent-bg:#e6eef8;--good:#2f7a4a;--good-bg:#e5f2ea;--warn:#a2620f;--warn-bg:#f8eedc;--bad:#a83a32;--bad-bg:#f8e6e4;--chosen:#2f7a4a;--radius:10px;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--surface:#242422;--surface2:#2d2d2a;--text:#ecebe6;--muted:#a3a29b;--line:#3a3a36;--accent:#7fa9e0;--accent-bg:#22324a;--good:#78c495;--good-bg:#1f3428;--warn:#e0a85a;--warn-bg:#3a2d18;--bad:#e5877f;--bad-bg:#3d2220;--chosen:#78c495}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 var(--font);overflow-wrap:anywhere}
main{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;font-weight:600;margin:4px 0 8px;line-height:1.3}
h2{font-size:16px;font-weight:600;margin:28px 0 10px}
h3{font-size:15px;font-weight:600;margin:0}
p{margin:0 0 10px}
a{color:var(--accent)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.open{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.chip.decided{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.found{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.superseded,.chip.rejected{text-decoration:line-through}
.icon{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.btn{font:inherit;font-size:14px;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
input,textarea{font:inherit;width:100%;max-width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
svg{max-width:100%}

.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)}
.brand .mark{width:28px;height:28px;flex:none}
.brand b{font-size:17px;letter-spacing:.2px}

.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-decoration:none;color:inherit}
.item:hover{border-color:var(--muted)}
.num{font-family:var(--mono);color:var(--muted);font-size:13px;padding-top:2px}
.item.dim{opacity:.55}
.pick{font-size:14px}
.pick b{color:var(--chosen)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
</style>
</head>
<body>
<main>
<div class="brand"><svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="var(--muted)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 44V27M24 27L10 12M24 27V9"/><circle cx="10" cy="10" r="3"/><circle cx="24" cy="6" r="3"/></g><path d="M24 27L38 12" stroke="var(--accent)" stroke-width="3.4" stroke-linecap="round"/><circle cx="39" cy="10" r="4.5" fill="var(--accent)"/><circle cx="24" cy="27" r="3" fill="var(--accent)"/></svg><b>Crux</b></div>
<h1 style="margin-top:14px">Decisions</h1>
<div class="stats" id="stats"></div>
<input id="q" type="search" placeholder="Search titles, options, reasons" aria-label="Search decisions">
<div id="out"></div>
</main>

t be modelled in the pull-out solver?","date":"2026-11-02","mode":"full","lenses":["solver","architecture"],"status":"open","context":"Pull-out force depends heavily on how thread flanks engage the foam. The current grid-based contact smears the interface over one cell, which may underpredict peak force on fine threads.","depends_on":[1],"conflicts":[],"options":[{"key":"A","name":"Keep grid contact, refine locally","summary":"Leave the contact method alone and add a finer grid band around the screw.","pros":["Smallest code change","Existing calibration largely holds"],"cons":["Run time grows with band size","Still smears the interface, just less"],"effort":"A few days","assumptions":["Under-prediction comes mainly from grid resolution, not the contact rule itself"],"risks":["Band size needed for convergence may make runs too slow to compare many designs"],"estimates":[{"what":"Run time","value":"about 2 to 3 times current","basis":"band roughly doubles the active cells near the screw"}]},{"key":"B","name":"Explicit thread surface","summary":"Represent the thread as a rigid surface and resolve contact against it directly.","pros":["Captures flank engagement directly","Sensitivity to thread pitch becomes visible"],"cons":["New contact code on the GPU","Needs recalibration against pull-out tests"],"effort":"Two to three weeks","assumptions":["Thread geometry can be imported cleanly as a rigid surface","Foam crush behavior near the flank is captured by the existing material model"],"risks":["New GPU contact code may be unstable at large penetrations"],"estimates":[{"what":"Run time","value":"similar to current","basis":"contact check is per particle near the surface only"},{"what":"Effort","value":"two to three weeks","basis":"new contact pass plus a recalibration round"}]},{"key":"C","name":"Empirical correction factor","summary":"Keep the solver and multiply peak force by a factor fitted from test data per thread family.","pros":["No solver change","Fast to ship"],"cons":["Hides the physics","Breaks on thread designs outside the fitted set"],"effort":"A day plus test data","assumptions":["Thread designs users test stay close to the fitted set"],"risks":["A factor fitted on one foam grade may not transfer to another"],"estimates":[{"what":"Effort","value":"about a day","basis":"fit from existing test results"}]}],"criteria":[{"name":"Physical fidelity","scores":{"A":2,"B":3,"C":1}},{"name":"Run time","scores":{"A":2,"B":2,"C":3}},{"name":"Calibration effort","scores":{"A":3,"B":1,"C":2},"note":"B needs a fresh round against held-back tests."},{"name":"Credibility to a reviewer","scores":{"A":2,"B":3,"C":1}}],"recommended":"B","recommendation":"Thread pitch is what users are comparing, and only an explicit surface resolves it. Worth confirming against two or three held-back tests before trusting it.","confidence":"lean","chosen":null,"reason":null,"decided_on":null,"superseded_by":null,"challenge":null,"deep":true,"evidence":[{"claim":"Grid-based contact in material point methods spreads the interface across about one cell, which softens sharp features.","options":["A","B"],"source":"Example source (placeholder)","url":"https://example.com/mpm-contact"},{"claim":"Pull-out strength in foam is sensitive to thread pitch and flank angle.","options":["B","C"],"source":"Example source (placeholder)","url":"https://example.com/pullout-foam"},{"claim":"A correction factor is unlikely to survive large changes in thread form, since it cannot respond to geometry.","options":["C"],"judgment":true}],"change_mind":"If refining the grid band alone closes most of the gap to held-back tests, A wins on effort.","_file":"0003-contact-model.html"},{"id":4,"slug":"preset-storage","title":"Where should study presets be saved?","date":"2026-11-01","mode":"full","deep":true,"lenses":["data-model","ui"],"status":"decided","context":"Users want to save and share a full study setup.","depends_on":[1],"conflicts":[],"options":[{"key":"A","name":"In the page <script>
const ALL = JSON.parse(document.getElementById('data').textContent);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(4,'0');
const count = s => ALL.filter(d => d.status === s).length;
document.getElementById('stats').innerHTML = [['open','Open'],['found','Needs review'],['decided','Decided'],['superseded','Superseded']]
  .filter(([s]) => count(s)).map(([s,l]) => `<span class="chip ${s}">${count(s)} ${l.toLowerCase()}</span>`).join('');
function card(d){
  const o = (d.options||[]).find(x => x.key === d.chosen);
  const pick = d.status==='decided' && o ? `<div class="pick"><b>${esc(d.chosen)}: ${esc(o.name)}</b>${d.reason?` <span class="muted">· ${esc(d.reason)}</span>`:''}</div>`
    : d.status==='superseded' ? `<div class="pick muted">Replaced by ${pad(d.superseded_by)}</div>`
    : `<div class="pick muted">${(d.options||[]).length} options waiting</div>`;
  return `<a class="card item${['superseded','rejected'].includes(d.status)?' dim':''}" href="${esc(d._file)}">
    <span class="num">${pad(d.id)}</span>
    <div style="min-width:0;display:grid;gap:4px">
      <div class="row"><b style="flex:1;min-width:0">${esc(d.title)}</b><span class="chip ${esc(d.status)}">${esc(d.status==='found'?'needs review':d.status)}</span></div>
      ${pick}
      <div class="row">${(d.lenses||[]).map(l=>`<span class="chip">${esc(l)}</span>`).join('')}<span class="muted" style="font-size:12px">${esc(d.decided_on||d.date)}</span></div>
    </div></a>`;
}
function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const hit = d => !q || JSON.stringify([d.title,d.context,d.reason,(d.options||[]).map(o=>o.name+' '+o.summary)]).toLowerCase().includes(q);
  const groups = [['Needs your call', d => d.status==='open' || d.status==='found'], ['Decided', d => d.status==='decided'], ['History', d => d.status==='superseded' || d.status==='rejected']];
  let h = '';
  for (const [name, f] of groups){
    const list = ALL.filter(d => f(d) && hit(d)).sort((a,b) => b.id - a.id);
    if (list.length) h += `<h2>${name}</h2><div class="list">${list.map(card).join('')}</div>`;
  }
  document.getElementById('out').innerHTML = h || `<div class="empty">${ALL.length ? 'No matches' : 'No decisions yet'}</div>`;
}
document.getElementById('q').addEventListener('input', render);
render();
</script>
</body>
</html>
